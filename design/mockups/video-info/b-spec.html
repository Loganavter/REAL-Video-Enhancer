<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video info — B: spec sheet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="panel">

  <!-- A spec sheet: the reader scans a column of values, not a paragraph of arrows.
       Same rows as today, grouped by what they describe. -->
  <div class="card">
    <div class="card-head">
      <span class="title">Source</span>
      <span class="tag neutral">in</span>
    </div>
    <div class="group">
      <div class="row"><span class="k">Resolution</span><span class="dots"></span><span class="v">1440 × 1080</span></div>
      <div class="row"><span class="k">Frame rate</span><span class="dots"></span><span class="v">24.000 fps</span></div>
      <div class="row"><span class="k">Frames</span><span class="dots"></span><span class="v">493</span></div>
      <div class="row"><span class="k">Pixel format</span><span class="dots"></span><span class="v">yuv420p10le</span></div>
      <div class="row"><span class="k">Colour</span><span class="dots"></span><span class="v">bt709 · 10 bit</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="title">Output</span>
      <span class="tag">2× upscale</span>
    </div>
    <div class="group">
      <div class="row"><span class="k">Resolution</span><span class="dots"></span><span class="v">2880 × 2160</span></div>
      <div class="row"><span class="k">Frame rate</span><span class="dots"></span><span class="v">24.000 fps</span></div>
      <div class="row"><span class="k">Frames</span><span class="dots"></span><span class="v">493</span></div>
      <div class="row"><span class="k">Encoder</span><span class="dots"></span><span class="v">libx264 · mkv</span></div>
      <div class="row"><span class="k">Pixel format</span><span class="dots"></span><span class="v">yuv420p10le</span></div>
      <div class="row"><span class="k">HDR</span><span class="dots"></span><span class="v dim">no</span></div>
    </div>
  </div>

  <div class="card">
    <div class="progress-body">
      <div class="line">
        <span class="left">44 / 493</span>
        <span class="right">9 % · ETA 0:00:23</span>
      </div>
      <div class="bar"><i></i></div>
      <div class="foot">
        <span class="pill">19 fps</span>
        <span>Rendering</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
