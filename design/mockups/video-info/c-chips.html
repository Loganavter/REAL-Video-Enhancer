<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video info — C: chips</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="panel">

  <!-- The most compact reading: one row of facts, the run folded into the transport bar it belongs to.
       Nothing is hidden that the eye needs at a glance; the spec sheet (B) stays available on demand. -->
  <div class="card">
    <div class="chips">
      <span class="chip strong">2880 × 2160</span>
      <span class="chip"><span class="u">from</span> 1440 × 1080</span>
      <span class="chip">24 fps</span>
      <span class="chip">493 <span class="u">frames</span></span>
      <span class="chip">libx264 <span class="u">/</span> mkv</span>
      <span class="chip">10 <span class="u">bit</span></span>
      <span class="chip">bt709</span>
      <span class="chip"><span class="u">HDR</span> no</span>
    </div>

    <div class="transport">
      <span class="num">44 / 493</span>
      <div class="bar"><i></i></div>
      <span class="num">9 %</span>
      <span class="pill">19 fps</span>
      <span class="num">−0:23</span>
    </div>

    <div class="progress-body" style="padding-top:0">
      <div class="foot" style="margin-top:0">
        <span>Rendering</span>
        <span class="dim" style="margin-left:auto">8 s elapsed</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
