- id: int8-d2-owner-split
  lane: int8
  status: superseded
  scope: the app's own int8 fit probe, Chainsaw Man 20 s and Violet Evergarden 20 s at 1920x1080, three
    sample sizes (8 / 12 / 16 test pairs)
  date: 2026-11-17
  superseded_by: int8-fails-on-bd
  statement: >-
    The depth-2 refusal has two different owners, and the control that separated them needed no int8:
    on the same pairs and the same separation, fp16(t) against fp16(t-2) reads 0.191% / 0.139% / 0.158%
    on Chainsaw against the 0.1% bar, so the gate refuses material that a renderer with no quantisation
    error also fails, and int8 adds only 0.017-0.027 pp there. On Violet the same control reads 0.077%
    on the product's 8-pair sample (where int8 reads 0.167% and refuses) and 0.013% / 0.0045% at 12 and
    16 pairs (where int8 reads 0.038% / 0.083% and passes) - so that refusal belongs to the sample, not
    to the material, and the quantiser owns 95% of Violet's depth-2 number there.
  evidence: harness/docs/wsp/verified/int8-d2-control.txt
  open_question: >-
    The depth-2 statistic rests on the intersection of the test pairs with the pairs the gate would
    reuse: 2 pairs on Chainsaw at the sample the product uses, against 8 for the engine statistic and
    the 13-19 the protocol asks. A verdict that moves between 0.038% and 0.167% across samples on a
    0.1% bar is not yet a measurement of the material. Every number here was re-measured after the
    reference fix (ref taken from the original weights, not fp16 on int8-rounded ones): Chainsaw moved
    by 0.02%, Violet by 37-214%, which is why the Violet figures differ from the first version. The
    gate's own threshold is not a lever here either: 0.2177% at 3.0, 4.0 and 5.0 - the damaged pair is
    inside the certificate at every setting, so only the statistic or an output-side certificate moves
    it. With the channel-max statistic and the probe's filter on the same variable, Chainsaw reads
    0.0034% at 32 triples (3 depth-2 pairs) and passes; Violet still fails, on depth 1 (0.108%), where
    no reuse is involved - that is the quantiser's own error on that material, not the gate's. At the
    product's default 16 triples Chainsaw has no depth-2 pair at all, so its verdict there rests on
    depth 1 alone. MEASURED ON THE WHOLE CLIP 2026-11-18: the int8 body under the channel-max gate
    reads 0.08876% on its worst frame (441) with ZERO frames above the bar, against 0.07546% for fp16
    under the same gate - a 1.18x increment where the probe predicted 1.13x from its pairs, so that
    factor transfers on this material and the additive form does not. Violet under the same 0.07%
    threshold (out-of-sample, 70.8% reuse, chain 4) reads 0.07345% with nothing above the bar, so the
    threshold transfers too. Forcing the body past the probe on Violet reads 0.12727% with 3 of 480
    frames above the bar (all three reused), and the refusal there is real - but only after the forced
    flag stopped bypassing the probe: the first forced run read 0.56613% with 372 frames because
    `--int8_fit int8` skipped the decode that hands the body its spread calibration, leaving it on one
    frame (violet-calibration-fix). That reading is withdrawn.
    The probe is systematically optimistic against the render on both clips (Chainsaw 0.000 against
    0.08876) and is a screen, not a certificate - and on Violet the per-frame int8/fp16 ratio is
    7.31 median, so the 1.18x measured on Chainsaw is a ratio of maxima, not a transferable factor.
    WALL, fixed output cost (wall-fixed-cost): int8 45.02 ms/frame against fp16 50.33 at the same
    17.3% reuse, i.e. 1.118x - the retracted 1.55x was an ffv1 entropy effect, and 1.118 is below the
    1.49-1.505 engine ratio as Amdahl requires. Depth table from the render's own log (83 reuses,
    41/36/6): worst HR 0.07546% at depth 1 (frame 475, the clip's worst), 0.02670 at d2, 0.00917 at
    d3. The probe's reference is now the app's own TRT engine (`probe(..., engine_ref=...)`, falling
    back to torch when none is passed), and it matters on Violet: depth-2 composition 0.168% -> 0.216%,
    own defect 0.044% -> 0.081%, while Chainsaw moves 0.110% -> 0.109% (trt-reference). The fp16 control
    stays ~6% above the full sweep on both clips, so the residual gap is the pair set - the probe
    re-decides which frames the gate reuses - and `harness/scripts/check_control_ceiling.py` still reports the
    violation. SHIPPED 2026-11-18: `RenderVideo._probe_int8_fit` passes `engine_ref=self.upscaleOption`,
    so the product's own probe measures against the engine it falls back to. The product reads Chainsaw
    0.001% (int8) and Violet d1 0.139% / d2 0.216% (fp16) - the verdicts are unchanged, Violet's
    margins move by 29% at depth 2 and 86% on the own defect (product-probe-engine). THE 89x GAP IS THE
    PAIR SELECTION, NOT THE ENGINE: frame 441 (the int8 worst) is a depth-1 reuse with an fp16 share of
    0.07489%, and over the render's population int8 reads 0.08876% on the 83 reused frames against
    0.00034% on the 398 rendered ones - the engine's own error is 260x below the composition term, so
    the probe's 0.001% engine reading is correct and the under-read is entirely in composition
    (probe-owner-and-scan-cost). Closing it needs the adversarial path, which costs 11.5 s of scan plus
    ~6.5 s of renders on a 45 s probe (+40%) - a cost decision, not a free default. And the invariant is
    one-sided: `control <= sweep` fires on Violet's int8 side (1.09x, 1.70x) but is blind to Chainsaw's
    89x under-read. THE ENGINE IS CLEAN ON CHAINSAW: split by population, int8 reads 0.08876% on the
    83 reused frames against 0.00034% on the 398 rendered ones - 260x - so the probe's 0.001% engine
    reading is correct and the whole gap is pair selection. On Violet the split is different: 0.12727%
    on 336 reused against 0.08738% on 144 rendered, i.e. the engine eats 87% of the bar there
    (probe-owner-split-and-band). The marginal band around 0.07 holds exactly one frame (475, HR
    0.07546, under the bar), so the 1.6% simulation/product jitter cannot hide a failure. The int8
    increment is additive, not multiplicative: over Violet's 67 pairs with an fp16 share of at least
    0.01% it is 0.0215 pp median (max 0.0538), and 0.0139 pp on Chainsaw's worst. The null-path wall is
    a lower bound (rgb24 carries 24.9 MB/frame against yuv420p's 12.4, so the shipped figure is ~1.18x).
    OPEN FOR THE OWNER: the product probe reads Violet's int8 peak at 128 levels against
    bar_int8_peak = 20 and the ~100 of the artifact the owner rejected by eye; the product does not
    refuse on the peak, so a title at 0.09% share and peak 128 would be certified
    (ratio-floor-payload-and-peak) - though in the space the bar is defined in the peak is 146 on
    Violet's int8 and 149 on its fp16, i.e. the material's, not an int8 increment (shipped-cell-and-coverage).
    THE SHIPPED CELL IS fp16 + LUMA, NOT int8: under the defaults the probe reads d1 0.001% but takes
    the verdict on d2 = 0.220% and refuses int8, so what ships today is the luma gate's 0.49372% with
    18 frames above the bar. Frame 475 is a legitimate reuse (the gate logged share 0.06887, not the
    simulation's 0.07108). And the probe's coverage is 4 of the render's 83 reuses (4.8%), zero of the
    42 served at depth 2 or deeper. ADVERSARIAL SELECTION IMPLEMENTED 2026-11-18
    (`probe(..., adversarial=k)`): scan the whole clip with the gate's statistic, rank the reuses it
    would make, render the top-k. On Chainsaw that moves the number from 0.000% (no depth-2 pair in the
    product's 16 triples) to 0.110% with an fp16 control of 0.083% - from 26x under the render's
    0.08876% to 1.24x over it, flipping the verdict to fp16. The probe now errs by refusing a passing
    configuration rather than by admitting a failing one (probe-adversarial). On Violet nothing moves
    (0.168% either way): with 70.8% reuse the spread sample already lands on the damage. The probe certifies depths 1-2 while the gate serves 3 (6 of 78 reuses),
    but the damage is at depth 1: worst HR 0.07489 / 0.02670 / 0.00917% at depths 1 / 2 / 3. The population question is now closed by the
    render control: gated against ungated on the product reads 0.494% on the worst frame, so the
    probe's depth-2 number was measuring the right thing - see gate-exceeds-acceptance-bar. What is
    left is the sample size, and the cost of raising it (probe-cost: 45.1 s now, ~90 s at 32 triples).

- id: gate-exceeds-acceptance-bar
  lane: reuse
  status: superseded
  scope: the app's shipped fp16 render, Chainsaw Man 20 s, 1920x1080 -> 2160p, auto gate (mean_abs,
    threshold 4.0, chain 3, 100/481 frames reused) against the same clip with --no_temporal_reuse
  date: 2026-11-17
  superseded_by: gate-exceeds-bar-on-bd
  statement: >-
    The gate's reuse moves 18 of 481 frames past the bar the gate family was certified on: the worst
    frame by share (164) has 0.49372% of its pixels more than 8 levels off the ungated render, and the
    worst peak on the clip is 75 levels (frame 432) against the 8 s sample's 0.005% and peak 14. The A/A
    is exact - 481 of 481 decoded frames identical - and only reused frames can differ, so the
    difference is the gate. The bar is the gate's own criterion (the moved-fist artifact: 0.009%
    shipping, 0.287% for the rejected tile configuration), so this is a portability failure rather than
    a foreign yardstick - but the 8 s and 20 s numbers are different populations (worst of ~15 frames in
    an 8 s window against worst of 481), so a "99x regression" is not established. What is established:
    the shipped gate exceeds its own bar on 18 of 481 frames of this clip. Two 20 s action cuts at the
    owner's timestamps do NOT fail - noise floors 22.58 and 36.73 put them above the 1.5 limit, the
    tuner refuses reuse, and the sweep reads 0.00000% on both - so the trigger is clean material with
    motion the block mean does not see, not motion. A threshold of 3.0, forced and measured on the
    product, removes 12 of the 18 for 18.3% reuse (against 20.8%) - 48.85 ms against 47.58 ms, +2.7% of
    the wall - and all 12 dropped reuses were defective frames - no good frame lost. It does NOT
    unblock int8: the probe's depth-2 number on Chainsaw is 0.2177% at gate thresholds 5.0, 4.0, 3.0
    and 2.0 - the whole tuner clamp - because the damaged pair is under the tightest setting the tuner
    can pick (probe-threshold-invariance). The fix is the projection, not the threshold: recomputing
    the same statistic in channel-max instead of luma separates all 18 bad frames from all 82 good ones
    (AUC 1.000 at 6 and 8 levels), puts frame 164 at rank 1 of 100 instead of 27, and a 0.07% LR
    threshold blocks exactly the 18 for 4.0% of the wall with no good frame lost (gate-channel-max).
    That fix alone does not unblock int8: the surviving population's worst HR share is 0.0755%, 0.0245
    pp under the bar, against a measured int8 increment of 0.0267 pp. And the threshold is a fit to this
    clip - the LR-to-HR ratio has a median of 2.04 and a p90 of 9.50, so a constant LR threshold does
    not transfer and the tuner's own calibration frames are the right place to measure it.
    SHIPPED AS AN OPTION AND MEASURED ON THE PRODUCT 2026-11-18: the channel-max gate at 0.07% reuses
    83/481 (17.3%) and puts ZERO frames above the bar, worst 0.07546% on frame 475 - the surviving
    maximum predicted from the 100-frame analysis, to four digits. Frame 164 goes 0.49372% -> 0.00000%.
    Wall +3.8% by the two-point model. int8 opens on Chainsaw as a side effect: depth-2 composition
    0.0034% at 32 triples against 0.1748% under the luma gate. It is NOT a drop-in replacement: on
    the calm 8 s Chainsaw cut at matched chain 2 it reads 0.02932% at peak 22 against the luma gate's
    0.00274% at peak 16 - both under the bar, margin 36x to 3.4x - while the calm Violet cut is
    unchanged (0.04989% at peak 18, 235 of 250 frames byte-identical). A share threshold accepts a
    small area with a large delta, and the two statistics are complementary: the gate needs the share
    for the broad shallow class and a block-max for the narrow deep one (gate-channel-max-calm). An
    earlier reading of 0.08769% at peak 116 came from an unmatched chain (3 against the baseline's 2)
    and is kept in that file as a labelled row, not as a comparison. THE FLIP FAILED ITS OWN CONDITION
    2026-11-18: on Violet 20 s the channel-max gate keeps the same worst share (0.07345%, frame 227)
    and the same zero violations but raises the peak from 49 to 149, pixels above 55 from 0 to 3399,
    and the worst 64 px block mean from 2.49 to 37.27 - five times the 7.57 of the artifact the owner
    rejected by eye (flip-condition). The deciding cell is the comparison of the two gates on the
    SAME clip and comparator (luma-cell-block-mean): Violet's worst block mean is 3.78 under luma and
    37.27 under channel-max (5.32 / 60.88 at 32x32 blocks), on different frames, with the same worst
    share and zero violations - so the channel-max gate introduces the class and the luma gate does not
    have it. Held until a channel-max pixel veto exists: max_block_mean dilutes the peak and the luma
    veto cannot see it. (The 7.57 'rejected fist' figure is the owner's and is not present in the repo;
    it is context, not a checked anchor.)
  evidence: harness/docs/wsp/verified/gate-default-vs-ungated.txt
  open_question: >-
    Two classes, and only one is visible to the gate. Seventeen of the eighteen are the moving-edge
    class, with LR max deltas of 41-75; the pixel veto that would catch them (16 of 18 at 40 levels, for
    18% of the reuse) is OFF in the shipped auto path. The eighteenth is the worst by share and is a
    saturated white region shifted 8-14 levels: its LR max delta is 5.25 and not one LR pixel moves by
    more than 8, and every bad pixel sits at 252/255 - so no LR statistic can see it and its visibility
    is doubtful. Its structure is now measured: the difference is in the R channel only (gated 255
    against ungated 244 at every one of the 40951 pixels, G and B identical at 255), i.e. the stale
    reference freezes a clipped highlight one step whiter - and a difference in an already-saturated
    channel is where an absolute 8-level threshold is blind by construction. Whether 8-14 levels at 252 counts is an owner decision, and the 18 frames have not been
    looked at. The 8 s shipping numbers are NOT under-sampled: re-made and swept in full they read
    0.00274% and 0.04989% with zero frames above the bar (eight-second-sweep), so this failure is the
    content of this segment - 20.8% reuse at a noise floor of 0.66 against 66% at 0.95 - and no sample
    size inside a calm cut would have shown it.

