    prior-art sweep (projects/rve/docs/notes/PRIOR-ART-reuse-detail-2026-11-20.md) says the same thing from outside: the graphics
    line''s best answer (variance clipping, k-DOP, 2024) documents that it cannot detect stale history whose colour
    lies inside the local gamut, and measured on our four failing frames variance clipping moves them by at most
    0.003% while taking passing frames from 0.007% to 0.30%; the VSR line''s efficient systems (RLSP 2019,
    RelayVSR 2026) all keep a network pass on every frame and carry the detail in the state, and their own sweep
    shows quality falling monotonically with the reuse interval.'

