    orders of magnitude: Violet reads 0.53318% of pixels above 8 levels on the worst frame (29) with
    reuse OFF - 356 of 494 frames above the 0.1% bar, peak 65, and 0.71096% / 432 frames when the
    channel-max gate reuses - while the calm Chainsaw same-shot cut reads 0.00339% with ZERO frames
