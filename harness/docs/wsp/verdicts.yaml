# Verdicts: the current state of each research lane, and what replaced what.
#
# Why this file exists: on 2026-11-17 an agent assembled "four walls" for int8 - the TRT two-pass
# build, a TRT-plan rate, a precondition from an early report, and a plugin cost - and concluded the
# lane was blocked for weeks. Three of the four had been superseded days earlier by our own
# measurements, which sat LOWER IN THE FILE than the verdicts they replaced. The harness could not
# see it: every number was correctly recorded. What was missing was that a record does not only carry
# a value - it carries a LIFETIME, and a stale verdict outranks a fresh measurement whenever the
# reader goes top-down.
#
# The rule this file enforces (mechanically, in harness/verdicts.py):
#   * `scope` is mandatory. "per-channel PReLU cannot join an int8 epilogue" is true of TRT and false
#     of our own Triton kernel, and without `scope` it is one statement that travels anywhere.
#   * a verdict with status `superseded` or `refuted` MUST name its replacement, and that replacement
#     must itself be current. A claim citing a superseded verdict is REFUSED, not warned about.
#   * `date` is mandatory: a supersession chain without dates cannot tell which measurement is newer.
#   * this file is the ONLY entry point. The ledger, MODEL.md and the reports are history and may
#     contain superseded verdicts; `harness.cli current-state` renders what is true now.

- id: trt-int8-two-pass
  lane: int8
  status: superseded
  scope: TRT explicit Q/DQ build, per-tensor activation scales, 2026-11-15
  date: 2026-11-15
  statement: >-
    Per-channel PReLU cannot join a TRT int8 epilogue, so each of the 16 convs pays an
    int8->fp16->int8 hop: 17 PointWise passes worth 32.7 ms, 21 reformats worth 5.6 ms, 68.11 ms
    against 55.54 fp16 (0.82x). Rejected as quantised.
  evidence: harness/docs/wsp/verified/engine-int8.txt
  superseded_by: int8-triton-block
  note: >-
    The measurement is sound and the mechanism it names is real FOR TRT. It is superseded because the
    epilogue was then written by us: the hop is a property of TRT's builder, not of int8 or of PReLU.

