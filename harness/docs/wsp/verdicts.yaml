- id: pyramid-budget
  lane: engine
  status: current
  scope: whole 16-boundary body, 1080p and 4K, CPU arithmetic
  date: 2026-11-17
  statement: >-
    The L2 reuse buffer is 7.5 MB at 1080p and 15.0 MB at 4K, both inside 32 MiB, but the fp16 compute
    floor (33.1 / 132.2 ms) sits above the unabsorbed DRAM time (29.5 / 118.0 ms), so absorbing the
    traffic cannot raise the roofline: 1080p is 56.8 ms measured against a 33.1 ms floor = 1.72x
    whatever L2 does.
  evidence: harness/docs/wsp/verified/pyramid-budget.txt
  note: >-
    Phase 2 (a fused prototype) is not justified: it would have to beat 56.8 -> 33.1 ms with a schedule
    the builder cannot emit. The 1/3 absorption cited by earlier versions is one kernel's ncu hit rate
    applied to sixteen boundaries.

