- id: report8-no-temporal-reuse
  lane: int8
  status: refuted
  scope: REPORT-int8-lane-2026-11-16 section 8, launch precondition
  date: 2026-11-16
  statement: >-
    The int8 body does not run in the shipped configuration: --no_temporal_reuse is a precondition
    because the gate creates a tile_upscaler and the body branch in _call_single is never taken.
  evidence: docs/REPORT-int8-lane-2026-11-16.md
  superseded_by: int8-restart-under-gate
  note: >-
    Refuted by the restart in the same report: tilesize=0 -> tile_upscaler=False, and the temporal
    gate is a different mechanism that creates no tile_upscaler, so the body branch IS reachable under
    the gate.

