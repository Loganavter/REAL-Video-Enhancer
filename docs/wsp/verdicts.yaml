- id: int8-composition-d2
  lane: int8
  status: current
  scope: composition at the depth the gate serves, two titles, 6 pairs each
  date: 2026-11-17
  statement: >-
    At depth 2 the passing composition reads 0.390% (Chainsaw) and 0.166% (Violet) against a 0.1%
    bar, so both titles refuse. At depth 1 the same filter reads 0.002% and 0.104%.
  evidence: docs/claims-int8-stage4.txt
  open_question: >-
    Chainsaw is 195x its own depth-1 and 78x the fp16 gate's 0.005% at the same depth, while Violet is
    1.6x / 1.73x - inside the measured range. One of the two numbers is probably not the population it
    is labelled with. The discriminating control needs no int8: fp16(t-2) against fp16(t) on the same
    pairs, at the gate's depth.

