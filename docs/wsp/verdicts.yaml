- id: e17-prelu-rewrite
  lane: engine
  status: superseded
  scope: TRT graph, C=64, 2026-11-15
  date: 2026-11-15
  statement: >-
    Rewriting PReLU as a*x+(1-a)*ReLU(x) does not remove the boundary: it trades one 1.8 ms pass for
    two. Closed together with E9'.
  evidence: docs/wsp/verified/prelu-forms.txt
  superseded_by: b3-prelu-forms
  note: >-
    The conclusion survives (the rewrite buys nothing) but the mechanism does not: at C=32 the PReLU
    fuses on its own and the rewrite is 6% SLOWER, not boundary-for-boundary.

- id: model-exactly-one-route
  lane: int8
  status: superseded
  scope: MODEL.md section 6, "distance to 2x"
  date: 2026-11-15
  statement: >-
    A per-channel slope has no scalar stand-in, so there is exactly one route: a plugin with its own
    int8 convolution, which is weeks of CUDA against a wheel that ships no NvInfer.h.
  evidence: docs/RESEARCH-LEDGER.md
  superseded_by: int8-graph-launcher
  note: >-
    Superseded on the delivery half, not on the precision half: 16 int8 launches run under one CUDA
