- id: pyramid-budget
  lane: engine
  status: current
  scope: whole 16-boundary body, 1080p and 4K, CPU arithmetic
  date: 2026-11-17
  statement: >-
    The L2 reuse buffer is 7.5 MB at 1080p and 15.0 MB at 4K, both inside 32 MiB, but the fp16 compute
    floor (33.1 / 132.2 ms) sits above the unabsorbed DRAM time (29.5 / 118.0 ms), so absorbing the
    traffic cannot raise the roofline: 1080p is 56.8 ms measured against a 33.1 ms floor = 1.72x
    whatever L2 does.
  evidence: docs/wsp/verified/pyramid-budget.txt
  note: >-
    Phase 2 (a fused prototype) is not justified: it would have to beat 56.8 -> 33.1 ms with a schedule
    the builder cannot emit. The 1/3 absorption cited by earlier versions is one kernel's ncu hit rate
    applied to sixteen boundaries.

- id: cone-budget
  lane: reuse
  status: current
  scope: 16-layer body, changed square r=5..40 px, cone halo (17-L) per layer
  date: 2026-11-17
  statement: >-
    The cone is 2.54x less work than the cylinder at r=5 and 2.12x at r=10 (1-D control reproduces the
    ledger's 2.00x), but sixteen launches cost 0.08 ms while the work at r<=20 is below that: the prize
    is 0.08-0.27 ms instead of a 56.8 ms re-render, not a ratio on the engine.
  evidence: docs/wsp/verified/cone-budget.txt
  open_question: >-
    Phase 2 needs a region-level certificate, which does not exist: the gate's veto is frame-level, and
    the seams between a recomputed cone and a reused neighbourhood are the artifact class that made
    tile reuse read 0.287%.

- id: int8-window-measured
  lane: int8
  status: current
  scope: our Triton int8 chain (epilogue kernel, BM 256, channels_last head/tail), 1920x1080, gate off, no encoder, calibration on 3 frames
  date: 2026-11-17
  statement: >-
    The window is 37.46-37.73 ms = 26.50-26.70 fps, against a same-process fp16 TensorRT plan at
    53.25-53.56 ms = 18.7 fps: 1.41-1.42x, which clears the accepted bar_int8_window of 1.4x. The
    16-hop chain is 29.4-29.6 ms (1.84 ms/hop, 84 TOPS); head+quantise 1.6-2.6 ms; tail 7.9-8.5 ms.
  evidence: docs/wsp/verified/int8-window.txt
  open_question: >-
    The picture does not hold: worst of 4 frames is 0.728% against the 0.1% bar (peak 87-144), with the
    held-out frame at 0.728% and calibration over 3 frames; the prologue form reads 0.741% on the same
    frames, so the fast kernel is quality-neutral and the failure is the grids/calibration recipe, the
    same class as the recorded depth-2 composition failure.

- id: int8-body-hop
  lane: int8
  status: current
  scope: body_kernel (our Triton int8 conv + per-channel PReLU + per-channel requant), 1920x1080, swept BLOCK_M and warps
  date: 2026-11-17
  statement: >-
    One hop is 1.82 ms at BLOCK_M 256 with 4 warps (84 TOPS), 2.38 ms at 128/4 and 4.06 at 64/4;
    BLOCK_M 512 with 4 warps collapses to 79 ms/hop (register pressure). The 16-hop chain with the
    per-layer tensors precomputed is 29.07-29.64 ms.
  evidence: docs/wsp/verified/int8-window.txt
  note: >-
    84 TOPS is above the 79.2 TOPS the TRT int8 plan reaches (trt-int8-rate-79), so the arithmetic is not
    what is short: the chain is at 57% of the card's 147.4 TOPS, and the remaining 43% is the memory
    floor of a 132 MB read and 132 MB write per hop.
