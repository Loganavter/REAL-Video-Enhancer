- id: rve-hop-halo-maskless-2026-11-20
  title: 'Im2win: contiguous, mask-free access - test it in Triton with a zero halo buffer'
  type: experiment
  status: done
  owner: '@supervisor'
  resolution: >-
    MEASURED, NOT ADOPTED 2026-11-19: a zero-halo (H+2, W+2, C) buffer with an unmasked kernel is 2.3% faster
    (1.590 -> 1.552 ms, codes identical, 0 of 132.7 M differ), which is below this row's own 5% bar, and the
    halo's measured build cost is 1.591 ms per hop = 25.5 ms/frame for sixteen - 25x the gain. The repair is
    named in the record rather than funded here: each hop can STORE into the next hop's padded buffer at a
    (+1,+1) offset, so no separate pass exists, and only the border needs zeroing once per frame (~0.5 MB
    instead of 134 MB) - that is a path to +0.6 ms/frame and needs its own row if anyone wants it. Also filed
    from the same literature pass and closed in the same record: 2-D CTA tiles (32x4, 16x8, 64x2) halve the
    window amplification on paper (3.05x -> 1.59/1.41x) and are 3.0-7.5% SLOWER measured, with identical codes,
    because the kernel is not traffic-bound (L2 44-50%, DRAM 54%) and a rectangle scatters both its reads and
    its writes. docs/wsp/verified/int8-hop-tiles.txt, records int8-hop-tiles.jsonl (T001-T007),
    logs/hop-halo/, logs/hop-tile2d/.
  priority: P2
  gpu: true
  cost: 2h
  tags:
  - int8
  - hops
  - kernel
  - literature
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Kernels.py
  - docs/wsp/verified/int8-hop-occupancy.txt
  owns_files:
  - docs/wsp/verified/int8-hop-halo.txt
  refutes: >-
    The hop's nine masked gathers cannot be improved without leaving Triton. Im2win (arXiv:2306.14316) argues
    that direct convolution loses to GEMM-based convolution precisely because of DISCONTINUOUS memory access,
    and fixes it with window-ordered contiguous loads plus shared memory - which we cannot express. But the
    contiguity half IS expressible: a (H+2, W+2, C) buffer whose one-pixel border is zeros removes the bounds
    mask entirely (three compares and a select per tap per row, and ncu reads "not predicated off threads per
    warp" 30.45 of 32, i.e. ~5% predication), and makes every tap's row segment a fixed-stride contiguous read.
    If a halo buffer does not take at least 5% off the hop, the masks were not the cost and only explicit
    shared memory remains - which is the row `rve-hop-smem-staging` already closed as inexpressible.
  acceptance: >-
    One hop, two arms in one process, CUDA events, >=3 rounds: today's buffer against a zero-haloed
    (H+2, W+2, C) buffer with an unmasked kernel. Codes MUST be identical (0 differing of 132.7 M) - a halo
    changes no arithmetic, and any difference is an indexing bug, not a picture change. Report ms and TOPS. On a
    >=5% win: the 16-hop chain in the app with the phase line, then the full-clip picture, and note the halo's
    cost (one zeroing pass, +1.3% memory).
  note: >-
    The halo also makes an untested intermediate cheaper to imagine: with a zero border, a CTA could load a
    (BLOCK_M+2, C) row span unmasked and the tap shift becomes a static offset. That is still not smem staging,
    which is why this row tests only the cheap half first.

- id: rve-hop-io-bound-2026-11-20
  title: 'What is the MINIMUM traffic for this tile? Apply the I/O lower bound instead of guessing'
  type: analysis
  status: done
  owner: '@supervisor'
  resolution: >-
    ANSWERED 2026-11-19, and the answer retires the question rather than the traffic. The bound for a direct
    convolution tiled (Tw x Th) is the window amplification (Tw+2)(Th+2)/(Tw*Th): 3.05x for the shipped 128x1
    tile, 1.59x for 32x4, 1.41x for 16x8. It was then TESTED, not just computed: the tiles that meet the bound
    best are 3.0-7.5% SLOWER (1.504 -> 1.550 / 1.617 ms, identical codes, docs/wsp/verified/int8-hop-tiles.txt),
    because the resource the bound constrains is not the one that saturates - L2 sits at 44-50% and DRAM at 54%
    while the kernel is held by the first gather's round trip at 3.96 of 12 warps. A bound is actionable only
    when its resource is the bottleneck; here it is not, so no dataflow change can collect it. This is also why
    arXiv:2306.14316's contiguity argument yields 2.3% here instead of a win, and why arXiv:2609.01864 (DSMEM
    clusters, 1.32-1.47x) is the only remaining lead with a number behind it - and it needs a CUDA kernel.
    Arithmetic shown in docs/wsp/verified/int8-hop-tiles.txt; no GPU job was needed for the bound itself.
  priority: P3
  gpu: false
  cost: 1h
  tags:
  - int8
  - hops
  - literature
  - analysis
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-hop-dram.txt
  - docs/wsp/verified/int8-hop-occupancy.txt
  owns_files:
  - docs/wsp/verified/int8-hop-io-bound.txt
  refutes: >-
    The hop's L2 traffic (1528 MB, 6.1x DRAM) is what this shape costs. arXiv:2012.15667 derives I/O lower bounds
    for direct convolution under the red-blue model and then designs near-I/O-optimal dataflows from them, which
    is exactly the question we answered by hand ("staging would take ~1528 to ~750 MB"). If the bound for a
    (BLOCK_M, C) tile on this card's L2 is close to what we measure, the traffic story closes with a proof and
    the CUDA-kernel temptation is not worth anyone's time. If the bound is 2-3x below, then a different dataflow
    is provably available and `rve-hop-smem-staging`'s negative becomes an argument for a CUDA kernel, not
    against one.
  acceptance: >-
    The bound computed for OUR shape (64 channels, 3x3, 2.0736 Mpx, 32 MB L2), the dataflow it implies, and the
    ratio to the two measured numbers (1528 MB L2, 250.6 MB DRAM). No GPU job: this is arithmetic on a published
    theorem plus our counters, and the arithmetic must be shown, not asserted - the corpus has retracted
    "upper bound" arguments twice for skipping exactly that.
  note: >-
    Low priority on purpose: it cannot improve the frame by itself. It can only tell the next person whether the
    remaining ~26% that ncu leaves is reachable by dataflow or not, and that is the difference between funding a
    CUDA kernel and closing the lane.

- id: rve-hop-csplit-2026-11-20
  title: 'Split the 64 output channels across CTAs: halve the accumulator, double the warps'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 1h
  tags:
  - int8
  - hops
  - kernel
  base_branch: perf/inference
  resolution: >-
    CLOSED NEGATIVE 2026-11-19, and it was the LAST occupancy lever Triton can express. Rationale: the measured
    bottleneck is occupancy (3.96 of 12 warps, 56% no eligible) and the accumulator BLOCK_M x 64 int32 is what
    caps resident CTAs, so splitting the output channels halves it at the cost of re-reading the input - which
    the roofs said was affordable (L2 44-50%, DRAM 54%, SM 74%). Measured, identical codes in every arm: 2x32 ch
    per CTA 2.632 ms (-65.4%), 2x32 with 2 warps 2.058 (-29.3%), 4x16 4.387 (-175.7%) against the shipped
    1.591. The trade does not work in either direction: a 32-wide N tile halves what the tensor pipe does per
    instruction, and the doubled reads land on the same L2. WITH THIS THE HOP IS DONE IN TRITON: six families
    of knobs, 27 configurations, none better than what ships (launch shape 9 arms, tap staging 3, cache policy
    5, tile shape 4, halo 2, channel split 4). What remains is outside the language: a CUDA kernel with
    explicit shared-memory staging (Im2win, arXiv:2306.14316) with an arithmetic prize of ~9 ms/frame
    (hops 25.7 -> ~16, frame 34.5 -> ~26, ~2.0x against fp16), or DSMEM clusters (CREDIT, arXiv:2609.01864,
    1.32-1.47x, beats Triton baselines). The only item left INSIDE Triton is the inline halo (+0.6 ms/frame),
    described in int8-hop-tiles.txt and not yet filed as its own row.
    docs/wsp/verified/int8-hop-csplit.txt, records int8-hop-csplit.jsonl (X001-X004), logs/hop-csplit/.
  note: >-
    Filed and closed in one step because it was a 1 h falsifier of an idea that followed directly from the
    profiler, not a portfolio item. The record carries the full account of the six knob families so the next
    reader does not re-run any of them.

- id: rve-hop-batch-m-2026-11-20
  title: 'Amortise the per-launch constant over two frames: does M x 2 batching move the hop?'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 1h
  tags:
  - int8
  - hops
  - kernel
  base_branch: perf/inference
  resolution: >-
    CLOSED NEGATIVE 2026-11-19: +0.3% per frame (1.769 -> 1.763 ms) and the batched arms do not even reproduce
    the shipped codes (34.8 M of 265 M differ at batch 2, 70 M of 398 M at batch 3). The mechanism that kills it
    is visible in the batch-1 arm itself: the batched formulation's own index arithmetic (b = rows // (H*W),
    h = (rows // W) % H, one extra mask term) costs 14% per row - 1.769 against the shipped kernel's 1.55 -
    because the constant is paid per LAUNCH while that arithmetic is paid per ROW, and batching multiplies rows.
    So the amortisation cannot ever return more than it costs. WITH THIS, seven families of knobs have been
    measured on the hop - launch shape (9 arms), tap staging (3), cache policy (5), CTA tile shape (4), buffer
    layout (2), output-channel split (4), frame batching (3): thirty configurations, the shipped kernel wins
    every family. docs/wsp/verified/int8-hop-batch.txt, records int8-hop-batch.jsonl (Y001-Y003),
    logs/hop-batch/probe.json.

- id: rve-cuda-smem-hop-2026-11-20
