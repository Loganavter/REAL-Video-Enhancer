    Named explicitly in int8-hop-loads.txt as the idea that was NOT tried, so this row is the follow-through
    rather than a new idea. Ceiling is the arithmetic floor, not a guess: 152.9 GFLOP per hop at 176 TOPS is
    0.87 ms, so sixteen hops cannot go below 13.9 ms however good the schedule is - the whole row is worth at
    most 25.7 -> 20-22 in the optimistic case and zero in the likely one.

