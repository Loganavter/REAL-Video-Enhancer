  - id: rve-l2-pyramid-2026-11-15
    title: "E29: L2-resident layer pyramid - is the 7.9 MB reuse buffer real, and what is the ceiling?"
    type: research
    status: todo
    owner: null
    priority: P2
    gpu: false
    cost: "weeks (phase 1: hours)"
    tags: [fusion, l2, pyramid, traffic]
    base_branch: perf/inference
    relates_to: [docs/MODEL.md, docs/RESEARCH-LEDGER.md]
    owns_files: [scripts/pyramid_budget.py]
    refutes: "The buffer arithmetic does not hold at 4K (reuse buffer per layer boundary or the 16-boundary sum exceeds what stays resident), or the traffic decomposition attributes less than ~20 ms to DRAM, leaving no 1.5x ceiling."
    acceptance: "Phase 1 is CPU arithmetic only: per-boundary buffer bytes, total, L2 residency argument, and the re-derived time decomposition (logical traffic 8.49 GB, L2 absorption ~1/3, DRAM 19.7 ms, compute floor 33.1 ms, measured 56.8 ms). Phase 2, only if phase 1 survives: a boundary search per the Welder model and one fused prototype."
    note: "MICRO'16 (Alwani et al.) removed intermediate tensors from off-chip entirely on the first five VGG layers: 77 MB -> 3.6 MB with 362 KB on-chip, and their recompute-vs-reuse fork is our fork too (full fusion of 19 layers would cost +9.6x arithmetic by recompute, but 1.4 MB by reuse). Our version: (K-S)=2 rows x 1920 x 64 ch x 2 B = 0.49 MB per boundary, 16 boundaries = 7.9 MB, which does not fit 100 KB shared memory but does fit 32 MB L2. This is the item that would give the ledger's 'the model has that headroom; the builder cannot collect it' a number."
  - id: rve-pruning-bounds-2026-11-15
    title: "E30: training-free reconstruction + channel pruning - ASK THE OWNER FIRST (changes weights)"
    type: decision
    status: todo
    owner: "@owner"
    priority: P3
    gpu: false
    cost: "1d after the answer"
    tags: [pruning, asvd, snows, owner-decision]
    base_branch: perf/inference
    relates_to: [docs/MODEL.md]
    owns_files: []
    refutes: "The owner's constraint is 'no weight changes', in which case this whole family is out of scope and the row is dropped, not deferred."
    owner_ruling: "2026-11-15: weights may change when the change is practically meaningless. int8 rounding is in that class and is measured (0.000% of pixels above 8 levels, peak 4, 54.1 dB). A 25% channel cut is not in that class - it changes the picture - so what is left to decide is visible quality for speed, not the provenance of the weights."
    acceptance: "An explicit yes/no from the owner on whether the picture may change for speed (a 25% channel cut will very likely break the 0.1%/8-level bar), recorded here before any code."
    note: "The E-SVD test measured weight energy (77-91%) and layer output error (28.7 dB) and closed the direction. The LLM-compression literature closes exactly that gap training-free: ASVD scales weights by activation statistics before the decomposition so the OUTPUT error is what is minimised; SparseGPT prunes one-shot without retraining; SNOWS does the vision-network version (Hessian-free Newton, K-step layer reconstruction through conv+BN+ReLU+residual) with ResNet20 2:4 at 1.97x FLOPs for -0.64%. Two caveats: 2:4 needs sparse hardware and TRT already picks sparse tactics with no measured win (E7) - so the useful form is STRUCTURAL channel pruning (64->48 = 1.78x on dense kernels), not fine-grained sparsity. And 25% of channels will very likely break the 0.1%/8-level bar, which is why this is a question before it is a task."
  - id: rve-film-gate-codec-2026-11-15
    title: "E31: the film loss is the gate refusing (1.85x instead of 2-4x) - grain and motion-compensated reuse"
    type: research
    status: todo
    owner: null
    priority: P3
    gpu: true
    cost: "days"
    tags: [gate, grain, motion-reuse, film, metric]
    base_branch: perf/inference
    relates_to: [backend/src/utils/TemporalReuse.py, backend/src/RenderVideo.py, docs/RESEARCH-LEDGER.md]
    owns_files: [scripts/probe_grain.py]
    refutes: "Synthesised grain does not restore the measured floor below 1.5 on the 35 mm clip, or the 8-level bar cannot be met by construction once grain is added back (at sigma=16 the mean |delta| is already ~18 levels), which makes this a metric question rather than an optimisation."
    acceptance: "Phase 1 (CPU, no GPU): the arithmetic showing why the bar is unreachable on grain at the measured sigma, and what the bar would have to become. Phase 2 (GPU): one film clip through {as-is, grain removed -> gate -> grain synthesised}, with the worst-frame statistic and the time, against the current 14.95 s / 1.85x."
    metric_question: "The acceptance statistic is the share of pixels whose worst channel differs by more than 8 of 255 levels, on the worst frame of a sample, bar 0.1%. It compares grain REGENERATED by any method against the source's grain, which is a different random field: two independent fields at sigma=16 differ by more than 8 levels on 72.4% of pixels (std of the difference 22.6, mean |d| 18.1). So the bar is unreachable by construction for anything that touches grain - not because a method is bad, but because the statistic asks 'is this the same grain'. Three answers are possible and the owner picks one: (a) judge on a grain-suppressed copy at the same 0.1%/8-level bar, which measures the picture; (b) keep the bar and close E31, which leaves film at 1.85x with the gate refusing (floor 2.27); (c) judge structure per pixel and grain by energy, sigma within a stated tolerance of the source."
    note: "Two standard techniques from video coding, applied to the SR output rather than the model: motion-compensated prediction (warp the previous HR output by estimated motion, recompute only uncovered areas - ~1-2 ms at 1080p against 45 ms of model) would let the chain stay long on moving content; film grain synthesis (AV1) removes grain before processing and synthesises it after, which is the only path to a floor below 1.5 on 35 mm. Both change what the acceptance metric sees, so the metric question is part of the task, not a footnote."
  - id: rve-doc-literature-closures-2026-11-15
    title: "Record the literature closures so nobody re-enters them (PReLU zeros, 3x3->5x5, Strassen)"
    type: docs
    status: done
    owner: "@supervisor"
    resolution: "folded into rve-ledger-reopen-e16-2026-11-15 (same file, same commit)"
    priority: P1
    gpu: false
    cost: "20m"
    tags: [docs, negative-results]
    base_branch: perf/inference
    relates_to: [docs/RESEARCH-LEDGER.md]
    owns_files: [docs/RESEARCH-LEDGER.md]
    note: "Three whole branches of literature are closed by the shape of our network, and each closure is structural rather than measured, so it needs to be written down once: (a) PReLU produces no zeros, so activation-sparsity / dynamic-skipping work does not apply by construction; (b) collapsing two 3x3 into one 5x5 costs 25 taps against 18, i.e. +39% MAC, so linear pre-composition is counterproductive at any precision; (c) Strassen at N=64 has no recursion depth, adds intermediate sums (traffic, where we are already on the ridge) and is fp16-unstable."
