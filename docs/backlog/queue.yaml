    workspace pool did not reproduce here, so this item now has a concrete first question:
    does any epilogue-capable tactic exist for C=32 at this K, and can an editable
    timing cache select it? STARTING POINT REPLACED 2026-11-17: the tactic exists, the builder finds
    it on its own, and it is not deterministic. Three rebuilds of one ONNX gave 39.23 / 39.29 / 20.95
    ms with 0/0/18 myelin layers (ledger B3 section), so the question is no longer "invent an
