    status: done
    owner: "@supervisor"
    resolution: "measured 2026-11-15: cuDNN full autotune 3.67 ms (41.7 TFLOP/s) against the engine's 3.05 (50.2) on the exact shape, flat 1080p->135x240, fp32 control no win. Negative; kernel identity unavailable (torch profiler 0 events under CUDA 13, nsys 2025.1.3 refuses CUDA 13). Ledger E26"
