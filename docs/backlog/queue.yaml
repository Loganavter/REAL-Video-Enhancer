  acceptance: >-
    Say what the number is for. Either (a) name the term it is meant to catch and show it catches it with a
    stated population (>=13 frames spread, bar 0.1%), or (b) remove it and let the render's own output be
    the only place the picture is judged, which is where every load-bearing number in this lane comes from
    anyway. Either way: the log line must not print a percentage that no frame population supports.
  resolution: >-
    done 2026-11-19 without a new measurement, because the record already carries both clusters. The gate
    is now a GROSS gate: `FIRST_FRAME_SANITY = 1.0`% of pixels against the fp16 model, sitting ~3.5x above
