- id: rve-int8-on-bd-2026-11-18
  title: 'CLOSED: the "int8 fails on BD" reading was body-vs-engine; against the model the body passes 5-25x'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P0
  gpu: true
  cost: 1d
  tags:
