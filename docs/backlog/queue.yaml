- id: rve-int8-probe-population-2026-11-18
  title: 'The int8 probe reads 0.082% or 0.688% on one clip depending on how it is asked'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 2h
  resolution: >-
    closed 2026-11-19 by decision, not by measurement: the certification is withdrawn from the evidence
    chain and the probe keeps only its calibration job. Cause, read in the code: a forced verdict assigns
    `upscaleOption.int8Fit` BEFORE the probe reads it, and the probe passes that same option as
    `engine_ref` - so the "fp16 reference" is int8 on exactly the runs that force int8 (0.688% / 0.918% /
    peak 68 against 0.082% / 0.266% / peak 25 with the real fp16 reference). That is the self-comparison
    trap the row predicted, and it means the two readings are two populations by construction, not noise.
    In the shipped path it never mattered either: Fast forces int8 and the verdict is overwritten. So
    `probe(..., certify=False)` now runs for calibration only (frames + per-layer scales), `auto` still
    certifies, and the 125 records whose instrument is the probe stop being load-bearing - the picture is
    judged on renders (gate_sweep on the encoded pair), not on this module. The cost of the withdrawn half
    is now recorded: 33.37 s of a 62.67 s probe (53%), break-even for int8 on BD falls from 6.1-7.4 min of
    video to 2.9-3.5 min. CONSEQUENCE FOUND 2026-11-19 AND NOT ANTICIPATED: removing the certificate also
    changed the PICTURE - two lossless renders differ by 0.45050% (356/494 frames above the bar) while the
    same tree with the certificate ON is bit-identical to the pre-change tree (int8-certificate-removal.txt,
    verdict int8-picture-depends-on-warmup). The certificate was treated as reporting plus cost; it was also
    part of what determines the render. NOT withdrawn: the body's own first-frame certificate (`body.certify(frame)`),
    which is n=1 and read 0.00000% on every int8 run of 2026-11-18 against 0.53% on the whole clip - filed
    as rve-body-first-frame-certificate-2026-11-19. Records: docs/wsp/verified/int8-probe-cost-2026-11-19.txt. NOT done: making the
    pair set a function of the clip - that is the precondition for any future certification, and it is
    not needed while nothing reads the verdict.
  tags:
  - int8
  - probe
  - population
  - harness
  base_branch: perf/inference
  relates_to:
  - backend/src/utils/Int8Probe.py
  - backend/src/RenderVideo.py
  - docs/wsp/verified/gate-bd.txt
  owns_files:
  - backend/src/utils/Int8Probe.py
  - backend/src/RenderVideo.py
  - backend/tests/test_int8_probe_modes.py
  - scripts/probe_cost.py
  - docs/wsp/verified/int8-probe-cost-2026-11-19.txt
  refutes: >-
    The probe's own pair population changes with the gate configuration and with the forced verdict:
    on ONE clip (BD Violet) it reads engine 0.082% / composition 0.266% / peak 25 on 7 pairs in an
    fp16 run, and engine 0.688% / composition 0.918% / peak 68 on 7 pairs in an int8-forced run; the
    Chainsaw cuts read 4 pairs and 2 pairs. If the pair set is not a function of the clip alone, every
    probe number in the ledger is a cross-population comparison and the verdict taken before the first
    frame is a coin toss between configurations.
  acceptance: >-
    The probe's pairs printed as frame indices, the pair set shown identical across {fp16 auto luma,
    int8 forced, no reuse, channel-max forced} on one clip, and the engine/composition statistics
    reproduced from those indices independently. Until then, probe numbers are only comparable inside
    one configuration and must say which.
  note: >-
    Both readings are deterministic within their configuration (the same run repeated gives the same
    digits), so this is not noise - it is a different population or a different reference. The probe
    passes `engine_ref=upscaleOption`, and a forced verdict sets that option's int8Fit before the probe
    runs, which is the first thing to check.

