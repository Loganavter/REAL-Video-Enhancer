- id: rve-int8-sim-vs-kernel-2026-11-18
  title: 'CLOSED: the bit-exact emulation already answers the sim-vs-kernel gap; the sim is retired as an instrument'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 1d
  tags:
  - int8
  - accuracy
  - instrument
  - simulation
  base_branch: perf/inference
  relates_to:
  - scripts/int8_accuracy_sim.py
  - backend/src/pytorch/Int8Body.py
  - backend/src/pytorch/Int8Kernels.py
  - docs/wsp/verified/int8-scales-bd.txt
  owns_files:
  - scripts/int8_hopwise.py
  refutes: >-
    The simulation and the kernel are the same quantiser measured two ways. If the hop-by-hop comparison
    does not find the term (rounding mode, clamp, grid, the head quantise, the requant shift), then the
    sim cannot be used to propose kernel changes at all - which is what the 2026-11-18 swap showed: the
    sim said per-channel activations are worth 15-40x, the kernel measured 0.015%.
  acceptance: >-
    Per-hop activations of sim and kernel compared on one BD frame, the hop where they diverge named, and
    one isolated change that moves the sim's number onto the kernel's (0.065% -> 0.9%). Only then is a
    sim-proposed lever worth a kernel patch.
  note: >-
    REVISED 2026-11-19: the 14x was the simulation against the ENGINE, which is a different instrument
    again. Against the BODY the simulation reads 0.06510% on frame 29 where the body reads 0.01684% - 4x, not
    14x - and both are under the 0.1% bar, so this row no longer gates anything. It stays for the next reader
    who wonders why the two instruments disagree, not as a blocker.
    ATTEMPTED AND INVALID 2026-11-18 (scripts/int8_hopwise.py): comparing the kernel's hops with the
    simulation's hops measures the difference between two RECIPES - the body quantises symmetrically on
    +-127, the simulation asymmetrically over 0..255 - so the diff came out at 100-290% of the activation
    scale, which is a unit/convention error, not a finding. The corrected design is: emulate the KERNEL's
    own recipe in torch, verify the emulation matches the kernel (~0), then vary one term at a time
    (symmetric clamp, shift 20, per-channel weight fold, head quantise, calibration frames).
    Numbers on 2026-11-18, BD Violet: sim per-tensor 0.06510% on frame 29; the kernel 0.90619% on frame
    274 of the same clip (472 of 494 frames over the bar); the product's own probe agrees with the kernel
    (engine 0.688-0.824%), so the sim is the odd one out by 14x. The one kernel-side lever the sim
    proposed - per-channel hop boundaries with the input scale folded into the weights - was implemented
    (backend/src/pytorch/Int8Body.py, opt-in RVE_INT8_PER_CHANNEL=1) and measured picture-neutral: the
    two int8 variants differ by 0.01541% of pixels, 0 frames over the bar between them. So either the
    boundary was never the error source or the frontier simulator and the kernel quantise different
    things; the second is the likely one and it is answerable by dumping one hop's tensor from both.

- id: rve-int8-input-mismatch-2026-11-18
  title: 'CLOSED: the +4.4 ink lift was a comparison error, not a branch input mismatch'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P1
  gpu: partial
  cost: 2h
  tags:
  - int8
  - colour
  - pipeline
  - stroke
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - backend/src/pytorch/UpscaleTorch.py
  - backend/src/RenderVideo.py
  - docs/wsp/verified/int8-scales-bd.txt
  owns_files:
  - backend/src/pytorch/UpscaleTorch.py
  refutes: >-
    The app feeds the int8 body the same tensor it feeds the fp16 engine, and the two renders differ only in
    precision. Then the ink lift lives in the quantiser after all, and this row closes as a duplicate of the
    stroke question.
  acceptance: >-
    Dump the tensor that actually arrives in `Int8Body.__call__` in a live render and the tensor that arrives in
    the fp16 engine path on the same frame; compare per-channel mean, min/max and the RGB->YUV conversion used.
    If they differ, name the term, fix the preparation, re-render and re-read ink/rim on frames 169 and 274.
  measured: >-
    2026-11-18, first check done: both branches logged the tensor they receive (RVE_DEBUG_INPUT=1, two 2 s
    renders). int8 INPUT mean 0.55127 min 0.14905 max 1.00000 ch-mean [0.65111, 0.52043, 0.48228]; fp16 INPUT
    mean 0.55122 min 0.00000 max 1.00000 ch-mean [0.65105, 0.52038, 0.48223]. The means and per-channel means
    agree to five decimals, i.e. the two branches see the same preparation and the same colour conversion; only
    the minimum differs, which is what two DIFFERENT first frames of the clip look like, not two conversions.
    So the branch-input hypothesis has no support yet - the remaining candidate is that the two first frames
    are simply not the same frame, and the clean way to close it is to feed ONE decoded frame to both the body
    and the engine offline and compare their outputs against the model, which is the next step.
    STATE 2026-11-18. The body measured IN-PROCESS (RGB, model as reference) does not lift the ink at all:
    -0.51 at frame 169 and -0.57 at 274 with a 4-frame calibration, -0.80 and -1.23 with the 24-frame set the
    app uses, and the share stays 0.004-0.020% against a 0.1% bar. The RENDERED file, compared the same way
    against the model, reads +4.40 and +6.60 on the ink while the rim stays - and the fp16 engine's file reads
    +1.07/+1.43, reproducing the halo. Both renders go through the same yuv420p pipe, so the pipe cannot explain
    the difference between them; the calibration set does not either (measured above); the quantiser scheme,
    the per-channel scales, the percentile clip, the grid margin and the bias correction were each varied and
    none of them moves the ink in-process. What is left is the difference between the two branches' INPUT: the
    app converts the frame with cv2 (BT.601 full range) while this lane's model reference is an ffmpeg decode
    (BT.709 tv), and the int8 body runs on a different route through UpscaleTorch than the engine.
    Why it matters: if the branches get different inputs, the "pale line" is a pipeline bug that also affects
    what the body is asked to reproduce, and it is fixable outside the quantiser; if they do not, the stroke is
    a genuine 8-bit cost and the lane closes on picture. Either way this is the last measurement that decides.

