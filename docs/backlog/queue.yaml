- id: rve-tail-conv-utilization-2026-11-19
  title: 'The tail conv runs at ~5 of ~176 TFLOPS - C_out=12 underfills the tensor-core tile'
  type: experiment
  status: dropped
  owner: '@supervisor'
  resolution: >-
    SUPERSEDED 2026-11-20 by rve-tail-as-int8-hop, which was adopted: the fp16 cuDNN convolution this row
    wanted to make efficient is no longer on the path (the tail is one int8 kernel at 0.96 ms against 2.49 +
    1.67 for dequant). Both rows attacked the same 28.7 GFLOP convolution; measuring the fp16 shape's
    utilisation now would buy nothing. Its padding half is answered in the adopting row (12 -> 16 zeros
    preserve the arithmetic, and the int8 kernel writes 12), and its transpose half (C7) is moot for the same
    reason. Re-open only if the int8 tail is ever reverted.
  priority: P2
  gpu: true
  cost: 4h
  tags:
  - int8
  - tail
  - conv
  - tensor-core
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/wsp/verified/int8-tail-split.txt
  owns_files:
  - scripts/tail_conv_probe.py
  refutes: >-
    The tail conv's 4.86-5.99 ms is what a 64->12 3x3 convolution costs at 1080p. It is 28.7 GFLOP in
    ~5 ms = ~5 TFLOPS, against ~44 (fp16 CUDA cores) and ~176 (tensor cores) on this card, and the measured
    split says it is 58-63% of the tail. If no layout, algorithm or padded-channel variant gets it under
    2.5 ms on the same frames, the convolution is already at its practical floor here and the tail closes at
    7.8-10.4 ms.
  acceptance: >-
    An isolated timing of the SAME conv (64->12, 1080p, fp16) across at least: weights NCHW vs channels_last,
    input NHWC-view vs NCHW, cudnn benchmark on/off, and output channels padded 12->16 with zeros sliced
    off - each in a fresh process, >=3 rounds, medians of rounds 2+. Then, for whichever variant is fastest:
    the whole clip through the app with the picture delta against today's render (share >8 levels, worst
    frame, 494 frames) recorded as a DIFFERENT-ARITHMETIC change if the algorithm differs - byte-identity is
    only available to the variant that keeps the algorithm, and arXiv:2609.00363 is the reason a tolerance
    check cannot stand in for it. Report which lever did the work: layout, tile fill, or algorithm choice.
  note: >-
    What it buys if it lands (arithmetic from int8-wall-ab and int8-tail-split): conv 4.86 -> 2.5 on
    Violet takes the frame 50.61 -> 48.25 and the ratio from 1.141x to 1.196x; 5.99 -> 2.5 on Chainsaw takes
    it 49.64 -> 46.15 and 1.119x to 1.203x - i.e. the one lever that closes the gap to the recorded
    bar_int8_wall = 1.2x that int8 misses today. Per hour of video that is 3.5-4.3 minutes on top of the
    10 minutes int8 already saves; a 24-minute episode drops by 84-103 s. If the conv is at its floor, none
    of it materialises and the row closes with that measurement. The padded-channel variant is the one that
    keeps the ARITHMETIC (zeros contribute nothing), so it is the only candidate that could be adopted under
    the lane's byte-identity rule; a cudnn algorithm change is a
    different kernel and needs the picture test. Do not re-enter the closed levers while here: int8 implicit
    FP8, per-channel Q/DQ, scalar-slope, width C=32/48, Winograd through cuDNN, sparsity.

- id: rve-tail-layout-2026-11-19
  title: 'DONE: the NHWC view is adopted - bit-identical, and int8 now clears the 1.2x wall bar'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 2h
  tags:
  - int8
  - tail
  - layout
  base_branch: perf/inference
  relates_to:
