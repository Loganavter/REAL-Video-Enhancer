    the synthesized probe does NOT fuse (0 __myl_, 50 reformat, 18 pointwise, 40.6
    ms), while C=48 and C=64 do. The ledger''s claim that C=32 fuses with an explicit
    workspace pool did not reproduce here, so this item now has a concrete first question:
    does any epilogue-capable tactic exist for C=32 at this K, and can an editable
    timing cache select it? STARTING POINT REPLACED 2026-11-17: the tactic exists, the builder finds
    it on its own, and it is not deterministic. Three rebuilds of one ONNX gave 39.23 / 39.29 / 20.95
    ms with 0/0/18 myelin layers (ledger B3 section), so the question is no longer "invent an
    epilogue tactic" but "make the builder choose the fused graph on purpose" - (a) N builds at
    engine-build time, keep the fastest (no TRT internals, ships as a build-time change), or (b) an
    editable timing cache / selector pinned to
    sm75_xmma_..._tilesize256x32x32_stage1_warpsize4x1x1. The acceptance above is ALREADY met by a
    fast draw (20.95-23.24 ms = ~1.2-1.3 ms per conv); what is missing is repeatability.'
