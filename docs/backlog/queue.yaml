    and 356 frames over the bar on the same material. A certificate that reads zero on a clip that fails
    is not a weak screen, it is a label: the same "one frame is a smoke test" error that produced three
    retractions in a row (0.000% -> 0.019% -> 0.174%) now sits in the shipped path, reading zero before
