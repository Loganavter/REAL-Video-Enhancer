- id: rve-hop-fuse2-cascade-2026-11-20
  title: 'Reuse the 3x3 taps inside the CTA: 9 reads per pixel become 1.13 - the only lever that hits LSU'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: '1-2 sessions (Triton first, CUDA only if Triton cannot express the staging)'
  tags:
  - int8
  - hops
  - smem
  - lsu
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-hop-occupancy.txt
  - docs/wsp/verified/int8-hop-constant.txt
  - docs/wsp/verified/int8-hop-dram.txt
  owns_files:
  - docs/wsp/verified/int8-hop-tapreuse.txt
  refutes: >-
    REWRITTEN 2026-11-20 after three rounds of arithmetic, because the first two framings priced the wrong thing.
    The launch-constant argument is DEAD (int8-hop-constant.txt: the same kernel at 256x256 takes 0.0572 ms, so no
    per-launch fee can exist, and graphs are bounded at 17 x 0.0572 = 0.97 ms). The pure-traffic argument is also
    weak, because DRAM runs at 56% and both roofs sit at 57% - removing intermediate traffic does not remove time
    when DRAM does not bind. What remains, and what nobody has tried, is the LOGICAL read volume: the hop reads
    each pixel NINE times, 9 x 132.71 MB = 1194 MB per hop, and the measured L2 traffic is 1528.7 MB, i.e. 128% of
    that - coalescing is fine and the layout (NHWC, 64 B = 2 sectors) is fine. LSU is the highest-utilised pipe at
    73.9% by instruction count, so it is the one lever aimed at the actual limiter rather than at one of two
    equally under-filled roofs. Staging a rolling 3-row band and reusing the taps inside the CTA takes the reads
    from 9 per pixel to (T+2)^2/T^2 = 1.13 at T=32, a 7.97x cut. If the hop then approaches its compute roof,
    sixteen hops go 24.30 -> 13.90 ms, i.e. -10.4 ms/frame, which is larger than every other item in this queue
    combined. If staging does not move it, LSU was not the limiter and the hop is closed for good.
  acceptance: >-
    Staged, cheapest first. (a) Triton: a kernel that loads the three-row band once per CTA tile and forms the
    nine taps from it, at T = 16/32/64; codes MUST be identical (0 of 132.7 M - a tap-reuse scheme changes no
    arithmetic) and the smem budget for a rolling band is 3 x (T+2) x 64 B = 13.1 KB at T=32, NOT the 153 KB of
    full pair tiles, so occupancy must be reported beside the time. (b) ncu on the winning arm: L2 sectors and
    LSU utilisation, so "the read volume fell 8x" is a counter and not a claim. (c) only on a >=10% win: the
    16-hop chain in the app, the phase line, and the full-clip picture.
  resolution: >-
    CLOSED 2026-11-20 after actually trying it in Triton, which was the cheap half of the plan and the decisive
    one. Triton 3.5 HAS tl.gather, so the horizontal shift inside a tile - the thing that made this family look
    inexpressible - is expressible. Measured on one hop, codes identical in every arm: today's nine gathers
    1.478 ms, three rows loaded once plus nine register gathers 19.895 ms at BLOCK_M 128 and 11.928 at 64. So
    tl.gather costs THIRTEEN times the whole kernel: it lowers to a lane permutation (a shared-memory round trip
    per element), and nine of those per output row is far worse than nine L1/L2-resident loads. On top of that,
    tl.arange needs a power of two, so the three-row band cannot be BLOCK_M+2 wide and is loaded 2*BLOCK_M wide -
    capping this formulation at 1.5x fewer reads instead of the 3.05x a hand-written band gets. The mechanism
    (fewer reads, LSU is the limiter at 73.9%) is untouched and still real; every in-language expression of it is
    now measured and lost: register gathers -1246%, pipelined taps -12/-20%, reordered loads -101%, hoisted
    weights -54%. What remains is a CUDA kernel, whose prior is unfavourable (a microbenchmark of the same
    staging measured -26%) and whose ceiling is the largest in the queue (-10.4 ms). That is now a DECISION, not
    an open experiment. docs/wsp/verified/int8-hop-tapreuse.txt, records int8-hop-tapreuse.jsonl (U001-U003),
    logs/hop-tapreuse/probe.json. FINAL CLOSURE BY MECHANISM 2026-11-20, with the counters: sm__inst_executed_pipe_lsu
    = 52.36 M of 230.75 M total (22.7%), and staging does not reduce LSU instructions - it adds them (a global
    load becomes a global load + smem store + smem load: 9 -> 11.26 at a 2-D T=32 tile, 9 -> 15.09 for a 3-row
    band). LSU is already the busiest pipe at 73.9%, so every staging variant moves the saturated resource the
    wrong way while buying L2 traffic that is healthy (128% of logical). The register route is worse still: mma
    layouts make spatial neighbours inter-lane (tl.gather 13.5x), and a register-local dp4a counter-proposal has
    a roof of 44.2 TOPS against the 103.4 the kernel already reaches. And the -10.4 ms ceiling needed the FIRST
    tap's exposed latency (0.590 ms, 37% of the hop) removed, which is latency hiding, not read reduction.
  note: >-
    Filed originally as "fuse two hops per launch" (the megakernel family) and re-priced twice: first at ~4 ms
    with a halo formula that used the input extent as the work extent, then at ~2.3 ms, then to ~0 when the
    constant turned out not to exist. The version worth funding is not fusion at all - it is TAP REUSE, which is
    what the literature's staging recipes actually buy and what our own 30-configuration sweep never tried
    (it varied BLOCK_M, warps, cache policy, tile shape, channel split and batching - all schedule knobs around
    the same nine gathers). The risk is real and on record: a CUDA microbenchmark of a cooperative 3-row load
    measured SLOWER than nine gathers (int8-hop-prefetch.txt, -26%), so the staging has to be justified by the
    LSU counters, not by the byte count.


- id: rve-hop-halo-inline-2026-11-20
  title: 'Inline zero halo: every hop writes the next hop''s padded interior, so no copy exists'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 2h
  tags:
  - int8
  - hops
  - layout
  base_branch: perf/inference
  resolution: >-
    ADOPTED 2026-11-19. The single-hop probe had already shown the mask-free form is 2.3% faster (1.590 -> 1.552
    ms) while a strided halo build costs 1.591 ms - 25x the gain - so the repair was to make the build disappear:
    every hop stores into the NEXT hop's padded buffer at a (+1,+1) offset, only the border is zeroed, once per
    frame. Chain, isolated: 26.485 -> 25.795 ms for sixteen hops (-0.690) plus 0.080 ms of border zeroing =
    -0.61 net. In the app, 3 interleaved rounds: 34.48 -> 33.50 ms/frame (-0.98, -2.9%), every halo round beating
    every plain round, and the 494-frame ffv1 pair reads IDENTITY - bit-identical, so this is a layout change and
    nothing else. The first hop reads the quantiser's plain buffer and the LAST hop writes a plain buffer
    (the tail indexes pix*C linearly and cannot read a padded interior), so no conversion pass exists anywhere.
    Shipped as the default (RVE_HOP_HALO=1). Cost: +382 MB of buffers (585 -> 967 MB steady). docs/wsp/verified/
    int8-hop-halo-chain.txt, records int8-hop-halo.jsonl (H001-H006, R001, HL001-HL004), logs/hop-halo-chain/,
    logs/hop-halo/.

- id: rve-hop-winograd-own-kernel-2026-11-20
  title: 'Winograd F(2,3) in OUR kernel: 2.13x fewer ops - and the hop sits exactly on the roofline ridge'
  type: analysis
  status: done
  owner: '@supervisor'
  priority: P3
  gpu: false
  cost: 1h
  tags:
  - int8
  - hops
  - winograd
  - analysis
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-hop-occupancy.txt
  - docs/wsp/verified/int8-hop-dram.txt
  - docs/RESEARCH-LEDGER.md
  owns_files:
  - docs/wsp/verified/int8-hop-winograd.txt
  refutation: >-
    Winograd was closed by E26 on a cuDNN measurement ("forcing cuDNN's Winograd on one 3x3 64->64 conv is not
    faster"), which answers a question about cuDNN's tactic, not about the arithmetic. In OUR kernel F(2x2,3x3)
    cuts the multiplies 2.25x (76.4 GMAC -> 34.0 GMAC) and, with the transform adds counted, the total op count
    2.13x. Measured against the hop's own numbers the trade is: 610 FLOP/byte of arithmetic intensity against a
    card ridge of 611 FLOP/B, i.e. the hop sits EXACTLY at the ridge - so a compute-for-bandwidth trade wins only
    if it is better than 1:1. Winograd's transformed intermediate is 531 MB per hop (16 positions x 519k tiles x
    64 ch), which unfused turns a 265 MB hop into a 1327 MB hop - 5x the traffic for 2.1x less arithmetic, i.e.
    strictly worse. Fused (transform inside the CTA, no intermediate) the traffic stays 265 MB and the arithmetic
    drops 2.13x - which would be a real win, and needs the 4x4 tile transforms held per CTA: 16 positions x T
    tiles x 64 ch x 2 B, i.e. 32 KB at T=16 - shared memory again, i.e. the same instrument wall that
    int8-hop-prefetch.txt measured twice negative.
  resolution: >-
    CLOSED BY ARITHMETIC 2026-11-19, no GPU job. Two forms, both answered: UNFUSED is strictly worse (1327 MB of
    traffic against 265 for 2.13x less arithmetic, and the hop is at the ridge so the traffic term dominates);
    FUSED is the only form that could win (265 MB, 2.13x fewer ops) and it needs 32 KB of per-CTA transform state
    at T=16 - shared memory, which is the wall the smem staging row already hit twice (reordered loads -101%,
    CUDA microbenchmark -26%). So Winograd is not a different order of solution in this instrument: it is the
    same wall with more arithmetic on the far side. Worth re-opening only if a CUDA kernel is funded for another
    reason (a fused-2 cascade at T=64 would need the same infrastructure), in which case Winograd rides along.
    The numbers: 76.4 -> 34.0 GMAC (2.25x), 35.8 G ops with adds (2.13x), 610 vs 611 FLOP/B ridge,
    intermediate 531 MB/hop. docs/wsp/verified/int8-hop-winograd.txt.
  note: >-
    Filed on the owner's question "did we ever look at this from a different order" - and the honest answer for
    Winograd is: the lane had only ever tested cuDNN's Winograd, never the arithmetic, and the arithmetic now
    says the win exists but sits behind the same instrument as everything else that failed.

- id: rve-hop-traverse-order-2026-11-20
  title: 'Walk the tiles in reverse on alternate hops: does the previous hop''s tail stay in L2?'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P3
  gpu: true
  cost: 20m
  tags:
  - int8
  - hops
  - l2
  base_branch: perf/inference
  resolution: >-
    CLOSED NEGATIVE 2026-11-20, in twenty minutes, from an outside reader's list - the one item in it this
    corpus had never tested and that is expressible in one line. The idea: a hop writes 132 MB but L2 is 32 MB,
    so hop k+1's tile 0 finds data written 132 MB ago and long evicted; walking the tiles in REVERSE would read
    first what hop k wrote LAST. Ceiling from the counters: a quarter of the 132.84 MB DRAM read becoming an L2
    hit is ~0.11 ms/hop, ~1.8 ms over sixteen. Measured on the 16-hop chain, identical codes in all three arms:
    forward 26.551 ms, alternate (reverse on odd hops) 26.577 (-0.10%), reverse-all 26.446 (+0.40%). The
    discriminating comparison is `alternate` against BOTH others - it loses to forward and to reverse-all, which
    is exactly what "no L2 adjacency benefit" looks like. The reason is in the counters: the hop is at 54% of the
    DRAM roof, so a third of a hop's reads becoming hits buys little, and the write-back of 132 MB evicts the
    previous launch's tail before it can be reused. Records int8-hop-traverse.jsonl (V001-V003),
    logs/hop-traverse/probe.json.

- id: rve-hop-constant-nature-2026-11-20
  title: 'Is the hop''s 0.59 ms a per-launch fee? Shrink the frame and find out - it is not'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 30m
  tags:
  - int8
  - hops
  - instrument
  base_branch: perf/inference
  resolution: >-
    ANSWERED 2026-11-20, and it refutes MY OWN framing as well as an outside reader's top recommendation. The
    kernel at five sizes: 256x256 0.0572 ms, 512 0.2066, 1024 0.8108, 1080p 1.5949, 4K 5.9124. 127x the pixels
    costs 103x the time and the per-pixel cost IMPROVES with size (0.873 -> 0.713 ms/Mpx), so the implied
    per-launch term is 0.011 ms - nothing. Consequences: (1) "9.44 ms/frame sits in a 0.59 ms launch constant" is
    WRONG, as is my own "0.59 ms per launch" phrasing: the tap profile is SUB-LINEAR (first tap 0.59, next eight
    0.06 each) because with one tap in flight the kernel waits on it and with nine it overlaps them - memory-level
    parallelism inside one launch, not a fee. (2) CUDA graphs would recover 0.011 x 17 = 0.19 ms, not 9.4 - not
    worth a row. (3) The cascade loses its launch argument and keeps only the traffic one: a fused pair never
    writes and re-reads its intermediate, ~250 MB of DRAM per pair. (4) M x 2 batching reading flat is now
    expected rather than evidence against host overhead. The kernel is throughput-bound at 96-103 TOPS at every
    size. docs/wsp/verified/int8-hop-constant.txt, records int8-hop-constant.jsonl (S001-S006),
    logs/hop-constant/probe.json.

- id: rve-frame-pipeline-overlap-2026-11-20
  title: 'The 7.68 ms of IO never overlaps the 25.9 ms body - the loop is strictly sequential'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  resolution: >-
    CLOSED NEGATIVE 2026-11-20, both halves. (1) The payload copy on its own CUDA stream with an event guard:
    loop 33.55 -> 33.53, pack+queue 4.36 -> 4.36, i.e. nothing - because THE PACK IS NOT A COPY: 12.44 MB at the
    measured 6.55 GB/s is 1.9 ms of transfer, but the line reads 4.36 and is the GPU-side YCbCr conversion over
    8.3 Mpx plus the queue. A compute-bound stage moved to another stream does the same work on the same SMs.
    The reader was right that a pinned ring is not a pipeline; a pipeline was built and tested, and the answer is
    the WORK, not the schedule. (2) While wiring it, the payload hand-off turned out to be
    copy_(..., non_blocking=True) into PINNED memory with NO event guard before the writer read the slot - the
    same shape as the 12.6 dB bug that got the pooled path disabled once. Tested rather than assumed: 494 frames
    guard-off against guard-on read IDENTITY, and the guard costs 0.00 ms (33.54 vs 33.53), so the copy is
    effectively synchronous in practice and the race does not materialise. The guard is KEPT ON by default
    (RVE_PAYLOAD_GUARD=1) because it costs nothing and turns an implicit assumption into an explicit one; the
    copy stream stays behind RVE_PIPE=1. WHAT THIS LEAVES: the 4.36 ms of pack must be attacked by FUSING the
    colour conversion into the tail kernel (which already holds those pixels), not by rescheduling; and the 3.32
    of 'everything else' is the H2D conversion (1.38 measured, 0.07 removable) plus the writer wait, with the
    reader already on its own thread. docs/wsp/verified/frame-pipeline.txt, records frame-pipeline.jsonl
    (F001-F008, R001-R004, PG001-PG004), logs/frame-pipeline/.
  gpu: true
  cost: 3h
  tags:
  - pipe
  - streams
  - latency
  base_branch: perf/inference
  relates_to:
  - backend/src/RenderVideo.py
  - docs/wsp/verified/int8-pack-ring.txt
  - docs/FRAME-BUDGET.md
  owns_files:
  - docs/wsp/verified/frame-pipeline.txt
  refutes: >-
    The loop is already as overlapped as it can be. It is not: read, body, pack and write happen in sequence on
    the render thread, so of a 33.58 ms frame 25.90 is the body and 7.68 is IO that could in principle sit behind
    the NEXT frame's body - pack(N) on a copy stream while body(N+1) runs, with the reader for N+2 prefetching.
    PCIe is full duplex, so H2D and D2H do not contend. The pack-ring experiment does NOT refute this and never
    claimed to: a pinned ring removes the per-frame tobytes but the copy still happens on the frame's critical
    path, synchronously, because no second stream and no event guard were introduced. If a double-buffered
    three-stream pipeline does not move the loop by 2 ms, the stages are already overlapped somewhere the profile
    cannot see and this closes with that.
  acceptance: >-
    Null-sink A/B, arms alternating, >=3 rounds, one session: today against a double-buffered pipeline (body on
    the compute stream, payload copies on a dedicated copy stream with event guards, reader one frame ahead).
    Report the loop line, the pack line and the reader's wait. Then byte-identity of the render - a pipeline moves
    WHEN a payload is copied, not what it contains, so the pair must be IDENTICAL and that is the check that the
    event guards are right (a slot released early is the 12.6 dB bug this lane already paid for once).
  note: >-
    Filed from the outside reader's list, which is right that this is the largest structural win left that needs
    no CUDA: 7.68 ms of a 33.58 ms frame is not body. It is also the item where "the ring was flat" is genuinely
    not the same experiment, and the distinction is worth a row because it was filed as a negative without it.

- id: rve-tail-csc-yuv-2026-11-20
  title: 'Let the tail write the final yuv420p payload: PixelShuffle makes 4:2:0 chroma register-local'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 1d
  tags:
  - int8
  - tail
  - colour
  - pack
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Kernels.py
  - backend/src/pytorch/TorchUtils.py
  - docs/wsp/verified/frame-pipeline.txt
  - docs/FRAME-BUDGET.md
  owns_files:
  - docs/wsp/verified/int8-tail-csc.txt
  refutes: >-
    The colour conversion is where it has to be. The tail already produces, per input pixel, the 12 channels that
    PixelShuffle(2) turns into a 2x2 output block - i.e. exactly the block that 4:2:0 chroma averages over - so
    4Y + 1U + 1V = 6 bytes per input pixel (12.44 MB per frame) can be written straight into planar offsets of one
    contiguous buffer, with no cross-lane work and no second pass. Today the tail writes 49.77 MB of fp16 RGB and
    the pack then reads all of it back on the GPU to compute YCbCr over 8.3 Mpx (4.36 ms, of which only 1.9 is
    the 12.44 MB transfer). If a fused CSC in the tail epilogue does not take the frame below 32 ms, the pass is
    already at its floor and the row closes with that.
  acceptance: >-
    Staged. (a) Offline, no kernel: apply the tail's 12-channel output through both orders in torch - CSC then
    RoundHalfToEven then fp16 store against CSC in fp32 registers then quantise - on the four held-out frames, and
    report the share and peak against the CURRENT path; a shift of more than one level anywhere means the
    rounding order moved and the picture gate decides, not a tolerance. (b) The kernel: tail writes yuv420p
    directly; byte-identity is NOT expected (the arithmetic order changes), so judge on the 494-frame pair with
    reference-kind config. (c) The frame: interleaved A/B, >=3 rounds, the tail phase line and pack line beside
    the loop - the expected split is tail -0.13 (37 MB less write) and pack 4.36 -> ~2.0 (a pure copy).
  resolution: >-
    ADOPTED 2026-11-20, all three stages read. (a) Offline gate before any kernel: both orders from the SAME tail
    output agree on the 12 441 600-byte payload with max |delta| = 1 level, 4.6% of bytes off by one, 0.00000% off
    by more - so it is different-arithmetic and the picture decides. (b) The kernel: tail_int8_yuv_kernel writes
    packed yuv420p from the epilogue; isolated with the conversion inside each arm 5.123 -> 0.869 ms. The 494-frame
    ffv1 pair (reference-kind config) reads worst share 0.00000%, 0 frames above the 0.1% bar, worst block mean
    0.52 levels, peak 6 levels (TC001-TC004). (c) The frame, three arms in one session, medians of rounds 2-3:
    fp16 52.39, int8 with the RGB tail 33.63, int8 with the yuv tail 31.47 ms - ratio 1.665x against the bar's
    1.2x, from 1.558x (JC001-JC006). Attribution went where the phase lines said, not where the isolated probe
    did: tail 1.00 -> 1.00 (a wash - the fused CSC costs what the 24.9 MB of fp16 stores did) and pack+queue
    4.37 -> 2.06, so the saving is YCbCr arithmetic leaving the pack, leaving the pack 0.16 ms above the link's
    own floor (JC007-JC010). DEFAULT ON (RVE_TAIL_YUV=1); the path declines itself on HDR/10-bit/non-bt709
    sources because `out_yuv` is gated on the same flag that chose the pipe format. The safety coupling is now
    load-bearing and written down: writing the payload directly removes the cat() intermediate that made the old
    copy effectively synchronous, so RVE_PAYLOAD_GUARD=1 is not optional on this path.
    docs/wsp/verified/int8-tail-csc.txt, records int8-tail-csc.jsonl (N001-N003, JC001-JC013, TC001-TC004),
    logs/tail-csc{,-ratio,-pair,-nvenc}.
  note: >-
    Filed 2026-11-20 from an outside reader who noticed that the pack's 4.36 ms is NOT a copy (frame-pipeline.txt
    measured the stream pipeline at -0.01) but GPU-side YCbCr over 8.3 Mpx, and that PixelShuffle's channel
    ordering makes the chroma average register-local. It is a BODY-side change on the int8 arm only, so by the
    ratio rule in FRAME-BUDGET it is worth ~2.8x its wall-clock value against the bar.
    SAFETY COUPLING, written down because it bites later: writing the payload directly removes the `cat()`
    intermediate, and that intermediate is the only reason the current payload copy is effectively synchronous
    (frame-pipeline.txt section 2). Anyone taking this must keep RVE_PAYLOAD_GUARD=1 on, or they reintroduce the
    12.6 dB race that once had the pooled path disabled.

- id: rve-yuv8-flag-divergence-2026-11-20
  title: 'The packer decides yuv420p from bit depth alone while the writer decides from the source matrix'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: false
  cost: 2h
  tags:
  - colour
  - pipe
  - ffmpeg
  base_branch: perf/inference
  relates_to:
  - backend/src/RenderVideo.py
  - backend/src/pytorch/UpscaleTorch.py
  - backend/src/FFmpegBuffers.py
  owns_files:
  - docs/wsp/verified/yuv8-flag-divergence.txt
  refutes: >-
    The 8-bit pipe is consistent with its own flag. It is not: `RenderVideo` decides `pipePixelFormat` from
    the source's DECLARED matrix (keeping rgb24 when the source declares bt601/smpte170m, so ffmpeg uses the
    source's own matrix rather than the packer's BT.709), while `UpscaleTorch.yuv8_output` is derived from
    the bit depth alone. On an 8-bit source that declares a non-bt709 matrix the two disagree: the frame
    becomes yuv420p bytes (1.5 B/px) and the writer is told rgb24 (3 B/px). The log even says "8-bit pipe:
    NOT packing yuv420p ... keeping rgb24" while the packer packs. Nothing fails loudly - the sizes differ
    by 2x, so ffmpeg reads a torn frame, which is the class of the P010/planar mismatch that cost 12.7 dB.
  acceptance: >-
    Stage (a), no GPU: a unit test that constructs the two decisions from the same inputs (a non-bt709
    declaration, 8-bit, RVE_YUV8 unset) and asserts they agree; it must FAIL on the current tree, which is
    the point. Stage (b): the one-line fix - derive `yuv8_output` from the pipe format the upscaler is
    already handed (`pipe_pixel_format == "yuv420p"`) instead of from `high_bitdepth` - and the test passes
    with the bt709 8-bit case still packing yuv and the 10-bit/HDR cases unchanged (the existing
    test_yuv8_pipe and test_pinned_payload suites are the controls). Stage (c), if a bt601 8-bit clip is in
    sources.yaml: one 494-frame ffv1 pair before/after, reference-kind config, to show the picture moved
    from broken to consistent rather than the reverse.
  resolution: >-
    FIXED 2026-11-20, stages (a) and (b). (a) The test comes first and pins the invariant over every
    combination the app can produce (8-bit x {yuv420p, yuv420p10le, p010le}, 10-bit x {yuv420p10le, p010le}):
    the packer emits yuv420p exactly when the writer reads yuv420p. It also asserts the guard for the
    combination the app does NOT produce - a 16-bit frame is never packed as 8-bit yuv, whatever string
    reaches the upscaler. (b) The fix is one pure function, `pipe_is_yuv8(high_bitdepth, pipe_pixel_format)`,
    called where `yuv8_output` used to be derived from the bit depth alone; `RVE_YUV8=0` still opts out
    because it leaves the pipe at `yuv420p10le`. The 10-bit proof next to it (tenbit-pipe.txt) shows the
    change left the 10-bit branch untouched: 877 legal luma codes round-trip at max 1 level, 429 in-gamut
    chroma codes at 0-1, and the real clip keeps 648-809 distinct codes in and 647-805 out.
    NOT DONE, and it cannot be done here: stage (c), a picture pair on a bt601 8-bit clip. No such clip exists
    in docs/wsp/sources.yaml - every 8-bit title there declares no matrix (ffprobe: color_space=unknown), so
    the divergence never triggered on this material and the fix is pinned by the argument-level invariant
    rather than by a render. If such a clip appears, one 494-frame pair with reference-kind config is the
    remaining step.
  note: >-
    Found 2026-11-20 while answering "does the tail-CSC row break 10-bit?" - it does not (the 10-bit run is
    in logs/tail-csc-10bit: out dtype float16, no payload line, and the tail-CSC gate in UpscaleTorch now
    also requires pipe_pixel_format == "yuv420p"). But the check made the divergence visible: it is
    PRE-EXISTING, not caused by that row, and it is the exact shape this repo has already paid for twice (a
    format disagreement between packer and writer cannot fail loudly). No row existed for it, which is why
    it survived.



- id: rve-tenbit-pipe-proof-2026-11-20
  title: 'Pin that ten bits survive the reader and the packer, code by code'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 4h
  tags:
  - colour
  - tenbit
  - pipe
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/TorchUtils.py
  - docs/wsp/sources.yaml
  owns_files:
  - docs/wsp/verified/tenbit-pipe.txt
  refutes: >-
    Ten-bit material keeps its ten bits through the lane, and that is established. An 8-bit collapse inside a
    10-bit container is a legal file of a legal size with a merely posterised picture, so the claim needs the
    two conversions around the model pinned by measurement: the reader (yuv420p10le -> fp16 tensor) and the
    packer (tensor -> yuv420p10le). If a legal luma code or an in-gamut chroma code does not round-trip within
    one 10-bit level, the lane is quietly quantising and the row closes as a defect.
  acceptance: >-
    (a) A legal luma ramp: every code 64..940 once with neutral chroma, max |delta| <= 1 and 0.00% off by more.
    Excluding codes outside the limited range is part of the criterion - the packer clamps there by design and
    including them measures the clamp. (b) Chroma as UNIFORM planes, one frame per in-gamut code, because a
    ramp is low-passed by the reader's bilinear upsample and the packer's box filter, and blocks were wrong
    twice (seams). Report the share of the legal range the sweep could reach. (c) Real frames: distinct Y codes
    in and out (an 8-bit collapse cannot exceed 256) plus the share of pixels the reader clips, so the residual
    is not blamed on depth. (d) The app's own run on the 10-bit clip must show the 10-bit branch selected.
  resolution: >-
    PASSED 2026-11-20, all four. (a) 877 of 877 legal luma codes round-trip at max 1 level, 0.00% off by more
    (TB001). (b) U at 0 levels over 429 codes, V at 1 level over 429 (TB002, TB003), covering 48% of the legal
    chroma range - the codes that can coexist with neutral other components inside the gamut. (c) Real frames:
    in-gamut Y max 2 levels, p99 1 level, 99.899% of samples within one code; distinct Y codes 648/694/673/809/
    711 in and 647/689/672/805/708 out (TB004-TB008). The residual on those frames is the reader's clamp at
    1.96% of pixels sitting within 1% of the gamut edge (TB009), which is the same conversion validated at mean
    |d| 1.85/255 against ffmpeg - not depth. (d) The 10-bit clip runs the old path end to end: no payload line,
    `out dtype torch.float16`, no 8-bit pipe (logs/tail-csc-10bit). docs/wsp/verified/tenbit-pipe.txt, records
    tenbit-pipe.jsonl, logs/tenbit-pipe/probe.json, scripts/tenbit_pipe_probe.py.
  note: >-
    Asked for by the owner on 2026-11-20: "we must not lose the ten bits on the way in or on the way out".
    Two of the three instruments were wrong before they were right, and both errors are recorded on the page
    because they are the same class as the labels this lane keeps tripping over: a ramp that included illegal
    codes measured the clamp (83 levels), and block-constant chroma with an outer margin instead of a per-block
    one read 17.75% then 6.31% of codes as "off" while a uniform plane of the same codes is exact.

- id: rve-model-fit-sweep-2026-11-20
  title: 'Which of the collection models the int8 pipeline can run, and what the quantiser does to each'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 3h
  tags:
  - int8
  - coverage
  - models
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/MODEL-FIT.md
  owns_files:
  - docs/MODEL-FIT.md
  refutes: >-
    The lane is about the model, not about one model. It is about one SHAPE: sixteen 64-channel convolutions
    between head and tail, which is a tl.constexpr in the kernel. The collection holds 55 distinct files; the
    honest answer to "which of mine does this run" is a per-file verdict with the reason, and a per-model
    measurement of the quantiser, not a promise that a Compact-family model will be fine.
  acceptance: >-
    (a) Static: load every file with the app's own spandrel, and classify by structure - int8 body yes/no and
    which of the four opt-ins apply - refusing with a reason, never by file name. (b) Dynamic: for every file
    that passes (a), build the body, calibrate on the same spread frames, and record the gross-error share
    against its OWN fp16 model on three held-out frames (worst), plus the body time. (c) A generated page, so
    no number is typed by hand.
  resolution: >-
    DONE 2026-11-20. 55 distinct files: 15 FULL (all five opt-ins), 5 BODY+TAIL (1x denoise/restore), 1 BODY
    (4x, 48-channel tail), 34 refused with reasons (RRDBNet / SPAN / OmniSR / RealPLKSR / DAT, 24-channel
    compacts, two files that are not models). Measured on three held-out frames: the 15 FULL models' bodies
    all land at 26.89-28.16 ms - a 4.6% spread that is clock drift, because the shape is identical, so model
    choice does not buy speed; it buys the picture. The quantiser separates them: one model (a 1x Compact)
    reads 1.5394% and would be REFUSED by the app's 1% start-up gate, the worst that passes reads 0.8763%
    (9x the 0.1% bar that decides a picture, so it needs a render pair), and the cleanest four read <=0.0001%
    against 0.0114% for the production model. The bluray folder - the owner's most valuable - is 4 of 6:
    AniScale 0.0001%, LD-Anime 0.0110%, Futsuu 0.0114%, Ani4K 0.0302%; AnimeSharpV3 (RRDBNet) and
    ModernSpanimation (SPAN) have no body to replace.
    docs/MODEL-FIT.md (generated), records model-fit.jsonl, logs/model-fit/{inventory,all}.json.
  note: >-
    Asked for by the owner on 2026-11-20 ("better to measure which of my models fits the pipeline") after
    concluding that 4K->8K is not a target. The measurement deliberately reports the gross gate, not the
    acceptance bar: n=3 frames of one clip is a smoke test, and calling 0.0114% an acceptance number is the
    exact mistake this repo keeps retracting. Also recorded: the fp16 column in the records is EAGER PyTorch
    (~204 ms) and not the app's TensorRT engine (52.39), so those ratios compare models, not the product.

- id: rve-hop-count-general-2026-11-20
  title: 'The hop count is data: nine-hop and seventeen-hop bodies, no new kernel'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 2h
  tags:
  - int8
  - coverage
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/MODEL-FIT.md
  owns_files:
  - backend/tests/test_int8_body_shape.py
  refutes: >-
    The body needs sixteen hops. It needs N hops: the launch loop, the halo buffers and the requant chain are
    already driven by len(self._launches), and the only thing that assumed sixteen was one constructor check.
    A model of the SAME architecture with a different depth therefore needs no kernel work - and a shallower
    body is not merely compatible, it is proportionally less work per frame.
  acceptance: >-
    (a) The rule as a pure test, no CUDA: any count >= 2 at the tuned width constructs, one hop is refused with
    a reason (the zero-halo scheme needs the last hop to write the plain buffer the tail reads), a native width
    is a constructor argument, and supports() agrees with the constructor. (b) The case: 2x-sudo-UltraCompact
    (64 channels, NINE inner convs) - gross-error share against its own fp16 on three held-out frames, and the
    body's time against the sixteen-hop body in one process. (c) A 494-frame pair if the share is near the bar.
  resolution: >-
    (a) DONE, 2026-11-20: backend/tests/test_int8_body_shape.py (6 cases) passes; the constructor and
    supports() now read the model's count (>= 2 inner convs) and its width, and refuse with the reason.
    The inventory flips 2x-sudo-UltraCompact from NO to FULL as a result - same architecture, nine hops.
    (b) MEASURED 2026-11-20 on 2x-sudo-UltraCompact (64 channels, EIGHT inner convs - the inventory used to
    count the tail and say nine): body 14.42 ms against 27.2 for the sixteen-hop production body, i.e. 1.88x,
    and the share against its own fp16 is 0.0284% per-tensor / 0.0013% per-channel on three held-out frames.
    So the prediction "8/16 of the hops" holds within 6%. What that does NOT yet say is the lane's RATIO: a
    cheaper model has a cheaper fp16 comparator too (eager fp16 reads 107.6 ms against 203.8 for the production
    model), so the ratio may well stay near 1.6 while the frame gets 12 ms shorter. A render pair is the
    remaining step, and the row stays in_progress until it is run.
    THE FIRST PAIR WAS AN A/A (2026-11-20): it came back byte-identical on 494 frames, and the identity control
    said why - Int8Probe still found the tail by the key `34.weight` and built 64 channels x 16 convs, so on an
    eight-hop model it raised "list index out of range", reported unavailable, int8Frames was never set and the
    render silently ran the FP16 ENGINE. Both the picture pair and the null-sink A/B of that round were engine
    against itself and are deleted rather than kept. Fixed with compact_shape() in the probe (width, depth and
    scale from the weights; 4 cases pinned) and both pairs re-run with the engagement asserted from the log
    before any share is read.
  resolution_pair: >-
    DONE 2026-11-20. Null-sink A/B, three interleaved rounds, medians of rounds 2-3 (AB001-AB003): fp16 engine
    31.86 ms, int8 K=2 18.78 ms, ratio 1.6965x - the frame is 12.7 ms shorter than the sixteen-hop one (31.47)
    while the ratio is barely better (1.6648), which is the caveat this row was filed with: a shallower body
    makes BOTH arms cheaper. Picture, 494 frames, reference the fp16 engine's own render (SU001-SU004): worst
    share 0.01461% (frame 67), 0 frames over the 0.1% bar, worst block mean 3.23, peak 41.
  note: >-
    Filed 2026-11-20 as tier 1 of the "which model is cheapest to rescue" ranking: the working sibling is the
    production model (same 64-channel Compact), and the difference is a COUNT, not an operation. That is the
    ladder's cheapest class of change. It also matters for the product rather than only for coverage: a
    shallower body does proportionally less work, so this is the one rescue on the list that could make the
    frame faster rather than merely admit another model.

- id: rve-body-native-width-2026-11-20
  title: 'Native widths: 24 / 32 / 48-channel Compact bodies (10 files)'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 1d
  tags:
  - int8
  - coverage
  - width
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/MODEL-FIT.md
  owns_files:
  - docs/wsp/verified/int8-native-width.txt
  refutes: >-
    Widths other than 64 are closed. That verdict (E30a) measured CUTTING a trained 64-channel model to 32/48
    and found 14-37% per-layer residual - a model that cannot express its teacher. A model TRAINED at 48 is a
    different object: there is no teacher residual to inherit, and `feat` is already a constructor argument that
    every kernel takes as a `C` constexpr. What is unknown is the quantiser's behaviour and the tile tuning at
    that width, which is a measurement, not a ceiling.
  acceptance: >-
    Stage (a): one width, fully - the five Archivist denoisers (48 channels, 17 convs, 1x) - body built at
    feat=48, gross-error share against its own fp16 on three held-out frames, body time against the 64-channel
    body, and BLOCK_M / warps swept (the shipped 128/4 was tuned at 64 and need not be right at 48). Stage (b):
    the same for 32 (three RGB-max-Denoise files) and 24 (two SuperUltraCompact files, nine hops). Stage (c): a
    494-frame pair for any width whose share is within 3x of the 0.1% bar.
  progress: >-
    STARTED 2026-11-20. `Int8Body` now reads the width from the model (feat=None -> rest[0].out_channels)
    instead of defaulting to 64, and `supports()` accepts any multiple of 16 rather than exactly 64, so the
    constructor and the render's pre-flight check agree. One structural limit is now measured rather than
    assumed: the int8 dot's K must be a multiple of 16, so the 24-channel SuperUltraCompact pair CANNOT run
    as-is - it is refused with that reason, and running it would need C padded to 32 with zero channels
    (+33% work per hop for that model). That leaves 8 of the 10 files reachable without padding: five
    Archivist denoisers at 48 channels and three RGB-max-Denoise at 32.
  resolution: >-
    DONE 2026-11-20, all ten files. The width is NOT free: `tl.arange` needs a power of two, so a 48-channel body
    does not compile at all ("arange's range must be a power of 2") - 48 satisfies the int8 dot's multiple-of-16
    rule but not Triton's arange. The body now pads to the next power of two (48 -> 64, 24 -> 32) with zero
    weights and neutral scales, and a power-of-two width pays nothing. Measured (WX001-WX020,
    docs/wsp/verified/int8-native-width.txt): 32 native, 3 models, share 0.0000%, body 11.80-11.81 ms; 24 -> 32,
    2 models, share 0.0000%, body 6.22-6.30 ms; 48 -> 64, 5 models, share 0.0000-0.0004%, body 27.14-27.32 ms.
    THE 48 ROW IS THE ANSWER TO "is 48 cheaper than 64": no - the hop runs at 64 channels whatever the model has,
    so the 44% of arithmetic a 48-channel model does not need is paid anyway. Making 48 pay for 48 needs three
    16-wide mma tiles, which Triton cannot express: that is a CUDA kernel, and it is a width-GENERALITY question,
    not an optimisation (the same kernel measured flat on every optimisation lever).
    The re-tuning this row was written for turned out to be a no-op: BLOCK_M 128 / warps 4, the 64-tuned default,
    is also the best of nine combinations at a padded 48 (27.25 ms; 256x2 is 75.31, so a default picked at
    another width could have landed badly - worth having measured).
    DEMAND, measured outside this repo by the owner: a survey of a ~500-model corpus found NINE models with 48
    channels, and this collection holds five (all 1x denoisers). That closes the "write a CUDA kernel with three
    16-wide tiles to make 48 pay for 48" option by POPULATION, not by difficulty - the padding path already runs
    them at 64-channel speed and nobody waits for the 25% back. Recorded so the next reader does not reopen it.
    NOT covered: the shares are three-frame smoke tests, none of these ten has a 494-frame pair, and the RATIO is
    not measured - a cheaper model has a cheaper fp16 comparator, which is what kept the eight-hop model's ratio
    at 1.6965 while its frame fell 12.7 ms.
  note: >-
    Tier 2 of the rescue ranking: the working sibling exists and the difference is a CONSTANT (the channel
    count), which is why this is a day rather than a project - but the per-width tile tuning and the memory of
    the halo buffers are real costs, and each width needs its own picture gate. 10 files ride on it.

- id: rve-span-int8-2026-11-20
  title: 'SPAN family: what int8 would take (five files) - LATER'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P3
  gpu: true
  cost: 3d
  tags:
  - int8
  - coverage
  - span
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  owns_files:
  - docs/wsp/verified/span-int8-scope.txt
  refutes: >-
    SPAN is a different family and therefore out of reach at any price. It is out of reach CHEAPLY: spandrel
    hands it over already deploy-folded, so `Conv3XC`'s 3x1 / 1x3 / 1x1 triple is a single 3x3 by the time the
    model loads. What remains in the way is three things, all named: the 1x1 expanders (48->96 or 64->128), the
    four-way concat fusion, and the parameter-free attention (an elementwise sigmoid multiply, not a conv).
  acceptance: >-
    Stage (a), scope only, no kernel: for one SPAN model (2x_ModernSpanimationV1), measure the share of frame
    time inside 3x3 convs versus 1x1 / attention / concat, by instrumenting the fp16 model. That number decides
    whether an int8 path over the 3x3s is worth anything at all: if the 3x3s are a minority of the time, the
    many quantise/dequantise boundaries it would need cost more than they save, and the row closes as
    not-worth-it. Stage (b), only if (a) says otherwise: int8 on the 3x3s with fp16 elsewhere, share + time.
  resolution: >-
    STAGE (a) DONE 2026-11-20, and it closes the row: CLOSED AS NOT WORTH A KERNEL, by measurement rather than
    by difficulty. torch.profiler cannot be used in this build (CUPTI device timing reads 0 even for a matmul),
    so every Conv2d was bracketed with a CUDA event pair through hooks on 2x_ModernSpanimationV1 (SPAN x2, 3.94M
    params, 102 convs): forward 302 ms at 1080p->2160p, of which 3x3 convolutions are 197.85 ms (65.5%, 105 of
    them), 1x1 expanders 7.00 ms (2.3%), and everything else - the parameter-free attention multiply, the
    four-way concat, pixel shuffle, activations - 97.28 ms (32.2%). So the ceiling for int8 over the 3x3s is
    65.5%, and a third of the frame is not convolution at all. Next to the Compact lane that ceiling is worse
    (78% in ONE uniform kernel) and the work is larger: two widths (48 pads to 64, measured to cost what 64
    costs), ~19 block boundaries needing quantise/dequantise pairs, and a mixed fp16 remainder. docs/wsp/
    verified/span-int8-scope.txt, logs/span-scope/probe.json, scripts/span_scope_probe.py. If SPAN ever becomes
    the target model, the first lever is the 32.2% that is elementwise and concat - a graph problem, not a
    quantisation one.
  note: >-
    Owner's instruction 2026-11-20: tier 3 goes in the queue as "later", not now. Filed with the stage (a)
    instrument named, because the cheap falsifier here is a measurement of where SPAN's time goes, not a kernel.

- id: rve-perchannel-grid-rule-2026-11-20
  title: 'Per-channel int8 grids as a RULE keyed on the calibration spread, not a per-model flag'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 6h
  tags:
  - int8
  - quantisation
  - models
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/MODEL-FIT.md
  owns_files:
  - docs/wsp/verified/int8-grid-rule.txt
  refutes: >-
    Per-tensor is the right grid for this lane. It is the right grid for the model it was measured on: on BD
    Violet per-channel was neutral against the picture and marginally worse against the fp16 reference, which is
    why it stayed an opt-in A/B. But the grid is a property of the ACTIVATIONS, and a model whose channel maxima
    span an order of magnitude loses most of its resolution in a single per-tensor box: measured on
    2x_GarfieldJr_net_g, per-tensor reads 0.8763% against the fp16 model and per-channel 0.0436% - 20x, and from
    above the picture bar to well below it.
  retraction: >-
    2026-11-20, mine: I told the owner that the 494-frame pair reads 0.41998% for the shipped per-tensor body
    and that the 3-frame smoke numbers therefore understate by ~37x, i.e. that the shipped configuration is over
    the bar. That was assembled from two records that do not share a reference (int8-scales-bd.txt measures
    against an older reference and says so for its per-channel row) and it does not survive the measurement:
    on ONE instrument, 494 frames, engine render as reference, the shipped per-tensor body reads 0.00625%
    against K=2 and K=2 reads 0.00125% against the engine, 0 frames over the 0.1% bar in either pair. If the
    shipped body were 0.42% away from the engine, base-vs-K2 could not be 0.006%. Do not multiply those two
    records again.
  progress: >-
    MEASURED 2026-11-20, and the filed hypothesis is REFUTED. All 21 compatible models in both grid modes
    (records MF001-MF105, grid_spread beside each): per-channel rescues 9 models by >=3x - Epsilon 1.5394 ->
    0.0979, Garfield 0.8763 -> 0.0436, Ani4K 0.3021 -> 0.0140, realesr-animevideov3 0.1410 -> 0.0288, AniSD
    0.0982 -> 0.0021, BroadcastToStudio 0.0966 -> 0.0251, StarSample 0.0650 -> 0.0031, anifilm 0.0600 ->
    0.0171, LD-Anime 0.0110 -> 0.0019 - and DAMAGES 3: Futsuu 0.0114 -> 0.0309, ken-v1 0.0664 -> 0.1759,
    HFA2k_LUDVAE 0.0761 -> 0.2789. The predictor does NOT separate them: rescued spreads 2.71-6.93, damaged
    4.25-4.55, i.e. overlapping ranges, so no threshold on the calibration spread exists. What survives is a
    weaker and cheaper rule: measure both grids, keep the better one, choosing on frames disjoint from the
    ones the start-up gate certifies on (otherwise the gate passes by construction). NEXT: implement that
    pick-better step, and run the 494-frame pair for the two models whose verdict flips (Ani4K, Epsilon).
    MECHANISM 2026-11-20, measured on six models (three rescued, three damaged): the mode improves the input
    quantisation error by 2.7-3.9x on EVERY model and costs 1.20-1.40x on the weight error on EVERY model, yet
    the picture outcome flips sign and does not track either term (Futsuu 3.2x/1.40x worse, Garfield 3.7x/1.28x
    20x better). Clipping is refuted as the driver: 0.00000-0.00001% of activations exceed the grid in either
    mode on held-out frames. The open mechanism is written up for an outside reader in
    docs/wsp/REVIEW-int8-grid-modes.md, with the next discriminator named (per-INPUT-channel weight error, where
    folding s_in can crush a low-range channel to one or two integer levels - invisible in the aggregate L2).
    THE LEVER IS A CLAMP, NOT A MODE (2026-11-20, from the outside reader): `s[c] = max(s_in[c], s_t/K)` makes
    the grid a continuous axis, and the two shipped modes are its ends. Measured on six models, an intermediate
    K beat BOTH shipped modes on all six - Futsuu 0.0114 -> 0.0002 (K=2), Garfield 0.8763 -> 0.0029 (K=4),
    AniSD 0.0982 -> 0.0014 (K=4), LUDVAE 0.0761 -> 0.0443 (K=2), ken-v1 0.0664 -> 0.0037 (K=3). And the
    494-frame pair settles the product question for the production model: fp16 engine vs K=2 reads worst share
    0.00125% with 0 frames over the 0.1% bar (GK records), and K=2 vs the shipped per-tensor reads 0.00625%
    with 0 over the bar. NEXT: the same ladder on all 21 models (running), then a per-model K with the pair as
    acceptance, and the epilogue term (K=1 vs shipped) recorded as the third measured term.
  adopted: >-
    K=2 IS THE SHIPPED DEFAULT since 2026-11-20 (207f9cbf): on 22 models an intermediate K beat both previous
    modes on 17 (the other 5 read 0.0000% at every K), and the 494-frame pair against the fp16 engine reads
    0.00125% at K=2 against 0.00353% for per-tensor, 0 frames over the bar in both. The knobs stay separable:
    RVE_INT8_GRID_K unset -> K=2, =0 -> the old per-tensor path, RVE_INT8_PER_CHANNEL=1 -> pure per-channel, and
    the build logs which one it resolved. NOT adopted: a per-model optimum - eight models prefer K=3/4 by
    2.5-7x, which is the start-up pick, and rve-grid-k-predict asks whether that pick can be known without the
    sweep.
  pick_verified: >-
    THE START-UP PICK IS IN AND MEASURED (2026-11-20). RVE_INT8_GRID_K=auto builds at K=1..4, scores each with
    the app's own gate on a held-out slice, and keeps the winner only if it beats K=2 by 2x. In the app on the
    production model it picks K=2 with scores 0.0042/0.0018/0.0019/0.0046 and the certificate then reads
    0.00001%; K=3 is 1.05x better, so the guard correctly keeps the default. Cost 0.77 s (start-up 33.85 against
    33.08 without it) after fixing a double calibration that had made it 6.8 s. It first read 99.98% for every K
    because Int8Probe hands the body non-contiguous views (stride (3,1,5760,3)) and the head kernel indexes
    contiguous NCHW - the body now makes its input contiguous and logs when it had to. A calibration cache
    removes the remaining ~5 s on a re-render of the same clip.
  pick_cost: >-
    COST, after the review's section 5 (2026-11-20): candidates are {K=2, K=3} (K=1 never won on any model, and
    K=3 captures K=4's outcome except Garfield at 0.0157% - six times inside the bar), the holdout is six frames,
    and the sweep is SKIPPED when K=2's own share is <= 0.002% (the ladder's largest gain is 7.1x, so 0.002% x 7.1
    = 0.014%, seven times inside the bar - argued from that maximum, not from a 3-to-494 multiplier that does not
    exist between the two references). Measured in the app with the calibration cache warm: start-up 28.48 s
    against 33.08 without either change and 26.6 for the fp16 arm, i.e. the int8 premium is ~1.9 s instead of
    6.5 s. On the production model both fire (K=2 reads 0.0018% on the holdout, sweep skipped, build 1.21 s +
    score 0.43 s); on realesr (0.0504%) and Ani4K (0.0166%) the sweep still runs and still finds K=3/K=4.
  acceptance: >-
    (a) All 21 compatible models in BOTH grid modes, with the calibration grid's dynamic range (max/median of the
    per-channel maxima) recorded next to each - the predictor has to be a number, not a hunch. (b) The rule: if
    the spread separates the models that improve from the models that degrade, it goes into the code as a
    decision on the measured grid (with its threshold in the log line and in FRAME-BUDGET); if it does not
    separate them, the row closes with "per-channel is a per-model choice" and the flag stays. (c) A 494-frame
    pair for whichever model would be adopted under the rule - 2x_Ani4K_Compact (0.3021% per-tensor) and
    1x-Epsilon (1.5394%, refused by the start-up gate) are the two cases that decide it.
  resolution: >-
    STAGE (a) DONE 2026-11-20, and it closes the row: CLOSED AS NOT WORTH A KERNEL, by measurement rather than
    by difficulty. torch.profiler cannot be used in this build (CUPTI device timing reads 0 even for a matmul),
    so every Conv2d was bracketed with a CUDA event pair through hooks on 2x_ModernSpanimationV1 (SPAN x2, 3.94M
    params, 102 convs): forward 302 ms at 1080p->2160p, of which 3x3 convolutions are 197.85 ms (65.5%, 105 of
    them), 1x1 expanders 7.00 ms (2.3%), and everything else - the parameter-free attention multiply, the
    four-way concat, pixel shuffle, activations - 97.28 ms (32.2%). So the ceiling for int8 over the 3x3s is
    65.5%, and a third of the frame is not convolution at all. Next to the Compact lane that ceiling is worse
    (78% in ONE uniform kernel) and the work is larger: two widths (48 pads to 64, measured to cost what 64
    costs), ~19 block boundaries needing quantise/dequantise pairs, and a mixed fp16 remainder. docs/wsp/
    verified/span-int8-scope.txt, logs/span-scope/probe.json, scripts/span_scope_probe.py. If SPAN ever becomes
    the target model, the first lever is the 32.2% that is elementwise and concat - a graph problem, not a
    quantisation one.
  note: >-
    Tier 0 of the rescue ranking: no code - the flag already exists and rescues the worst offender for free. The
    reason it is worth a row rather than a note is that a flag nobody knows to set is not a capability: the
    next reader sees "Garfield quantises badly" and bins the model, when the mechanism says the GRID was the
    problem. Also: per-channel costs a multiply in the epilogue (measured 27.10 -> 27.86 ms body on one draw),
    so it is a trade to be decided per model, not a free win to be made default.

- id: rve-int8-calibration-cache-2026-11-20
  title: 'Cache the calibration grids per (model, clip): 6.5 s of start-up, ~5 of it recomputed every run'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P3
  gpu: false
  cost: 1h
  tags:
  - int8
  - startup
  base_branch: perf/inference
  relates_to:
  - backend/src/utils/Int8Probe.py
  - backend/src/pytorch/Int8Body.py
  owns_files:
  - docs/wsp/verified/int8-calibration-cache.txt
  refutes: >-
    The int8 start-up cost is the price of the speed, so it cannot be reduced. Measured, it is 6.5 s and it is
    almost entirely REPEATED work: the fp16 arm reaches its first frame at 26.58/26.61/26.60 s, the int8 arm at
    33.08/33.09/33.08 s in the same session. Of the 6.5 s, an isolated breakdown (8 calibration frames) puts
    3.27 s in decoding and uploading the spread frames, 2.07 s in running the EAGER fp16 model over them for the
    per-channel maxima, 0.02 s in the weight quantisation and 0.49 s in the certify pass. The grids themselves
    are 24 vectors of 64 floats - they depend on (model, clip), not on the render.
  acceptance: >-
    (a) A cache keyed by (model file hash, clip file hash, frame indices, margin) storing the grids and the
    per-layer maxima, with the key and the hit/miss printed in the render log - a cache that cannot be audited
    is a stale-number source. (b) A hit must produce a byte-identical body: same launches, same picture on a
    494-frame pair as the uncached run, because the whole point is that nothing but time changes.
    (c) The start-up delta re-measured in the app: the int8 arm's "first frame enqueued" against the fp16 arm's
    in the same session, hit versus miss.
  resolution: >-
    DONE 2026-11-20. `Int8Body.calibrate` now caches the grids under a key built from a fingerprint of the
    calibration frames (a 32-bin luma histogram per frame at 1/16 resolution - microseconds, versus 300 MB to
    hash) and the model's own digest (first and last conv weights plus their shapes, so it is stable across
    processes and does not depend on a file path). A hit skips every eager forward; `RVE_INT8_CALIB_CACHE=0`
    disables it; a broken cache logs and measures instead of costing a render. Three tests pin it: a hit must not
    call `_measure` and must return the measured grids, a different clip must miss, and the off switch must write
    nothing. NOT measured: the hit's actual start-up saving in the app - the eager calibration is ~4.8 s for 24
    frames (measured when the pick double-calibrated), and the cache removes all of it on a re-render of the same
    clip, but that has not been timed end to end yet.
  resolution: >-
    STAGE (a) DONE 2026-11-20, and it closes the row: CLOSED AS NOT WORTH A KERNEL, by measurement rather than
    by difficulty. torch.profiler cannot be used in this build (CUPTI device timing reads 0 even for a matmul),
    so every Conv2d was bracketed with a CUDA event pair through hooks on 2x_ModernSpanimationV1 (SPAN x2, 3.94M
    params, 102 convs): forward 302 ms at 1080p->2160p, of which 3x3 convolutions are 197.85 ms (65.5%, 105 of
    them), 1x1 expanders 7.00 ms (2.3%), and everything else - the parameter-free attention multiply, the
    four-way concat, pixel shuffle, activations - 97.28 ms (32.2%). So the ceiling for int8 over the 3x3s is
    65.5%, and a third of the frame is not convolution at all. Next to the Compact lane that ceiling is worse
    (78% in ONE uniform kernel) and the work is larger: two widths (48 pads to 64, measured to cost what 64
    costs), ~19 block boundaries needing quantise/dequantise pairs, and a mixed fp16 remainder. docs/wsp/
    verified/span-int8-scope.txt, logs/span-scope/probe.json, scripts/span_scope_probe.py. If SPAN ever becomes
    the target model, the first lever is the 32.2% that is elementwise and concat - a graph problem, not a
    quantisation one.
  note: >-
    Asked on 2026-11-20 after "isn't there a minute of waiting before int8 starts?". The answer measured is
    6.5 s, not a minute, and the breakdown says where it goes. The alternative - fewer calibration frames - is
    already measured as a bad trade: single-frame grids read 0.566% where spread calibration reads 0.050%, 11x
    worse. Caching keeps the spread calibration and drops the repetition.

- id: rve-grid-k-predict-2026-11-20
  title: 'Can the optimal grid clamp K be known without the 2-4 s start-up sweep?'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P2
  gpu: false
  cost: 6h
  tags:
  - int8
  - quantisation
  - models
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/wsp/REVIEW-int8-grid-modes.md
  owns_files:
  - docs/wsp/verified/int8-grid-k-predict.txt
  refutes: >-
    The best K can only be found by building and scoring five grids. It can only be found that way TODAY: the
    ladder shows the optimum sits at K=2 for some models and K=3/4 for others (by 2.5-7x), and the one cheap
    predictor tried so far - the calibration grid's dynamic range - does not separate them (rescued spreads
    2.71-6.93 against damaged 4.25-4.55). But the ladder also produced 22 x 6 (model, K) points with their
    weights on disk, which is exactly the dataset a predictor needs. If a weight-only statistic ranks the best K
    correctly on held-out models, the sweep disappears and the start-up cost with it.
  acceptance: >-
    (a) A candidate set measured, not guessed, each computable from the weights and the calibration maxima with
    no forward pass: per-input-channel weight norms against their maxima (the crushed-channel hypothesis),
    the per-layer condition number of w' in the codes' domain, the spread of per-output-channel w_sc, and the
    ratio of the largest to the median folded weight. (b) The test is ranking, not correlation: leave-one-out
    over the 22 models, and the predictor must name the best K (or a K within 1.5x of it) for at least 18 of
    them - below that the sweep stays. (c) If it passes, it is a build-time rule with its own log line and its
    threshold in FRAME-BUDGET; if it fails, the row closes with the negative result and the sweep is the answer.
  resolution_beta: >-
    SECOND ATTEMPT, the outside reader's better formulation, also measured 2026-11-20: predict argmin_K inside
    one model from `input_err(K) + beta*weight_err(K)`, both computed as exact functions of K from the
    calibration activations and the weights (no forward per candidate). Result: 4 of 22 at every beta from 1.0 to
    6.0 (logs/grid-k-beta/rows.json, scripts/grid_k_beta_probe.py). What it DID establish is why the optimum is
    interior: input_err falls monotonically with K (median 2.88x from K=1 to K=4) while weight_err has an
    interior MINIMUM - 0.021 at K=1, 0.009 at K=4, 0.029 at per-channel - because folding the per-channel scale
    into the weights first balances the columns and only past that point crushes the small ones. The sum still
    does not rank the argmin, because the predicted quantity is a thresholded pixel count, not a norm.
  resolution: >-
    DONE 2026-11-20, NEGATIVE RESULT - the answer is "no, not from the weights". Four weight-only statistics were
    computed per model (no forward pass): the coefficient of variation and the max/median of the per-output-channel
    weight energy, the max/median of the per-input-position energy, and the log10 median condition number of the
    folded matrix. Against the ladder's split - 14 models where some K beats K=2 by >=2x, 8 where it does not -
    EVERY statistic overlaps, and not marginally (a mover reads row_cv 0.074 while a stayer reads 0.300). With
    five statistics tried (these four plus the calibration spread refuted earlier) and no separation, the
    property that decides K is not a summary of the weights: it is how the quantisation error propagates through
    sixteen layers into a thresholded picture statistic. The measurement that WOULD capture that is a per-layer
    ablation, which costs more than the sweep it would replace and is valid only for the model it ran on.
    So the start-up sweep stays (RVE_INT8_GRID_K=auto, ~3 s, guard x2). docs/wsp/verified/int8-grid-k-predict.txt,
    logs/grid-k-predict/rows.json, scripts/grid_k_predict_probe.py.
  resolution: >-
    STAGE (a) DONE 2026-11-20, and it closes the row: CLOSED AS NOT WORTH A KERNEL, by measurement rather than
    by difficulty. torch.profiler cannot be used in this build (CUPTI device timing reads 0 even for a matmul),
    so every Conv2d was bracketed with a CUDA event pair through hooks on 2x_ModernSpanimationV1 (SPAN x2, 3.94M
    params, 102 convs): forward 302 ms at 1080p->2160p, of which 3x3 convolutions are 197.85 ms (65.5%, 105 of
    them), 1x1 expanders 7.00 ms (2.3%), and everything else - the parameter-free attention multiply, the
    four-way concat, pixel shuffle, activations - 97.28 ms (32.2%). So the ceiling for int8 over the 3x3s is
    65.5%, and a third of the frame is not convolution at all. Next to the Compact lane that ceiling is worse
    (78% in ONE uniform kernel) and the work is larger: two widths (48 pads to 64, measured to cost what 64
    costs), ~19 block boundaries needing quantise/dequantise pairs, and a mixed fp16 remainder. docs/wsp/
    verified/span-int8-scope.txt, logs/span-scope/probe.json, scripts/span_scope_probe.py. If SPAN ever becomes
    the target model, the first lever is the 32.2% that is elementwise and concat - a graph problem, not a
    quantisation one.
  note: >-
    Asked for by the owner on 2026-11-20: "can the optimal K be determined without the 2-4 s delay - maybe there
    are empirical signals in the weights?" The honest starting point is that the sweep is cheap in absolute
    terms (four extra builds from the same calibration maxima) but it doubles a 6.5 s start-up, and the
    calibration cache row removes the frames half of that, which makes the sweep's share the remaining cost.

- id: rve-trt-int8-calibrated-2026-11-20
  title: "Build TensorRT's own int8 with a calibrator and put it against the Triton body"
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 1d
  tags:
  - int8
  - quantisation
  - tensorrt
  base_branch: perf/inference
  relates_to:
  - scripts/trt_int8_calibrate.py
  - scripts/trt_int8_accuracy.py
  - docs/wsp/verified/fp16-engine-layers.txt
  owns_files:
  - docs/wsp/verified/trt-int8-calibrated.txt
  refutes: >-
    The hand-written Triton body is necessary. What was measured here is the EXPLICIT Q/DQ route (lossless but
    slower, and it went through torch_tensorrt); TensorRT's own IMPLICIT int8 with a calibrator was never built,
    and it is the one comparator that can say whether 26.1 ms of hand kernel buys anything over the vendor's
    quantiser on the same graph. If calibrated int8 lands in the same class at the same picture, the body is
    redundant; if it lands slower or visibly worse, the body is justified by measurement instead of by preference.
  acceptance: >-
    (a) Three engines from one ONNX at the app's builder level (fp16, int8 entropy, int8 min-max), each with its
    build time and size in a manifest that names the calibration frames by sha256. (b) Frame time and per-layer
    precision from `trtexec --loadEngine --dumpProfile --dumpLayerInfo` - the same instrument that produced the
    fp16 budget, so the int8/fp16 quotient is same-instrument. (c) Picture on frames HELD OUT from calibration:
    max and mean |delta| in 8-bit codes, share off by more than one code, PSNR against the fp16 engine. (d) Only
    if (b)+(c) are in the same class as the body: the 494-frame pair in the app, which is this lane's own bar.
  note: >-
    Asked for by the owner on 2026-11-20 ("also test TRT's own int8 with a calibrator"). Calibration population is
    eight frames, four from each of the two bluray cuts the lane already renders (bd_violet20s, bd_csm_same); the
    evaluation frames are different timestamps from the same cuts, because a delta measured on the calibration set
    is a fit, not a result. The app's own `.engine` is a TorchScript archive, so every arm here is built from ONNX
    at 1920x1080 - a whole-frame engine, not the app's tiled one; that difference is stated in the write-up.
  resolution: >-
    DONE 2026-11-20, and it closes in the body's favour by measurement. Three engines from one ONNX at the app's
    builder level (fp16 193.5 s, int8-entropy 170.9 s, int8-minmax 167.9 s; calibration on 8 named bluray frames,
    sha256 in the manifest), profiled by the same trtexec that produced the fp16 layer budget: fp16 46.854 ms in
    25 layers, both int8 arms 38.87 ms in 60 layers, i.e. 1.205x - and the layer split IS the mechanism, because
    the per-channel PReLU cannot join an int8 epilogue (the same finding engine-int8.txt made on the Q/DQ build).
    Both calibrators agree within 0.008 ms, so the algorithm is not the variable. Picture on held-out frames:
    the bright csm frame is clean (max 5.85 codes, 0.0000% above 8 codes, 51.57 dB) and the dark violet frame is
    not (entropy: max 91.14 codes, 1.0715% above 8 codes, 39.34 dB; min-max: max 20.86, 0.0136%, 44.95 dB).
    The failing pixels are shadows lifted by ~0.3 in 0-1 units, spread across the whole frame (row/column
    profiles flat), which is what symmetric-only quantisation plus sixteen PReLU boundaries does. Against the
    lane's own bar (0.1% of pixels above 8 levels) the body reads 0.00125% on 494 frames and TensorRT's int8
    reads 1.07% on one frame. So the hand body is faster AND three orders of magnitude better on the picture; a
    494-frame pair of the calibrated engine would only confirm what one held-out frame already shows, so it is
    not run. The speed half is then closed with ONE instrument instead of a comparison of two:
    scripts/trt_vs_body_probe.py runs the fp16 engine, TensorRT's int8 and the Triton body in one process on one
    input frame, interleaved, same CUDA event bracket - 48.401 / 38.814 / 27.051 ms (TV001-TV003), i.e. the body
    is 1.435x faster than TensorRT's int8 (TV004) and 1.789x faster than fp16 (TV005); pictures against the SAME
    fp16 reference: bright frame 5.79 vs 5.85 codes (body 1.7 dB lower), dark frame 0.0089% vs 1.0715% above 8
    codes and 49.36 vs 39.34 dB (TV007-TV018). Model scope: no tiling, no pack, both arms whole-frame.
    docs/wsp/verified/trt-int8-calibrated.txt, logs/trt-int8/, scripts/trt_int8_{calibrate,accuracy,records}.py,
    scripts/trt_vs_body_probe.py.

- id: rve-certificate-picture-2026-11-20
  title: "The certificate was withdrawn to save 33 s and it moved the picture 0.45% - re-measure and decide"
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 1d
  tags:
  - int8
  - picture
  - startup
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-certificate-removal.txt
  - docs/wsp/verified/int8-scales-bd.txt
  owns_files:
  - docs/wsp/verified/int8-certificate-picture.txt
  refutes: >-
    Withdrawing the probe's certificate was a change to reporting and to cost. It was also a change to the picture:
    the 494-frame ffv1 pair read worst share 0.45050%, 356 frames above 0.1%, peak 60, and the A/A on the same code
    state read identity - so the difference is the certificate, not the pipeline. The mechanism was never
    identified (cudnn's algorithm choice under a different free-memory state, and the engine warm-up the
    certificate does, are the two candidates). Every picture number in this lane was measured with the certificate
    PRESENT and the shipped path does not run it, so the shipped pixels are not the measured pixels.
  acceptance: >-
    (a) The pair re-run on the CURRENT tree (after the tail-CSC payload and the crop calibration), certificate on
    against off, 494 frames, lossless sink. (b) The allocation-only discriminator the old page named: allocate the
    certificate's ~2 GB, free it, and render without the certificate - if that reproduces the difference, the
    mechanism is memory state and not the certificate's forwards. (c) A decision: ship the certificate, or
    re-baseline every picture number against the certificate-off path and say so in FRAME-BUDGET.
  note: >-
    Found by the 2026-11-20 audit for measured-but-not-applied work. This is the largest such item: 0.45% of pixels
    above the bar between what was measured and what ships, with 33 s of start-up as the reason for the gap.
  resolution: >-
    DONE 2026-11-20, mechanism identified and the worry answered. Four arms in one session, 494 frames each, ffv1,
    against the shipped certificate-off path: certificate ON 0.00057% worst share (frame 23, peak 21); 2 GB
    allocated and released 0.00000% with peak 0 (BIT-IDENTICAL); fp16 engine warmed on 6 frames 0.00057% with the
    same frame and the same peak. So the mechanism is the engine WARM-UP, not the quantised twin's allocation, and
    the 0.45% of 2026-11-19 does not reproduce on the current tree - it reads 0.00057% now, 0 frames above the bar
    either way, with the tail-CSC payload and the crop calibration having landed in between (this row does not
    attribute the difference between the two numbers). No action: the shipped pixels are 0.00057% from the
    certified ones. docs/wsp/verified/int8-startup-split2.txt, logs/cert-picture/.

- id: rve-ink-lift-2026-11-20
  title: "The rendered file lifts line art by ~5 levels against the model, and it is not the quantiser"
  type: experiment
  status: todo
