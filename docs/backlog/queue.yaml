  acceptance: 'docs/wsp/lean/Statistic.lean compiles with no `sorry`, proving: worst_of
    is monotone under adding frames; the bar comparison is invariant under relabelling
    only when the item set is equal; the statistic is a deterministic function of
    (render, reference, item set). Plus the list of assumptions that had to be made
    explicit - that list is the deliverable.'
  note: 'Scope is deliberately not the hardware: no formal model of clock state, power
    cap or a second process on the card exists, and that is where the retracted headlines
    came from. The expensive retractions here were referential (which population,
    which instrument), and Lean cannot see a wrong population - so the spike asks
    whether formalizing the statistic surfaces an ambiguity we have been resolving
    by memory. It does not make any number more trustworthy, which is why it is filed
    as a spike. TOOLCHAIN 2026-11-16: no lean/elan/lake on this host. The list of
    assumptions that a formal statement forces - the spike''s real deliverable - is
    extracted in docs/wsp/lean/Statistic.md; the three lemmas remain unproved.'
  resolution: 'closed 2026-11-16. Lean 4.36.0 installed from the GitHub tarball (elan''s
    host release.lean-lang.org does not resolve here). docs/wsp/lean/Statistic.lean
    compiles with no `sorry` and proves: an empty sample passes every positive bar
    (the min_n rule, proved rather than argued, because Nat division by zero is 0);
    to certify a sample you must certify every frame (plus its contrapositive: one
    failing frame fails the sample); the statistic is a function of (pixels, threshold)
    alone; and two populations are interchangeable only when their item lists are
    equal, with the kind part of identity. VERDICT: the kill criterion was met - ~110
    lines, proofs in about ten minutes - and Lean quietly confirmed the prediction
    that matters for this project: it cannot see a wrong population or a swapped instrument,
    so it sharpened the specification and certified no measurement. Kept because that
    statement now exists in a machine-checked form.'
