- id: rve-hop-index-arithmetic-2026-11-20
  title: 'The hop pays 0.59 ms per launch that no tap touches - and W is divided at runtime'
  type: experiment
  status: done
  owner: '@supervisor'
  resolution: >-
    CLOSED 2026-11-19 BY MECHANISM, and my hypothesis was refuted twice on the way to it, both times by
    measurement. (1) The tap-independent 0.59 ms is NOT index arithmetic and NOT the epilogue: the epilogue costs
    0.112-0.120 ms (7.1% - bare store 1.458 against shipped 1.570, docs/wsp/verified/int8-hop-occupancy.txt). It
    is the LATENCY OF THE FIRST GATHER'S ROUND TRIP: one tap costs 0.59 ms, three cost the same 1.072, nine cost
    1.551 - because with the accumulator holding BLOCK_M x 64 int32 the SM keeps only 3.96 of 12 warps per
    scheduler resident (ncu) and 56.21% of cycles have no eligible warp. (2) That occupancy cannot be bought:
    nine launch configurations of the same kernel with identical codes (0 differences) and the SHIPPED
    BLOCK_M 128 / 4 warps is the best of them - 128/8 is 54% slower, 64/4 54%, 32/4 80%, 256/4 12.6% - because
    every direction that adds warps shrinks the 64-wide MMA tile. So the named cause is measured, the response
    to it is measured, and the one remaining idea (shared-memory staging of the three-row window) is exactly
    what the recorded Triton pipelining attempts already made worse (2.497/2.635 ms, noted in Int8Kernels.py).
    docs/wsp/verified/int8-hop-occupancy.txt, records int8-hop-occupancy.jsonl (O001-O012),
    logs/hop-occupancy/, logs/hop-epilogue/. INVALID ARMS from the first attempt, named not dropped: no-store
    (dead-code elimination, 0.018 ms) and a runtime-W stand-in that read one element past the weight buffer.
  priority: P1
  gpu: true
  cost: 3h
  tags:
  - int8
  - hops
  - kernel
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Kernels.py
  - docs/wsp/verified/int8-hop-roof.txt
  owns_files:
  - docs/wsp/verified/int8-hop-index.txt
  refutes: >-
    The hop line has no lever left. Decomposing the kernel says otherwise: one tap and three taps both cost
    1.072-1.073 ms while nine taps cost 1.551, so ~0.59 ms of every launch is paid before any tap work is
    counted (docs/wsp/verified/int8-hop-roof.txt), and every lever tried so far was a tap-side or grid-side
    change. CORRECTED by ncu the same day (docs/wsp/verified/int8-hop-ncu.txt): the SM runs at 74% and store-only
    is already at 95% of the DRAM roof, so the headroom is ~26% (25.7 -> ~19 ms), and a tap-independent constant
    at that utilisation is most plausibly the EPILOGUE's per-element arithmetic rather than index arithmetic.
    So this row now tests a weaker hypothesis, and it tests the epilogue too: an arm with the epilogue reduced
    to a bare integer store. If neither the constexpr-W arm nor the reduced-epilogue arm moves the 1-tap arm by
    20%, the constant is the launch ramp and the memory system and the "floor" finally has evidence.
  acceptance: >-
    One hop, arms in one process, CUDA events, >=3 rounds, medians of rounds 2+: (a) today, (b) W as
    tl.constexpr, (c) 2-D tile with h constant per CTA, (d) the best of (b)/(c) at 1, 3 and 9 taps to see
    whether the constant moved or only the slope. Report ms, TOPS and GB/s per arm, and the codes against
    today (differences must be explained - a constexpr W changes no arithmetic and must be 0). If an arm wins
    by >=10%, the 16-hop chain in the app with the phase line beside the loop, then the full-clip picture.
  note: >-
    Two arms of the first attempt at this are INVALID and named in the record rather than dropped: a "no-store"
    arm reads 0.018 ms because the compiler deletes the kernel, and a "runtime W" arm read a scalar from one
    element past the weight buffer, which silently masked the loads (0.485 ms). Both are the same class of
    error - a stand-in that changes the work instead of the thing under test. ncu is now installed (2026.4.0,
    from the CUDA apt repo, no root) and adds one more arm worth taking: Compute Workload Analysis, which names
    the saturated pipe.
