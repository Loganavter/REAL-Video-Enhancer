  - id: rve-force-epilogue-tactic-2026-11-15
    title: "B2: force the epilogue-capable tactic at C=32 (editable timing cache / algorithm selector)"
    type: experiment
    status: todo
    owner: null
    priority: P0
    gpu: true
    cost: "2h"
    tags: [fusion, tactics, timing-cache]
    base_branch: perf/inference
    relates_to: [backend/src/pytorch/RawTRTEngine.py, docs/RESEARCH-LEDGER.md]
    owns_files: [scripts/force_tactic.py]
    refutes: "No tactic in the epilogue-capable family can be built for C=32 - then the width genuinely needs a kernel of our own with a 32-wide N tile, and the prize moves to E27."
    acceptance: "A C=32 plan whose body convolutions BOTH report a fused myelin tactic AND land at or under ~1.3 ms per convolution. The second half is the whole prize: 16 x 1.3 + ~4 = 24.8 ms (2.29x), while a fused tactic at 3.0 ms gives 51.5 ms (1.10x). 'Beats winograd' is not the criterion - winograd measured 3.12 ms here, and beating it is compatible with gaining nothing. Conservative floor: 30.8 ms (1.84x) if the N tile stays half empty."
    confound: "The single-block probe and the full model choose DIFFERENT tactics at C=32: the probe picks scudnn_winograd (3.12 + 2.46 = 5.58 ms) while the full model picks indexed_wo_smem (1.26 + 1.45 = 2.71 ms) - 2.06x apart, not drift. At C=64 they agree (2.67 against 2.93). So the probe ranks something the engine does not do; the boundary reformats on a single block are the same confound that made the 64->64 ceiling read 7.90 ms against ~3 in the engine. Fix: NHWC I/O on the probe, and re-verify the top candidates inside the full model before believing any of them. Same for the workspace: a tactic skipped for lack of a scratch buffer is absent from the sweep for the wrong reason (the documented CUDA error 2 allocating 4.2 GB during autotuning)."
    note: "B1 names the tactic family that fuses; this tries to get it back at 32. TRT 10.12 exposes IAlgorithmSelector (deprecated in 10.8 in favour of editable ITimingCache) and ITimingCache, so exclusion is possible in principle - the open question is whether the selector can identify a tactic by family, since IAlgorithmVariant gives implementation+tactic hash rather than a kernel name."
