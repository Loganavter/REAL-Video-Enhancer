  - docs/wsp/verified/int8-hop-prefetch.txt
  owns_files:
  - docs/wsp/verified/int8-hop-prefetch.txt
  resolution: >-
    DROPPED 2026-11-19 after testing the theory in its two cheap forms, both NEGATIVE. The plan was: the first
    tap costs 0.59 ms because its round trip has no warps to hide behind, so stage the three-row window in shared
    memory in a hand-written CUDA kernel (Im2win's recipe), prize ~9 ms/frame. (1) Reordering the loads to overlap
