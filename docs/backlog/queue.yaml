- id: rve-frame-accounting-2026-11-19
  title: 'DONE: the 6.2 ms was pack+queue and the wrapper - and the profile total is not wall time'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 2h
  tags:
  - instrument
  - accounting
  - int8
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-wall-ab.txt
  - docs/wsp/verified/logs/wall-ab/
  - backend/src/RenderVideo.py
  opens_files: []
  owns_files:
  - docs/wsp/verified/int8-frame-accounting.txt
  refutes: >-
    The int8 whole-frame budget is the sum of what the profile prints. On 2026-11-18 (BD Violet, int8 body,
    reuse off) the profile printed frame total 50.40 ms against parts summing to 44.17 - gate 0.00,
    inference 43.90 (engine 1.93, handover 0.01), input convert 0.00, read wait 0.27 - so 6.23 ms (12%) is
    unnamed in THAT line, and it is 88% of what int8 bought. The components are not unknown, though:
    ledger-export's per-frame budget names the same ones for the tiled fp16 path (get_frame_tensor's 10-bit
    upload + colour stage 2.80, output Frame construction ~1.6, pack + D2H + queue ~3, writer 12.34
    concurrent and NOT on the critical path). If those three do not account for the 6.23 ms once they are
    timed in the no-gate path, the budget is genuinely broken; if they do, the row closes with the int8
    frame reduced to named parts and every per-phase number in the lane becomes comparable.
  acceptance: >-
    On both BD clips and both arms, the frame total reconstructed from NAMED components to within the
    session's drift (sum >= 98%), each component on its own timer: get_frame_tensor upload + colour, the
    output Frame construction, pack + D2H + queue, read wait, the body's phase counter, and the writer
    (reported beside the loop, not added to it - it is concurrent). Records with the timers' own
    configuration. This is a 1-2 h job, not a hunt: the expectation from the record is that the 6.23 ms IS
    the three plumbing terms, and either answer is the deliverable.
  resolution: >-
    measured 2026-11-18 18:00-18:15, one run per arm on both BD cuts, three stages newly timed (wrapper
    around the body call, preview, pinned-slot fill + writeQueue.put) and printed beside named/unaccounted.
    The 6.2 ms was **pack+queue 3.5-3.9 ms plus ~2.4 ms of wrapper and read wait** - named in the ledger for
    the tiled path, never printed here; unaccounted is now -0.16..-0.27 ms. The bigger finding: in the
    PIPELINED int8 path the profile's frame total runs 27-30% ABOVE the render loop's wall clock (67.32
    against 51.85 on Violet; 58.94 against 46.53 on Chainsaw), because upscaleOption(frame) blocks on the
    frame already in flight, so summing per-iteration windows double-counts overlapped work. Rule that
    follows: wall time from the loop line, attribution from the body's phase counter, never a frame budget
    built by adding profile components. int8-wall-ab's ratios are unaffected (they use the loop). Records:
    docs/wsp/verified/int8-frame-accounting.txt, harness check PASS. NOT explained and left open there:
    last_model_ms reads 17.2-17.5 on int8 against 1.93 in the 17:00 session with the same clocks and no
    throttle reason, so self-reported inference cannot be compared across sessions either.
  note: >-
    Why it was first: int8 bought 1.09-1.14x, i.e. 5.9-7.1 ms per frame, and the unaccounted slice was the
    same size. The 2026-11-18 wall A/B had to quote "frame total" and "body total" as separate numbers with
    no bridge; the tail (8.8 ms) is now the largest NAMED slice after the hops (27.0). CHECKED AGAINST THE
    RECORD 2026-11-19 (harness db + corpus grep): nothing reports this hole, and the contrast sharpens it -
    the CHAIN's own accounting closes in int8-window (16-hop chain 30.48 + head+quantise 1.60 +
    tail+residual 5.78 against a 36.19 ms window, i.e. the parts sum slightly ABOVE the total), so the
    missing 6.2 ms is in the PRODUCT's path around the chain, not in the body. That is why the row is a
    measurement of the app, not of the kernel.

- id: rve-tail-fusion-2026-11-19
  title: 'CLOSED: the tail is not four bandwidth passes - it is a 5-TFLOPS convolution at 58-63% of the tail'
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 1d
  tags:
  - int8
  - tail
  - fusion
  - 4k
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-wall-ab.txt
  - docs/wsp/verified/int8-window.txt
  - backend/src/pytorch/Int8Body.py
  owns_files:
  - scripts/probe_tail_fusion.py
  refutes: >-
    The tail cannot be made cheaper than the 8.2-8.8 ms it costs today. It is the one place where the
    boundary rule the lane already established (judge by hops removed, not by FLOPs) predicts a win: the
    tail is four passes over a 4K tensor whose recorded split on the earlier model was dequant 2.1, conv +
    shuffle 3.6, residual ~2.4 - i.e. 4K bandwidth, not arithmetic. If a fused kernel does not save at
    least 1.5 ms (3% of the frame), the tail is compute-bound after all and the row closes with a floor.
  acceptance: >-
    A/A first, and the criterion is not "close": the fused tail must reproduce the current one BYTE FOR
    BYTE on 494 frames, which is only achievable if the fusion merges passes without changing the order of
    the arithmetic (conv -> shuffle -> residual stays that arithmetic, computed in one kernel). If
    byte-identity fails, the change altered the arithmetic and is a different kernel, not a fusion - and
    arXiv:2609.00363 shows why that must not be waved through: of five epilogue faults (scale precision,
    double rounding, multiplication order, output truncation, fused ordering) each moves the output by at
    most ONE bf16 spacing, four of five are detected by no tolerance check at all, and a 1-spacing
    tolerance is blind to the whole class by construction. Our bar (share of pixels >8 levels) is a
    tolerance check of exactly that shape, so it cannot certify an epilogue reordering. With identity
    proven: interleaved wall A/B, >=3 rounds, one session, both BD clips, medians of rounds 2+, the tail
    phase line reported beside the frame total.
  resolution: >-
    measured 2026-11-18, both BD cuts, one run each, with the body timing its own four tail steps. The split
    refutes the row's premise: violet dequant 1.58 / conv 4.86 / shuffle 0.40 / residual 0.93 = 7.77 ms;
    chainsaw 1.62 / 5.99 / 0.39 / 2.36 = 10.36. The conv is 58-63% and runs 28.7 GFLOP in 4.9-6.0 ms, i.e.
    ~5 TFLOPS against ~44 non-tensor / ~176 tensor-core peak - it is a badly used convolution, not a
    bandwidth problem. The fusion ceiling (shuffle+residual in one pass) is 1.0-2.0 ms, LESS than a 2x
    improvement of the conv (2.4-3.0 ms), and the dequant is already within 0.2 ms of its own traffic floor
    (400 MB). Closing the row unspent is the result: its acceptance (a byte-identical fused tail) would have
    funded the wrong kernel. The recorded split in int8-window.txt (2.1/3.6/2.4) describes another model and
    output size, which is why it misled. Follow-up filed as rve-tail-conv-utilization-2026-11-19. Record:
    docs/wsp/verified/int8-tail-split.txt (harness check PASS).
  note: >-
    Literature basis, to be checked rather than trusted: NTIRE 2023's real-time 4K SR report treats pixel
    shuffle/unshuffle as THE efficiency transform and reports 4.75 ms for a 3x 1080p->4K network on a
    3090 Ti (PSNR 30.15) - an order of magnitude below this product's ~50 ms, which says the field's
    real-time class fuses these transforms. What is NOT established here: the traffic saved by fusing on
    THIS tail at 3840x2160x64 channels, and whether the residual add can join without breaking the A/A.
    CHECKED AGAINST THE RECORD 2026-11-19: `backend/src/pytorch/FusedTail.py` already exists, but it fuses
    for a different purpose - collapsing an x4 model's tail so it emits x2 (functional), not merging
    passes for bandwidth. NOT to be redone (docs/MODEL.md, measured): CUDA graphs ~0.3%, L2 tiling
    full-vs-none +0.5%, hand-written conv kernels untested but 4.7x slower in the one public attempt.
    So the untried part is exactly the pass count over the 4K tensor, nothing else. EXTERNAL TEMPLATE
    (arXiv:2606.14598, read 2026-11-19): a single fused Triton INT8 GEMM with per-token x per-channel
    dequantisation and bias folded into the epilogue, autotuned per shape - i.e. the standard rule this
    lane measured for itself (E9', E30a: judge by removed hops, not FLOPs), not a technique of ours. Their honest end-to-end numbers are the shape to expect
    here: 2.8-4.2x per GEMM, ~1.1x end to end. Do not quote their speed-up as ours: different operation,
    different card, different product.

