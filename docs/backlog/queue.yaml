- id: rve-render-determinism-2026-11-19
  title: 'DONE: not warm-up - the certificate built the body before its calibration frames arrived'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 3h
  tags:
  - instrument
  - determinism
  - int8
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-certificate-removal.txt
  - backend/src/RenderVideo.py
  - backend/src/utils/Int8Probe.py
  owns_files:
  - docs/wsp/verified/render-determinism.txt
  refutes: >-
    Two renders of the same configuration differ only by their code. Removing the probe's certificate moved
    0.45050% of pixels on the worst frame (356 of 494 above the bar, peak 60) between two lossless renders,
    while the same tree with the certificate ON is bit-identical to the pre-change tree and the A/A of two
    certificate-off runs is identical. If a 2 GB allocation made and freed before the first frame - with no
    change to any weight, scale or frame - moves half the clip across the bar, then every picture A/A in this
    lane that compared two code states was measuring the allocation history as much as the change.
  acceptance: >-
    Three arms in one session, all lossless ffv1, compared with gate_sweep --reference-kind config: (1) plain
    render; (2) render preceded by an allocation of the quantised twin's size, allocated and freed before the
    first frame, nothing else changed; (3) render preceded by warming the fp16 engine on the probe's pair
    sizes without allocating the twin. Whichever arm reproduces the certificate-on render names the
    mechanism. Then the PIN: the shrink that makes the undisturbed and the disturbed renders identical
    (empty_cache at a fixed point, a fixed workspace, cudnn.benchmark with an explicit warm-up, or an
    explicit algorithm), with a run showing identity. If no pin exists, the lane records that picture A/As
    are only valid within one allocation history - which is weaker than the protocol assumes - and says so
    where the protocol lives.
  resolution: >-
    solved 2026-11-19 by the run ORDER, not by warm-up. Three arms in one session: a 2 GB allocation and
    freed reproduced the plain render exactly (0.45050%), warming the fp16 engine moved it by 0.03 pp
    (0.41998%), and neither the tail conv nor the calibration grids were unstable in isolation (0.00000%
    across allocation and warm-up states). The logs then showed the certificate's `engine_ref` call builds
    the int8 body DURING the probe, i.e. before `int8Frames` exists, so the body calibrated on ONE frame and
    the 24 spread frames went nowhere - single-frame calibration, the case the record measures as 20x worse
    (0.116% against 0.006% composition; 0.566% against 0.050% on Violet). Fixed by refusing to build the body
    without calibration frames, plus a torch fallback in the probe's reference so a refusing upscaler cannot
    turn the fix into "int8 never starts". After the fix: certificate-ON vs OFF = 0.00318% with ZERO frames
    above the bar (was 0.45050% / 356), and certificate-OFF is bit-identical to before the fix. Verdict
    int8-body-built-before-calibration supersedes int8-picture-depends-on-warmup, which was wrong about the
    mechanism. Record: docs/wsp/verified/int8-calibration-ordering.txt. NOT done: re-taking the app-measured
    int8 content numbers, all of which were taken in the single-frame configuration
    (rve-int8-picture-remeasure-2026-11-19).
  note: >-
    Why P1 it was: it outranked the remaining speed rows because it decided whether any of their picture
    tests meant anything. The diagnostic hook to reproduce the certificate-on path in a forced run already exists:
    RVE_INT8_CERTIFY=1 (added with the finding, documented here because it is otherwise invisible).

