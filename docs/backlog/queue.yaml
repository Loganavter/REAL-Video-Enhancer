- id: rve-l2-pyramid-2026-11-15
  title: 'E29: L2-resident layer pyramid - is the 7.9 MB reuse buffer real, and what
    is the ceiling?'
  type: research
  status: done
  owner: null
  priority: P2
  gpu: false
  cost: 'weeks (phase 1: hours)'
  tags:
  - fusion
  - l2
  - pyramid
  - traffic
  base_branch: perf/inference
  relates_to:
  - docs/MODEL.md
  - docs/RESEARCH-LEDGER.md
  owns_files:
  - scripts/pyramid_budget.py
  refutes: The buffer arithmetic does not hold at 4K (reuse buffer per layer boundary
    or the 16-boundary sum exceeds what stays resident), or the traffic decomposition
    attributes less than ~20 ms to DRAM, leaving no 1.5x ceiling.
  acceptance: 'Phase 1 is CPU arithmetic only: per-boundary buffer bytes, total, L2
    residency argument, and the re-derived time decomposition (logical traffic 8.49
    GB, L2 absorption ~1/3, DRAM 19.7 ms, compute floor 33.1 ms, measured 56.8 ms).
    Phase 2, only if phase 1 survives: a boundary search per the Welder model and
    one fused prototype.'
  resolution: 'phase 1 answered 2026-11-17 (scripts/pyramid_budget.py, CPU only, no GPU job): the
    16-boundary reuse buffer is 7.5 MB at 1080p and 15.0 MB at 4K, both inside the card''s 32 MiB L2,
    so the residency half of the refutes does NOT fire. The ceiling half does: at both sizes the fp16
    compute floor (33.1 / 132.2 ms) is above the unabsorbed DRAM time (29.5 / 118.0 ms), so absorbing
    traffic cannot raise the roofline at all - at 1080p the reading is 56.8 ms measured against a
    33.1 ms floor, i.e. 1.72x whatever L2 does, and at 4K DRAM (118 ms) sits below the floor (132.2 ms)
    so the pyramid buys nothing there either. The 1/3 absorption every version of this item cited is
    one kernel''s ncu sector-hit rate applied to sixteen boundaries - a population substitution this
    ledger has withdrawn before, and it changes the ceiling by zero. Phase 2 is not justified ahead of
    the int8 lanes: a fused prototype would have to beat 56.8 -> 33.1 ms with a schedule the builder
    cannot emit. Records: docs/wsp/verified/pyramid-budget.txt'
  note: 'MICRO''16 (Alwani et al.) removed intermediate tensors from off-chip entirely
    on the first five VGG layers: 77 MB -> 3.6 MB with 362 KB on-chip, and their recompute-vs-reuse
    fork is our fork too (full fusion of 19 layers would cost +9.6x arithmetic by
    recompute, but 1.4 MB by reuse). Our version: (K-S)=2 rows x 1920 x 64 ch x 2
    B = 0.49 MB per boundary, 16 boundaries = 7.9 MB, which does not fit 100 KB shared
    memory but does fit 32 MB L2. This is the item that would give the ledger''s ''the
    model has that headroom; the builder cannot collect it'' a number. BLOCKER 2026-11-17:
    needs ncu counters (see rve-ncu-access) or a much more careful L2 experiment than
    the timing cache allows. RUNNABLE NOW 2026-11-17: ncu is unblocked on this host
    (RmProfilingAdminOnly=0), so the 7.9 MB reuse-buffer question and the L2 hit rate
    can be measured directly instead of inferred.'
- id: rve-channel-width-time-2026-11-15
  title: 'E30a: time of the body at C=64/48/32 - no picture question, no owner'
  type: experiment
  status: done
  owner: '@supervisor'
  resolution: 'measured 2026-11-15: C=48 gives 1.23x (56.68 -> 46.02 ms) and C=32
    gives the same 1.23x despite 3.94x fewer MACs, because myelin stops fusing the
    PReLU at that width and 16 separate passes (1.4-1.5 ms) put the gain back. MAC
    ratio 1.77x -> time 1.23x is the N-tile arithmetic (48 fills 75% of a 64-wide
    tile). Ledger E30a'
  priority: P0
  gpu: true
  cost: 30m
  tags:
  - channels
  - time
  - tactics
  - tile-alignment
  base_branch: perf/inference
  relates_to:
  - docs/RESEARCH-LEDGER.md
  - backend/src/pytorch/RawTRTEngine.py
  owns_files:
  - scripts/probe_channel_width.py
  refutes: 'The measured ratio does not follow the MAC ratio. E19 already showed FLOPs
    are not time on this engine (C=3 -> 8 raised FLOPs 0.48% and moved time 3.36 ms),
    and the shipped tactic is tilesize128x64x32, so C=48 fills 75% of an N tile of
    64 and K=432 is 14 steps of 32 against 18: the expectation is nearer 1.29x than
    1.78x. If 48 measures at 1.29x, the plan''s 2.06x frame estimate becomes ~1.5x.'
  acceptance: 'Engine time at three widths, same builder settings as the app (fp16,
    tiling full, optimization level 5), per-layer body times from trt.IProfiler, 20
    iterations. Output: measured time ratio against MAC ratio for each width.'
  note: 'Split from the pruning item on purpose: how much TIME a width costs is measurable
    on a synthesized model with random weights (tactics depend on shapes, not values),
    so it needs no reconstruction and no decision about the picture. The picture half
    only becomes interesting if this half shows a win. THREE-WAY CONFLICT 2026-11-17
    (the audit called this note stale; it is not that simple): (1) this resolution
    says C=32 gives 1.23x; (2) the ledger''s later section ''C=32 fuses and runs at
    22.4-24.9 ms'' says 2.07-2.36x with an 8 GiB workspace pool; (3) an independent
    rebuild on 2026-11-17 (make_width_probe -> build_plan, same pool, TRT 10.12) gets
    0 myelin, 50 reformat, 18 pointwise and 40.60-41.37 ms = 1.23x - i.e. it reproduces
    THIS note, not the ledger''s later row. Three positions, two of them measured,
    and the record does not carry the graph that fused at C=32. Until someone rebuilds
    that exact graph, quote the ceiling as 1.23x for a default build and 2.07-2.36x
    only for the fused one, and say which. CONFLICT RESOLVED 2026-11-17: it was not a graph,
    a builder call or a width - three rebuilds of ONE onnx gave 39.23 / 39.29 / 20.95 ms (myelin
    0/0/18), i.e. the build is bimodal. 1.23x is the slow draw; the fast one is 1.9-2.2x (44.98 ms at
    C=64 against 20.95-23.24 at C=32, all four measured in one session - dividing by the recorded
    56.68 ms would be a cross-session quotient), and the decision needs a deterministic builder
    (timing cache / selector / N builds), not a narrower layer.'
