# RVE research queue — blackboard for the perf/inference lane
# Status: todo | in_progress | in_review | done | dropped
#
# Why this file exists: docs/RESEARCH-LEDGER.md records MEASUREMENTS (it is a
# ledger, every row cites a number we produced). Intentions drift when they live
# in prose at the bottom of it, so plans and unmeasured literature claims live
# here instead, with the field that decides whether a task can run at all:
#
#   gpu: true   -> the task needs the single GPU. Exactly ONE gpu job runs at a
#                  time (rule learned the hard way, recorded in the ledger's
#                  provenance section); take the lock with
#                  `flock -n /var/tmp/opencode/gpu.lock <command>`.
#   gpu: false  -> CPU-only: literature verification, budget arithmetic, code
#                  that is written but not executed against CUDA.
#   gpu: partial-> writes code/tests that run on CPU; the actual timing is a
#                  separate supervisor run.
#
# Delegation map, lanes and the acceptance rules: docs/backlog/DELEGATION.md
