- id: rve-pack-async-ring-2026-11-20
  title: 'The deliverable pack is synchronous and on the critical path - 3.59 ms whose floor is 2.44'
  type: experiment
  status: done
  owner: '@supervisor'
  resolution: >-
    CLOSED NEGATIVE 2026-11-19, and the premise was half wrong: the pinned ring ALREADY EXISTS in the tree
    (utils.Frame.PinnedSlotPool, semaphore per slot, release after stdin.write()) and was disabled after an
    earlier attempt read 12.6 dB. RVE_PACK_RING=1 turns it on; the instrumentation confirms 4 slots x 12 441 600
    bytes, no per-frame tobytes. It buys nothing: loop 34.42 -> 34.36 ms (-0.06), pack+queue 4.36 -> 4.32
    (-0.04), both inside their own draw spread - so the 4.3 ms is NOT the copy, which is the row's own
    alternative hypothesis and its exit condition ("><1.0 ms means back-pressure"). The 12.6 dB bug IS gone:
    the 494-frame ffv1 pair reads IDENTITY, so the protocol now holds and still buys nothing - worth recording
    so nobody re-derives the disabled-comment. Not adopted (0.06 ms does not pay for a second payload path
    that is incompatible with temporal reuse); the knob and its one-line warning stay. The 4.32 splits into a
    12.44 MB transfer at 2.9 GB/s effective plus the writer's slot consumption, and this file does NOT
    separate them. THE NVENC ARM WAS RUN (2026-11-19, the configuration the row named as the only one where a
    slow writer could flip this): loop 34.54 -> 34.61 ms (+0.07) and pack+queue 4.31 -> 4.40 (+0.09), i.e. the
    sign is if anything NEGATIVE and at the edge of the draw spread - the semaphore and slot bookkeeping cost a
    hair more than the copy they replace. It does not flip, and the reason is visible in the two sinks agreeing
    on the pack line (4.36 null against 4.31 nvenc): the payload is copied into ffmpeg's own buffer before the
    encoder sees it, so a deeper ring has nothing to buy either way. Docs:
    docs/wsp/verified/int8-pack-ring.txt, records int8-pack-ring.jsonl (K001-K005, R001-R002, K101-K105,
    R101-R102, PK001-PK004), logs/pack-ring/{ab,ab-nvenc}/.
  priority: P1
  gpu: true
  cost: 4h
  tags:
  - pipe
  - pack
  - bandwidth
  base_branch: perf/inference
  relates_to:
  - backend/src/utils/Frame.py
  - backend/src/pytorch/RenderVideo.py
  - docs/wsp/verified/int8-frame-accounting.txt
  - docs/PERFORMANCE.md
  owns_files:
  - docs/wsp/verified/pack-async-ring.txt
  refutes: >-
    The 3.59 ms pack+queue is what moving a 12.44 MB frame off the card costs. It is not: the payload at the
    measured 1.5 bytes/px is 12.44 MB at 4K, the recorded PCIe 3.0 x8 link moves it at 5.1-6.0 GB/s, so the
    copy's own floor is 2.07-2.44 ms - the stage is already 1.2-1.5 ms above its floor, and it runs
    synchronously inside the frame window. A pinned ring filled by cudaMemcpyAsync on a copy stream, with
    release guarded by a CUDA event and the wait deferred into the writer, should take most of that off the
    critical path. If the loop line does not move by at least 1.0 ms, the 3.59 is the writer's back-pressure
    and the row closes with that.
  acceptance: >-
    Null-sink A/B first, because that is where the line is visible: arms RVE_PACK_RING=0/1, interleaved, >=3
    rounds, one session, reporting the pack+queue line beside the render loop. Then the byte-identity check -
    the payload is a copy, so the render must be BI-IDENTICAL, and that is checked, not assumed. Then one
    NVENC arm: a ring that overlaps the copy is only worth anything if the encoder is not already the wall at
    that point. Report the two halves separately - the traffic removed and the overlap added.
  note: >-
    From the researcher's C4, the only candidate in that file that was never filed. It matters more now than
    when it was written: at 39.18 ms the frame's non-body share is ~10 ms, and pack+queue is the largest
    single line in it. PERFORMANCE.md records a pooled-pinned attempt that read 12.6 dB and was "disabled" -
    that was a BUG (a slot released before its last byte had been copied) and the same file says so; it is not
    a refutation, and quoting it as one would be wrong.

