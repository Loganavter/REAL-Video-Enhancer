  owns_files:
  - scripts/int8_accuracy_sim.py
  - scripts/int8_heldout.py
  refutes: >-
    Per-tensor activation scales cannot represent BD material: the int8 body measured 0.53318% of
    pixels above 8 levels on the worst frame of a 494-frame BD clip with reuse OFF (356 frames above
    the 0.1% bar, peak 65), and 0.71096% with the channel-max gate (432 frames, peak 139) - against
    0.08876% and zero frames on the 4 Mbps re-encode of the same title. If per-channel activation
    scales (or a wider grid) do not take the worst frame under 0.1%, the body is not shippable on real
    material and the int8 lane closes here.
  acceptance: >-
    The same 494-frame BD clip, reuse off, worst-frame share under 0.1% with a stated A/A, plus the
    chain's time unchanged within drift. The discriminating pair is per-tensor against per-channel
    activation scales on the same frames - not another calibration recipe, because the calibration was
    already split per title (int8-split-calibration).
  resolution: >-
    closed 2026-11-19, premise withdrawn. The 0.53%/0.42% figure was the body against the fp16 ENGINE on
    delivered files; against the model's own output the body reads 0.0044-0.0192% over seven frames (verdict
    int8-body-vs-model), and the per-channel vs per-tensor question it was filed for is now moot because the
    body already passes the bar by 5-25x. Every scale lever the row listed was measured and was worthless:
    per-channel (+0.015% of picture), percentile clip (6-16x worse), grid margin (x1.25 doubled the error,
    x1.5 tripped the body's own self-certification), bias correction (0.00563% -> 0.00515%, i.e. real but
    irrelevant at this margin). See docs/wsp/verified/int8-scales-bd.txt.
  measured: >-
    2026-11-18, scales isolated in the simulation (scripts/int8_accuracy_sim.py --act-scale / --clip-pct,
    calibration and test frames disjoint): PER-CHANNEL conv-input scales take the worst frame from
    0.06510% to 0.00162% on frame 29, 0.02461% -> 0.00187% on f44 and 0.01362% -> 0.00118% on f274, and
    collapse peak 19 -> 13 and median 2.99 -> 0.75 levels. PERCENTILE CLIPPING IS NOT A LEVER: p99.9 makes
    the same frames 6-16x WORSE (0.375%, 0.386%, 0.308%), because the activation tail is signal, not
    clipping noise. So the lever is granularity, and it is one multiply plus 64 scales in the epilogue
    (the epilogue already applies a per-channel output scale).
    THE GAP THAT MUST BE CLOSED FIRST: the kernel reads 0.53318% on that same frame - 8x above the sim's
    own per-tensor baseline (0.06510%). The sim models the PReLU output per-channel while the kernel's
    hop boundary requantises per-tensor, so the first hypothesis is that the 8x and the 40x are the same
    knob. Until the kernel is measured with per-channel boundary scales, the number to quote for the
    product is 0.53%, not 0.0016%. Records: docs/wsp/verified/int8-scales-bd.txt.
  note: >-
    The recorded 0.09169% pass (int8-window) and the 0.08876% product sweep (int8-and-violet-sweeps)
    were both measured on the 4 Mbps re-encode. Its smoothing is what hid the error: flat, low-detail
