- id: rve-megakernel-body-2026-11-19
  title: 'DROPPED: fusing the 16 hops (megakernel / fused-layer) has no ceiling left - the boundary is already hidden'
  type: research
  status: dropped
  owner: '@supervisor'
  priority: P2
  gpu: false
  cost: 1h
  resolution: >-
    dropped 2026-11-19 by arithmetic on our own records, before any code. The idea: papers 2025-2026 (Hazy
    Research megakernel; MPK, arXiv:2512.22219, 1.7x end-to-end on LLM serving; Alwani et al. MICRO 2016
    fused-layer CNN accelerators) all say "keep the intermediates on chip and delete the kernel
    boundaries". Our boundary traffic is real in bytes - one hop's activation is 133 MB at 1080p int8, so
    a write+read pair is 0.92 ms at the card's 288 GB/s and 13.8 ms over 15 boundaries - but it is ALREADY
    OVERLAPPED: measured hops are 26.95 ms / 16 = 1.68 ms per hop, which at 152.9 GFLOP per hop is 91 TOPS,
    i.e. at or ABOVE the 84 TOPS the isolated hop recorded (1.82 ms). There is no boundary overhead to
    reclaim, so fusion can only add cost: a 16-layer halo chain inflates compute x4.0 at a 32x32 tile,
    x1.56 at 128x128, x1.27 at 256x256 - and the intermediate that must stay on chip is 133 MB, three
    orders above the 128 KB a single SM can hold. Partial fusion (2-4 layers, x1.06-1.13 halo) buys a
    saving bounded by the same ~0, because there is no measured overhead to remove.
  tags:
  - int8
  - fusion
  - megakernel
  - dropped
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-wall-ab.txt
  - docs/wsp/verified/int8-window.txt
  note: >-
    What WOULD still move the hops: MMA utilisation, not the boundaries. 91 TOPS is ~52% of the card's
    dense int8 peak, so the headroom is in the Triton kernel's tiling/swizzle/K-padding, i.e. CUTLASS and
    Triton tuning guidance, not in fused-layer research. And the measured ranking of the frame's remaining
    cost puts the tail (8.8 ms of 4K passes) and the 6.2 ms of unnamed plumbing ahead of it.

- id: rve-calibration-on-crops-2026-11-19
  title: 'DONE: crops calibrate 15.7x cheaper and the picture did not get worse'
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 2h
  tags:
  - int8
  - calibration
  - probe
  - cost
  base_branch: perf/inference
  relates_to:
  - backend/src/utils/Int8Probe.py
  - backend/src/pytorch/Int8Body.py
  - docs/wsp/verified/int8-probe-cost-2026-11-19.txt
  owns_files:
  - docs/wsp/verified/int8-calibration-crops.txt
  refutes: >-
    The calibration needs full 1080p frames. It runs 24 of them through the fp16 model with a hook on
    every conv and PReLU, which is 21.1 s of the 29.3 s the probe now costs, and 49.8 megapixels of
    material to measure 64 per-channel ranges (2.1 Mpx per channel). Post-training quantisation in the
    field calibrates on a SMALL unlabelled set - a few forward passes over crops, not full frames - so if
    24 crops of 256x256 (1.6 Mpx, 32x less work, ~0.7 s) hold the same ranges, the probe's cost drops from
    29.3 s towards 2-3 s and int8's break-even falls from 2.9-3.5 min of video to well under a minute. If
    the crops do not hold, the ranges are genuinely scene-statistics and the row closes with the measured
    reason.
  acceptance: >-
    The same body, calibrated two ways on the same clip - 24 spread full frames (today) and 24 crops
    (256x256, spread over the same frames) - then scored on the SAME held-out full frames against the
    model's own fp16 output: share >8 levels and peak, worst frame, with a stated A/A per arm. Criterion:
    the crop-calibrated body is within the session's drift of the full-frame one on both clips. Report the
    calibration wall clock per arm (fresh process each), because the whole point is the cost, and keep the
    per-channel range table so a reader can see WHERE the two disagree, if they do.
  resolution: >-
    measured 2026-11-18, BD Violet, 1080p, four held-out frames (29/44/274/400) in neither arm.
    Full-frame arm: 24 frames, 49.8 Mpx, calibrate 7.09 s, worst share 0.02256%, peak 26. Crop arm: 96 crops
    of 256x256 (4 per frame, fixed offsets), 6.3 Mpx, calibrate 0.45 s, worst share 0.01881%, peak 19. So
    the maximum over 32x fewer samples did NOT under-cover: the crop-calibrated body is 1.2x better on the
    worst held-out frame with a lower peak, both far under the 0.1% share bar. Calibration cost drops 15.7x;
    in the probe (which runs its own hooked forwards) the same ratio applies to its 21.1 s, so what is left
    of the probe's cost is the 2.9 s decode and int8's break-even on BD falls to roughly that alone.
    NOT adopted yet: n=1 per arm (not an A/A), one clip, four frames, and the peak moved in the direction
    that should be harder to explain (26 -> 19); a repeat is needed before the peak is quoted, and the
    percentile-ceiling fallback was not needed and is not implemented. Record:
    docs/wsp/verified/int8-calibration-crops.txt (harness check PASS).
  note: >-
    Why it was filed: the probe was just cut down to calibration only (33.4 s of certificate removed),
    and what is left is 21.1 s of calibration on full frames. External practice, read 2026-11-19:
    "a few forward passes on a small calibration set" is the standard PTQ recipe (arXiv:2610.28537,
    arXiv:2610.03218), the calibration-set size question has its own paper (Hubara et al., ICML 2021,
    "Accurate Post Training Quantization With Small Calibration Sets"), and Nagel et al. (ICCV 2019,
    Data-Free Quantization) even estimates activation ranges analytically. NOT the same question as
    int8-split-calibration, which is about WHICH TITLES (per-title calibration mis-states composition 20x):
    that warning is about the scene, this row is about the crop. Do not use its conclusion to refuse crops.

