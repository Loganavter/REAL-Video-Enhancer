- id: rve-int8-prelu-plugin-2026-11-15
  title: 'E27: int8 conv + per-channel PReLU as ONE plugin (the 1.3x that E9'' left
    on the table)'
  type: code
  status: done
  owner: null
  priority: P1
  gpu: partial
  cost: 1d
  tags:
  - int8
  - plugin
  - prelu
  - tensorrt
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/RawTRTEngine.py
  - docs/RESEARCH-LEDGER.md
  owns_files:
  - backend/src/pytorch/int8_plugin/
  - backend/tests/test_int8_plugin.py
  resolution: 'closed 2026-11-17: the plugin exists and is measured IN the chain. `body_kernel` in
    scripts/int8_pipeline.py is the fused int8 conv + per-channel PReLU + per-channel requant, and with
    its per-layer tensors hoisted out of the frame loop it runs at 1.82 ms/hop (84 TOPS) at BLOCK_M 256
    - against 3.14 ms/hop for the two-pass prologue form on the same frames. End to end the window is
    37.46-37.73 ms = 26.5-26.7 fps against a same-process fp16 TRT plan at 53.25-53.56 ms = 18.7 fps,
    i.e. 1.41-1.42x (bar_int8_window is 1.4x). Two layout fixes were worth more than the plugin itself:
    the head quantise as a coalesced channels_last copy (16.19 -> 1.96 ms) and the tail dequant the
    same way (11.4 -> 7.9 ms). The picture is NOT certified: worst of 4 frames 0.728% against 0.1%
    (held out), and the prologue form reads 0.741% on the same frames, so the fast kernel is
    quality-neutral - the grids/calibration recipe is what fails. Records:
    docs/wsp/verified/int8-window.txt; verdicts int8-window-measured, int8-body-hop.'
  refutes: A plugin that fuses conv+per-channel PReLU in int8 does not reproduce the
    ~2.14 ms block that the traffic arithmetic predicts (2.93 ms fp16 measured), or
    the per-tensor activation scales lose more than the acceptance bar allows once
    the PReLU output has its own dynamic range.
  acceptance: Isolated block timing {fp16 fused, int8 conv + fp16 PReLU pass, int8
    conv + int8 PReLU plugin} on the real shape, interleaved 3 rounds; picture checked
    against the ungated render with the usual statistic (share of pixels >8 levels,
    worst frame < 0.1%).
  measured: 'The ceiling is measured, not estimated: with a scalar activation fused
    (so the epilogue is free) the engine builds at 40.24 ms, 1.40x. The block is 1.95
    ms including its epilogue, i.e. 31.2 ms for the body alone, against a 26.9 ms
    compute floor at the 91 TFLOP/s the int8 conv reports. So a perfect plugin lands
    at 1.40x and the rest of the distance to 28.1 ms is GEMM efficiency, not epilogue.'
  blocked_on: 'an int8 GEMM we control: the TRT python wheel ships no NvInfer.h (re-verified
    2026-11-17 on the interpreter this repo uses: 0 NvInfer*.h under ~/.cache/opencode/venvs/trt310,
    and no CUTLASS tree anywhere on the host - so a plugin means a hand-written CUDA kernel), and
    cuDNN''s fused activation takes a scalar slope, which the measured slopes (-1.39..1.70)
    rule out. Hand-written/CUTLASS conv = E10''s cost class.'
  note: 'E9'' closed the TRT path because the PReLU epilogue is a separate 1.8 ms
    pass between int8 convs. The traffic argument says the boundary is the cost, not
    the arithmetic: PReLU as its own pass moves 530.8 MB fp16 (floor 1.84 ms, measured
    1.80) against 266 MB int8 (0.92 ms), and conv writing int8 saves 132 MB (-0.46
    ms), so the block lands near 2.14 ms instead of 2.93. Sixteen blocks => ~43.7
    ms against 56.28 (1.29x). The named risk is per-channel slope against per-tensor
    activation scales: either add per-channel output scales or measure the loss. BLOCKER
    2026-11-17: effort, not environment: a CUDA/CUTLASS kernel with an int8 GEMM and
    a per-channel epilogue is weeks. The E9'' reproduction (2026-11-17) confirms the
    mechanism it would remove, so the item is real and correctly sized.'
- id: rve-int8-prelu-pass-2026-11-15
  title: 'E32: the PReLU pass is at its traffic floor - is there anything above it
    but the plugin?'
  type: experiment
  status: done
  owner: null
  priority: P2
  gpu: true
  cost: 1h
  tags:
  - int8
  - prelu
  - traffic
  - graph
  base_branch: perf/inference
  relates_to:
  - docs/RESEARCH-LEDGER.md
  - backend/src/pytorch/RawTRTEngine.py
  owns_files:
  - scripts/probe_int8_graph.py
  refutes: 'It did, when the item was written as ''remove the reformats and land at
    42 ms''. E9'' splits the overhead precisely: 21 reformats are 5.6 ms (8%) and
    17 PReLU passes are 32.7 ms (46%), so removing every reformat lands at 62.5 ms
    - still behind the 56.28 that ships. The 42.7 ms arithmetic assumed an int8 PReLU
    pass at 0.92 ms, and the build that tried it measured 78.36 ms because TRT charges
    the hop per layer.'
  acceptance: 'Only if a cheaper variant exists at all: layer histogram and ms/frame
    for a build where the PReLU pass reads and writes int8 with per-channel scales,
    without the extra DQout hop. Target < 2.0 ms per block, i.e. under 40 ms total.
    If it cannot beat the floor, the row closes and E27 is the only route.'
  note: 'Kept as a row rather than deleted so the arithmetic is not re-derived: the
    pass moves 530.8 MB and its floor at 288 GB/s is 1.84 ms against 1.71-2.37 measured,
    i.e. it is already doing what the memory system allows. Disappearing into the
    convolution is the plugin, not a graph fix. RUNNABLE NOW 2026-11-17: TensorRT
    10.12.0.36 and torch are installed and the harness can time and profile a plan
    end to end (scripts/build_plan.py, scripts/bench_plan.py, scripts/make_width_probe.py).
    No environment blocker.'
  resolution: 'answered 2026-11-17: the PReLU pass is at its traffic floor (530.8
    MB at 288 GB/s = 1.84 ms against 1.71-2.37 measured), and the later lane removed
    it by moving the requant from the prologue to the epilogue: 2.518 -> 1.753 ms/hop,
    40.3 -> 28.0 ms for 16 hops (REPORT-int8-lane-2026-11-16.md 4c6). CAVEAT, measured
    here: that epilogue variant is NOT in this branch - int8_pipeline.py still runs
    the prologue form at 3.42 ms/hop (54.75 ms), so the answer exists but the improvement
    is not in the tree.'
- id: rve-int8-gemm-efficiency-2026-11-15
  title: 'E33: int8 body GEMM efficiency - the 1.4x to 2x gap lives here'
  type: experiment
  status: dropped
  owner: null
  priority: P1
  gpu: true
  cost: 1-2d
  tags:
  - int8
  - tactics
  - tiling
  - gemm
  base_branch: perf/inference
  relates_to:
  - docs/RESEARCH-LEDGER.md
  owns_files:
  - scripts/probe_int8_tactics.py
  resolution: 'closed 2026-11-17 as a question about a path that stopped being the candidate: the
    sweep would raise the TRT int8 plan, and the plan is not what ships. Measured on both sides: the
    TRT plan runs at a median 79.2 TOPS (trt-int8-rate-79), our Triton chain at 84 TOPS in the chain
    (1.82 ms/hop, int8-body-hop), so the kernel the objective is built on is already the faster of the
    two. The remaining 43% below the card''s 147.4 TOPS is not traffic either: 132 MB read + 132 MB
    write per hop at the measured 288 GB/s is 0.92 ms against the 1.82 measured, so the next step if
    anyone wants it is ncu counters on body_kernel, not a TRT tiling sweep. Records:
    docs/wsp/verified/int8-tactics.txt and int8-window.txt.'
  refutes: No tiling or tactic choice raises the int8 body above ~120 TOPS (it reports
    91 today, and the card's measured int8 peak is 147.4 TOPS with B in the K-major
    layout, 39.3 in the transposed one). Below 120 TOPS the frame cannot reach 28
    ms whatever the epilogue does, and the honest ceiling is ~1.6x.
  acceptance: Per-conv TFLOP/s for the int8 plan across tiling levels and tactic sources,
    interleaved 3 rounds, plus the tactic names chosen. Any configuration that beats
    the shipped 91 TFLOP/s by more than drift is a candidate.
  note: 'New item, from the ceiling arithmetic: the body at int8 is 31.2 ms measured
    against a 26.9 ms floor at 91 TFLOP/s, and the int8 peak is roughly 148 if the
    borrowed 74 TFLOP/s fp16 figure holds. Closing that 55-60% -> 75% gap is the only
    path from 40 ms to 28 ms; fusion does not help because this GEMM is compute-bound
    (int8 is 1.7x the fp16 conv while moving the same bytes). RUNNABLE NOW 2026-11-17:
    TensorRT 10.12.0.36 and torch are installed and the harness can time and profile
    a plan end to end (scripts/build_plan.py, scripts/bench_plan.py, scripts/make_width_probe.py).
    No environment blocker. STARTING POINT 2026-11-17 (scripts/probe_int8_tactics.py on the 2026-11-16
    plan): 67.67 ms/frame, 84 layers, 1 myelin, 22 reformat, 19 pointwise - and the per-conv rate is a
    median 79.2 TOPS (min 76.2, max 119.7 over 18 conv layers), NOT the 91 this item and E27 assume. At
    79 the 16-conv floor is 30.9 ms, so the gap to close is a 1.5x on the GEMM. COST REVISED: each
    configuration now needs >=3 builds to be comparable (the C=32 build is bimodal, ledger B3), so the
    sweep is more than the 1-2 d this row estimated. OUR KERNEL 2026-11-17: the chain''s hop is
    1.82 ms = 84 TOPS at BLOCK_M 256/warps 4 (2.38 at 128/4, 4.06 at 64/4, and 79 ms/hop at 512/4 -
    register pressure), i.e. ABOVE the TRT plan''s 79.2. So the remaining question is not "can the GEMM
    go faster than TRT" but "how much of the 147.4 TOPS peak is reachable at all": the chain sits at
    57%, and the next 43% is the memory floor of 132 MB read + 132 MB write per hop.'
