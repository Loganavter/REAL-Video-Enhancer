    default | difference x8 | >8 mask), which also shows why gain panels mislead: at x8 a 1-2 level rounding
    difference hazes the whole crop. So no threshold had to be invented, no "out of spec on the peak axis"
    label is needed, and the 29-55 range stays a true statement about configurations that are not shipped.
    docs/wsp/verified/peak-look.txt, records peak-look.jsonl (P001-P004), logs/peak-look/. NOT covered: the
    pre-encode tensor rather than the delivered stream (the colour pipe moves 0.21% on its own - that is why
    render pairs are the acceptance instrument), one clip, one model, one card.
