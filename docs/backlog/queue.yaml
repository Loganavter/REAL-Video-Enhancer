    type: experiment
    status: done
    owner: "@supervisor"
    resolution: "measured 2026-11-15: C=48 gives 1.23x (56.68 -> 46.02 ms) and C=32 gives the same 1.23x despite 3.94x fewer MACs, because myelin stops fusing the PReLU at that width and 16 separate passes (1.4-1.5 ms) put the gain back. MAC ratio 1.77x -> time 1.23x is the N-tile arithmetic (48 fills 75% of a 64-wide tile). Ledger E30a"
    priority: P0
    gpu: true
    cost: "30m"
    tags: [channels, time, tactics, tile-alignment]
    base_branch: perf/inference
    relates_to: [docs/RESEARCH-LEDGER.md, backend/src/pytorch/RawTRTEngine.py]
    owns_files: [scripts/probe_channel_width.py]
    refutes: "The measured ratio does not follow the MAC ratio. E19 already showed FLOPs are not time on this engine (C=3 -> 8 raised FLOPs 0.48% and moved time 3.36 ms), and the shipped tactic is tilesize128x64x32, so C=48 fills 75% of an N tile of 64 and K=432 is 14 steps of 32 against 18: the expectation is nearer 1.29x than 1.78x. If 48 measures at 1.29x, the plan's 2.06x frame estimate becomes ~1.5x."
    acceptance: "Engine time at three widths, same builder settings as the app (fp16, tiling full, optimization level 5), per-layer body times from trt.IProfiler, 20 iterations. Output: measured time ratio against MAC ratio for each width."
    note: "Split from the pruning item on purpose: how much TIME a width costs is measurable on a synthesized model with random weights (tactics depend on shapes, not values), so it needs no reconstruction and no decision about the picture. The picture half only becomes interesting if this half shows a win."
