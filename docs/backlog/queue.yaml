    note: "Stronger than E31's synthesis: the grain is not generated, it is lifted from the source and put back, so nothing about the grain is invented. The gate then certifies on the base, where the floor should drop to ~0.8, and film could move from 1.85x toward 3.5-4x - more than everything left in the engine. What changes is how grain is upscaled, which is a metric question for the owner, not an impossibility."
