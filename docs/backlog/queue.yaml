    tags: [winograd, cudnn, tactics, engine]
    base_branch: perf/inference
    relates_to: [backend/src/pytorch/RawTRTEngine.py, backend/src/pytorch/TensorRTHandler.py, docs/MODEL.md]
    owns_files: [scripts/probe_winograd.py]
    refutes: "Forcing CUDNN_CONVOLUTION_FWD_ALGO_WINOGRAD (or the WINOGRAD_NONFUSED variant) on one 3x3 64->64 conv at 1920x1080 fp16 NHWC is not faster than the implicit-GEMM default, or the algorithm is unavailable for the shape (constructor returns BAD_PARAM / no tactic). Either outcome closes E16 with a measurement."
    acceptance: "A table: {default, forced Winograd, forced implicit GEMM, fp32 NCHW control} x ms per conv, 3 interleaved rounds, plus the algorithm actually returned by cudnnGetConvolutionForwardAlgorithm_v7 for the shape. Written into the ledger as E26."
    note: "Cheapest untested item. Literature says TensorRT beats fusion compilers on VGG-shaped stacks BECAUSE of Winograd (Welder OSDI'23 reports UNet 9.251 vs 4.429, VGG16 4.123 vs 2.584 ms, blaming its own lack of Winograd), while our tactic dump shows all 16 body convolutions on implicit_gemm. Second question, only if the first is positive: does TRT's tactic set for this shape contain any Winograd kernel at all, and did the timing cache exclude it or never see it?"
  - id: rve-int8-prelu-plugin-2026-11-15
    title: "E27: int8 conv + per-channel PReLU as ONE plugin (the 1.3x that E9' left on the table)"
    type: code
    status: todo
    owner: null
    priority: P1
    gpu: partial
    cost: "1d"
    tags: [int8, plugin, prelu, tensorrt]
    base_branch: perf/inference
    relates_to: [backend/src/pytorch/RawTRTEngine.py, docs/RESEARCH-LEDGER.md]
    owns_files: [backend/src/pytorch/int8_plugin/, backend/tests/test_int8_plugin.py]
    refutes: "A plugin that fuses conv+per-channel PReLU in int8 does not reproduce the ~2.14 ms block that the traffic arithmetic predicts (2.93 ms fp16 measured), or the per-tensor activation scales lose more than the acceptance bar allows once the PReLU output has its own dynamic range."
    acceptance: "Isolated block timing {fp16 fused, int8 conv + fp16 PReLU pass, int8 conv + int8 PReLU plugin} on the real shape, interleaved 3 rounds; picture checked against the ungated render with the usual statistic (share of pixels >8 levels, worst frame < 0.1%)."
    measured: "The ceiling is measured, not estimated: with a scalar activation fused (so the epilogue is free) the engine builds at 40.24 ms, 1.40x. The block is 1.95 ms including its epilogue, i.e. 31.2 ms for the body alone, against a 26.9 ms compute floor at the 91 TFLOP/s the int8 conv reports. So a perfect plugin lands at 1.40x and the rest of the distance to 28.1 ms is GEMM efficiency, not epilogue."
    blocked_on: "an int8 GEMM we control: the TRT python wheel ships no NvInfer.h, and cuDNN's fused activation takes a scalar slope, which the measured slopes (-1.39..1.70) rule out. Hand-written/CUTLASS conv = E10's cost class."
    note: "E9' closed the TRT path because the PReLU epilogue is a separate 1.8 ms pass between int8 convs. The traffic argument says the boundary is the cost, not the arithmetic: PReLU as its own pass moves 530.8 MB fp16 (floor 1.84 ms, measured 1.80) against 266 MB int8 (0.92 ms), and conv writing int8 saves 132 MB (-0.46 ms), so the block lands near 2.14 ms instead of 2.93. Sixteen blocks => ~43.7 ms against 56.28 (1.29x). The named risk is per-channel slope against per-tensor activation scales: either add per-channel output scales or measure the loss."
  - id: rve-int8-prelu-pass-2026-11-15
    title: "E32: the PReLU pass is at its traffic floor - is there anything above it but the plugin?"
    type: experiment
    status: todo
    owner: null
    priority: P2
    gpu: true
    cost: "1h"
    tags: [int8, prelu, traffic, graph]
    base_branch: perf/inference
    relates_to: [docs/RESEARCH-LEDGER.md, backend/src/pytorch/RawTRTEngine.py]
    owns_files: [scripts/probe_int8_graph.py]
    refutes: "It did, when the item was written as 'remove the reformats and land at 42 ms'. E9' splits the overhead precisely: 21 reformats are 5.6 ms (8%) and 17 PReLU passes are 32.7 ms (46%), so removing every reformat lands at 62.5 ms - still behind the 56.28 that ships. The 42.7 ms arithmetic assumed an int8 PReLU pass at 0.92 ms, and the build that tried it measured 78.36 ms because TRT charges the hop per layer."
    acceptance: "Only if a cheaper variant exists at all: layer histogram and ms/frame for a build where the PReLU pass reads and writes int8 with per-channel scales, without the extra DQout hop. Target < 2.0 ms per block, i.e. under 40 ms total. If it cannot beat the floor, the row closes and E27 is the only route."
    note: "Kept as a row rather than deleted so the arithmetic is not re-derived: the pass moves 530.8 MB and its floor at 288 GB/s is 1.84 ms against 1.71-2.37 measured, i.e. it is already doing what the memory system allows. Disappearing into the convolution is the plugin, not a graph fix."
