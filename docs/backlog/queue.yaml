  owner: '@owner'
  resolution: >-
    RESOLVED BY MEASUREMENT 2026-11-20, then a one-line decision: bar_int8_peak STAYS at 20 and the shipped
    default MEETS it. The premise of the pending note was wrong about what ships - the 29-55 range is the int8
    kernel FAMILY as measured 2026-11-17 (the epilogue and three-accumulator variants), not the adopted
    configuration. Measured on the shipped default (fused head + int8 tail) against the model on seven spread
    frames: peak 13.1-16.9 levels, share 0.0031-0.0146%, and ZERO pixels above 20 in 7 x 8.3 M. The errors are
    slivers on ink contours - the largest connected run of >8-level pixels is 19 px, the typical frame's 4-12,
