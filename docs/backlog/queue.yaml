  acceptance: >-
    The same one-frame, no-pipe comparison (model vs int8 body vs fp16 engine) plus an interleaved wall A/B, run
    on at least a second GPU generation (or a second model family), and a decision on whether Fast should be the
    default anywhere. Until then the tooltip states what was measured and on what.
  note: >-
    Everything this lane measured was measured on an RTX 4060 Ti, one 2x SRVGG-style anime model, one title.
    SUPERSEDED on the speed half by rve-int8-wall-ab-2026-11-19: both titles read 1.088-1.141x interleaved, so
    "about even on a second title" is withdrawn. The picture claim below and the per-card question stand, and
    the tooltip never quoted a speed-up anyway - it says "the speed-up depends on the card". CHECKED
    AGAINST THE RECORD 2026-11-19: the corpus holds no second-GPU or second-model-family timing at all (the
    only other-card numbers are external issue reports in docs/MODEL.md, and they are about TRT int8/FP8,
    not about this body) - so this row cannot be closed from anything already measured. External support
    for the premise (arXiv:2606.14598, read 2026-11-19): a fused INT8 GEMM that wins 2.8-4.2x per GEMM on
    consumer Ampere LOSES to the native bf16/FP8 paths on A100 and B200 - i.e. "int8 is faster" is a
