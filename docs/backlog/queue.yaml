  - scripts/tail_conv_probe.py
  owns_files:
  - docs/wsp/verified/int8-tail-layout.txt
  refutes: >-
    Handing the tail conv a channels_last view instead of a contiguous NCHW tensor is a free win. The
    isolated probe says it is 2.5x on the conv (5.296 -> 2.098 ms, and C_out 12 -> 16 changes nothing, so the
    tensor-core tile fill is NOT the lever); in the app the tail went 7.77 -> 5.58 ms with the conv at 2.28.
    But the two renders differ by 0.87% of pixels (443 of 494 frames above the 0.1% bar, peak 62), and a
    tensor-level comparison of the two conv paths against an fp32 reference reads 0.00000% share, 0.0 peak,
    mean difference 0.00000 - i.e. the LAYER is numerically identical, so the render difference comes from
    somewhere else and has not been found. Until it is, the change is not adoptable and its 2.2 ms stay
    unspent.
  acceptance: >-
    A/A of the current code (two renders, decoded-frame identity) and then one render with the layout patch
    applied and one without, all three in ONE session, compared with gate_sweep and an explicit
    --reference-kind config. If the A/A is not identical, the pipeline itself is not deterministic and that
    is the finding; if it is, the patch's effect is isolated and named. The patch is parked at
    /home/jorj/2Tb/tail-layout-nhwc-2026-11-18.patch (uncommitted, deliberately).
  resolution: >-
    done 2026-11-19, adopted with `RVE_TAIL_NHWC` (default ON, `0` restores the old path). Three results, in
    the order they mattered: (1) the variant A/B interleaved inside one session shows the conv at 4.80-4.87 ->
    2.29-2.43 ms on both clips, tail 7.74-7.82 -> 5.66-5.90, body median on Chainsaw 40.3 -> 37.65 - with the
    shuffle paying 0.4 ms for the channels_last output; (2) the picture is BIT-IDENTICAL, 494/494 frames,
    worst share 0.00000%, peak 0, measured on two lossless ffv1 renders after the calibration-ordering fix
    (the pre-fix identity was not inherited: the fix changed which frames the body calibrates on); (3) the
    lane ratio re-taken once, both arms in one session: Chainsaw 56.22 -> 45.70 = 1.230x, Violet 58.54 ->
    47.96 = 1.221x, i.e. BOTH medians clear bar_int8_wall = 1.2x, which the lane did not before
    (1.088-1.141x). Caveats recorded in the file: one round of one clip is below the bar (Violet r3 1.178),
    so it is "1.22-1.23x by the bar's own statistic", not "above 1.2 in every round"; and the earlier 0.87%
    scare is fully explained - it was the calibration ordering bug, not this change
    (int8-calibration-ordering.txt). Records: docs/wsp/verified/int8-tail-layout.txt, harness check PASS.
    NOT done, deliberately: the conv now returns channels_last, so the shuffle reads 0.78-1.05 against 0.39;
    a conv that returns NCHW would trade ~0.4 ms back for a 50 MB copy and is not measured.
  note: >-
    Why it was not simply adopted at first: 2.2 ms is 4% of the frame, but the 0.87% picture difference at the
    time was 8.7x the bar and its mechanism was unknown - it turned out to be the calibration ordering bug. The tensor test rules out the conv's
