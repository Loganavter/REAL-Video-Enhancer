  - docs/wsp/verified/int8-tail-csc.txt
  owns_files:
  - docs/wsp/verified/int8-ink-lift.txt
  refutes: >-
    The pale line in the rendered file is the quantiser. It is not: the body in RGB is faithful on the stroke to
    half a level (-0.5), with or without the bias correction, while the RENDERED FILE against the model reads
    +4.40/+6.60. So whatever lifts the ink happens between the body's output and the decoded file - the yuv420p
    colour pipe, the pack, or the probe's calibration - and that was left open.
  acceptance: >-
    (a) Localise the lift on ONE frame: body output in RGB, the same tensor after the pack to yuv420p and back,
    and the decoded file, each against the model. (b) The same three points with the tail-CSC payload (RVE_TAIL_YUV
    1) and the RGB tail (0), because the colour pipe changed after that page was written. (c) Verdict: which stage
    adds the ~5 levels, and whether the BT.709 limited-range conversion is the whole of it.
  note: >-
    Found by the 2026-11-20 audit. A visible picture effect (line art brightness) that was traced away from the
    quantiser and then not chased; the colour pipe has changed twice since.

- id: rve-beacon-scale-2026-11-20
  title: "Beacon's closed-form scale against the swept grid clamp K"
  type: experiment
  status: done
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 1d
  tags:
  - int8
  - quantisation
  - prior-art
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/wsp/PRIOR-ART-STARTUP-2026-11-20.md
  - docs/wsp/verified/int8-grid-k-predict.txt
  owns_files:
  - docs/wsp/verified/int8-beacon-scale.txt
  refutes: >-
    The grid clamp K has to be SWEPT. Beacon (arXiv:2508.20293) shows the scale can be solved instead of searched:
    quantise on an unscaled integer grid, then take the least-squares optimal scale c = <Xw,Xq>/||Xq||^2 per
    channel. If a closed-form scale fitted to the fp16 reference reaches the swept K's picture on the ladder, the
    sweep, its two candidates and the start-up guard all disappear. If it lands at the linear proxy's 4/22, then
    the refutation has a citation and a number instead of a hunch.
  acceptance: >-
    (a) Per-hop output scales fitted in closed form from the int8 codes and the fp16 reference activation, no
    backprop and no build. (b) The same ladder as `int8-grid-k-predict.txt`: 22 models, 3 held-out frames, the same
    picture statistic, so the comparison is per model and not an average. (c) Verdict on agreement with the ladder's
    per-model winner and on the share itself. Falsifier: agreement <= 4/22, i.e. no better than the linear error
    sum that was already refuted.
  note: >-
    From the prior-art pass on 2026-11-20 (docs/wsp/PRIOR-ART-STARTUP-2026-11-20.md). The point is not to save the
    3 s the sweep costs - the sweep is cheap - but to stop choosing a quantisation parameter by rendering, which is
    the only one reason the start-up needs a guard and a cache key.
  resolution: >-
    DONE 2026-11-20, REFUTED by 2000x with the mechanism identified. Per-hop, per-channel scales fitted in closed
    form (c = <y,q>/||q||^2) from the fp16 activations, injected into the build through RVE_INT8_GRID_FIT, on
    Futsuu and three held-out frames: fitted mean share 0.36669% against K=2's 0.00018% (K=3 0.00124%, K=4
    0.00250%); identical 0.00000% on the clean csm frame, which is why one frame is not enough to see it. The
    mechanism is clipping, not the fit: the least-squares grid comes out 1.5-2.8x tighter than the K=2 grid and the
    late hops saturate at the int8 rail - 3.13% of codes at hop 11, 12.50% at hop 14, 31.25% at the last hop,
    against 0.000% for K=2. A least-squares objective has no clipping term, and our grid IS the clipping bound, so
    the closed form is the wrong estimator here (in Beacon's own setting the grid is asymmetric min-max and the
    scale is fitted after rounding). The EC variant corrects the input distribution, not the rail, so it is not the
    reason for the verdict. docs/wsp/verified/int8-beacon-scale.txt, logs/beacon/,
    scripts/beacon_scale_{probe,records}.py.

- id: rve-calib-crops-wiring-2026-11-20
  title: "Wire the measured 15.7x-cheaper crop calibration into the shipped path"
  type: task
  status: done
  owner: '@supervisor'
  priority: P0
  gpu: true
  cost: 1d
  tags:
  - int8
  - startup
  - calibration
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - backend/src/utils/Int8Probe.py
  - docs/wsp/verified/int8-calibration-crops.txt
  - docs/wsp/verified/startup-split.txt
  owns_files:
  - docs/wsp/verified/int8-calib-crops-wired.txt
  refutes: >-
    Calibration has to run the fp16 model over full 1080p frames. `int8-calibration-crops.txt` measured the
    opposite on 2026-11-18: 96 crops of 256x256 calibrate in 0.45 s against 7.09 s for 24 full frames (15.7x), and
    the worst held-out share got BETTER (0.01881% against 0.02256%). That measurement was never wired: there is no
    crop code in Int8Body or Int8Probe today, and the app still pays 12.62 s measuring 16 full frames plus 4.69 s
    decoding them, inside a 23.89 s block.
  acceptance: >-
    (a) Crops behind a knob (RVE_INT8_CALIB_CROPS, default off until measured), used by BOTH calibration paths -
    the probe's and the body's, because the body measures its own grids on the 24 frames the app hands it.
    (b) The start-up split re-measured on the same instrument: the 12.62 s measure block and the 23.89 s total.
    (c) The 494-frame pair on BD Violet against the shipped calibration, worst-frame share, the lane's 0.1% bar -
    the crops page has n=1 per arm and says a repeat is owed before the default moves. Falsifier: any frame above
    the bar, or a start-up that does not fall.
  note: >-
    This is the only lever found so far that attacks the block that actually costs. The prior-art pass suggested
    DRAQ (per-frame range) for it, but that mechanism is incompatible with weights-baked grids (see the DRAQ row).
  resolution: >-
    DONE 2026-11-20 and ON BY DEFAULT (RVE_INT8_CALIB_CROPS=4, both calibration paths; =0 restores full frames).
    Probe calibration 12.635 -> 0.563 s (22.4x), body calibration 2.095 -> 0.287 s (7.3x), start-up to the first
    frame 33.15 -> 9.79 s (SC001-SC004 against ST001-ST004, same timestamped-stdout instrument). Picture: three
    held-out frames equal or better (0.000161 -> 0.000117%, 0.000382 -> 0.000201%), and the 494-frame lossless
    pair reads worst share 0.00005% (frame 276), 0 frames above the 0.1% bar, worst block mean 1.65, peak 11.
    Crop count is part of the calibration-cache key, so an entry cannot be read across the two populations.
    docs/wsp/verified/int8-calib-crops-wired.txt, logs/calib-crops/, scripts/calib_crops_{probe,records}.py.

- id: rve-draq-online-range-2026-11-20
  title: "Per-frame activation range (DRAQ) instead of the 16-frame calibration"
  type: experiment
  status: dropped
  owner: '@supervisor'
  priority: P1
  gpu: true
  cost: 1d
  tags:
  - int8
  - quantisation
  - startup
  - prior-art
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/wsp/verified/startup-split.txt
  - docs/wsp/PRIOR-ART-STARTUP-2026-11-20.md
  owns_files:
  - docs/wsp/verified/int8-online-range.txt
  refutes: >-
    The per-layer scales must come from a decoded calibration set. LSGQuant (arXiv:2602.03182) computes the range
    online from the current input's per-channel max-abs, so no calibration pass exists at all. Ours is the block
    that actually costs: 23.89 s in-app, 29.30 s standalone. If an online range holds the 494-frame pair inside the
    bar, the calibration half of the start-up goes away and the cache key stops being frame-dependent.
  acceptance: >-
    (a) A per-frame range path behind a knob, no change to the default. (b) The 494-frame pair on BD Violet, worst
    frame share, the lane's own bar (0.1% above 8 levels). (c) A temporal check the bar does not cover: the
    frame-to-frame swing of the per-layer range, and the picture delta between consecutive frames against the same
    render with calibration. Falsifier: any frame above the bar, or a visible swing that the pair shows.
  note: >-
    The risk is exactly what the paper does not measure for video SR: a range that moves per frame moves the
    picture per frame. Our harness already measures that - this row is a render pair, not a new instrument.
    DROPPED 2026-11-20, superseded and inapplicable. Superseded: the block it was meant to remove is gone -
    crop calibration took the probe from 12.635 to 0.563 s and the start-up from 33.15 to 9.79 s, which is the
    same 20 seconds DRAQ would have chased, without touching the grid at all. Inapplicable: DRAQ's mechanism does
    not map onto this body. Their scale multiplies the
    activations at runtime; ours is folded into the int8 WEIGHTS at build time (`weight * s_grid` in `_build`), so
    a per-frame range needs a per-frame rebuild (0.44 s x 494 frames). The only shape that survives is calibrating
    from the first N frames of the sequential stream instead of a spread decode, and that is strictly worse than
    the crop row (rve-calib-crops-wiring-2026-11-20) unless crops fail. Row parked at todo until the crop path is
    measured.

- id: rve-price-curvature-predictor-2026-11-20
  title: "A curvature-priced predictor for K, the class the price paper says is correct"
  type: experiment
  status: todo
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 2d
  tags:
  - int8
  - quantisation
  - prior-art
  base_branch: perf/inference
  relates_to:
  - docs/wsp/verified/int8-grid-k-predict.txt
  - docs/wsp/PRIOR-ART-STARTUP-2026-11-20.md
  owns_files:
  - docs/wsp/verified/int8-grid-k-price.txt
  refutes: >-
    K cannot be predicted from the weights. What was refuted is a specific class of predictor: five weight
    statistics and a linear sum of the two measured errors (4/22 at every beta). Predicting Quantization Price
    (arXiv:2609.28270) shows why - reconstruction and diagonal scores drop the output-side curvature and the input
    covariance, so they preserve rankings only when those are constant across candidates. The class that survives
    that argument is the candidate's layer-output error covariance weighted by the fp16 reference's curvature, and
    it has never been scored on our ladder.
  acceptance: >-
    (a) Curvature from the fp16 reference (output-side, per hop) and the candidate's error covariance, computed at
    calibration time, no rendering. (b) The ladder's 22 models x 6 K x 3 held-out frames, same statistic. (c) The
    verdict compared against BOTH baselines: the linear sum (4/22) and the sweep (22/22 by construction). Falsifier:
    ranking no better than 4/22.
  note: >-
    This is the only predictor class in the literature that is not the one we already refuted, and the ladder is a
    ready-made test set. If it fails too, the honest statement becomes stronger: not "we could not predict K" but
    "the correct-priced predictor does not predict K either".

- id: rve-grid-k-learned-2026-11-20
  title: 'Make the grid clamp a LEARNED per-layer parameter (PAMS), instead of a swept constant'
  type: experiment
  status: todo
  owner: '@supervisor'
  priority: P2
  gpu: true
  cost: 3d
  tags:
  - int8
  - quantisation
  - prior-art
  base_branch: perf/inference
  relates_to:
  - backend/src/pytorch/Int8Body.py
  - docs/wsp/PRIOR-ART-2026-11-20.md
  owns_files:
  - docs/wsp/verified/int8-grid-k-learned.txt
  refutes: >-
    The grid clamp has to be chosen: swept at start-up, or predicted from the weights. PAMS (ECCV 2020,
    arXiv:2011.04212) says neither - a trainable truncated parameter per layer explores the quantisation range
    itself, and their 8-bit model BEATS its own FP32 baseline on Set5 (32.095 -> 32.124 dB). Our measurements point
    the same way: the optimum K is interior (weight error has an interior minimum at K=4), model-dependent (2/3/4),
    and unpredictable from any of five weight statistics or from a linear argmin over the two measured errors
    (4/22). If a learned per-layer scale lands at least as low as the best fixed K on the ladder, the start-up
    sweep, its 2x guard and the whole "which K" question disappear.
  acceptance: >-
    (a) Read PAMS properly and state exactly which parameter is learned and against what loss, before writing code.
    (b) Offline first, no training: take the ladder's best fixed K as the baseline and check whether the
    per-layer optimum (a K per layer instead of one per model) beats it on the same three held-out frames - if a
    per-layer choice buys nothing, a learned one will not either, and the row closes there. (c) Only then: a
    training loop that learns the scale (fine-tune the scale only, weights frozen), and a 494-frame pair against
    the current best fixed K.
  note: >-
    Found by the prior-art search of 2026-11-20 (docs/wsp/PRIOR-ART-2026-11-20.md). Filed rather than started
    because it needs a training loop this lane does not have, and because stage (b) - a per-layer K with no
    training - is the cheap falsifier that decides whether the expensive half is worth it.

