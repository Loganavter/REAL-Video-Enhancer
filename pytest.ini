[pytest]
# Why this file exists at all: before it, the suite had no test surface of its own (`pytest.ini`,
# `pyproject.toml`, `setup.cfg`, `tox.ini` were all absent), so a bare `pytest` collected whatever the
# current directory happened to contain and each caller carried its own paths.
#
# Why there is no `addopts` here (plan-rve-transfer-blinktable-2026-11-21 §3, correction 1):
# this repo's interpreter has `pytest` and nothing else - no pytest-randomly, no pytest-timeout, no
# pytest-qt, no xdist. Copying BlinkTable's `--randomly-seed=... --timeout=300` would make EVERY run
# die with "unrecognized arguments" before a single test is collected. The two guards those plugins
# provided live elsewhere instead:
#   * ordering: pytest's default collection order is already deterministic (no shuffling plugin), so
#     nothing has to be pinned;
#   * hangs: `harness/tests/conftest.py` installs a stdlib `faulthandler.dump_traceback_later()` per
#     test (`RVE_TEST_HANG_S`, default 300 s), which prints every thread's stack when a test overruns
#     instead of hanging the run. It never fails a test.
# A worker cell that bakes `-o addopts=""` into its command line stays correct by construction: there
# is no option here for that override to remove.

testpaths = harness/tests

markers =
    slow: long-running evidence sweep; opt in with `-m slow`, it is not deselected by default
